<!-- ============================================================================
  파일명 : console/gov_console.html   (배포 = telos-website/gov/index.html → www.telos.it.kr/gov/)
  작성일 : 2026-09-26 (S690 — 지자체 별도 콘솔 · 대표 지시 "4단계 지자체 콘솔 시작해")

  단일 책임 : 지자체(좌석 계약) 담당자가 ★자기 계약의 어르신만★ 보고,
    ①「살펴볼 분」에서 연락·확인을 기록하고 ② 어르신별 보고서와 ③ 걷기 측정 요약을 뽑는다.
    ★셈도 그림도 하지 않는다★ — 서버 get-walk-report({scope:"gov"})가 준 것을 띄울 뿐이다.

  ★대표 결정 (2026-09-26)★
    · 특별관리는 ★회사 콘솔이 아니라 이 지자체 콘솔★ 에 둔다 — 판매가 시작되면 쓴다.
    · 알림이 아니라 담당자가 여는 목록이다. 어르신·자녀에게 아무것도 보내지 않는다.
    · "앱 덕분에 걸음이 늘었다"를 말하지 않는다 — 목록은 판정이 아니라 ★평소와 달라진 것★ 이다.

  ★회사 콘솔(/admin)과 섞지 않는다★ — 로그인 칸 이름이 다르다(telos_gov_session).
    한 브라우저에서 두 콘솔을 써도 서로의 로그인을 덮지 않는다.
  ★들어오는 길은 구글 하나★(회사 콘솔과 같은 까닭 · 서버도 비밀번호 로그인을 막는다).
  ★보이는 것은 가명과 걷기 수치뿐★ — 실명 표시는 지자체 제3자 제공 동의가 정해진 뒤의 일이다.
  ★PC 전용★.
============================================================================ -->
<style>

body{margin:0;font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
button{font:inherit;cursor:pointer}
#login{max-width:420px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px}
#login h2{margin:0 0 8px;font-size:20px}#login p{color:var(--muted);line-height:1.6;margin:0 0 18px}

#viewer .bar .t{flex:1;font-weight:600}

<body>
<div id="login">
  <h2>텔로스 케어 · 기관 콘솔</h2>
  <p>기관 담당자로 등록된 구글 계정으로 로그인하세요. 담당하시는 어르신의 걷기 기록만 보입니다.</p>
  <div id="loginErr"></div>

<div id="app">
  <header>
    <b>텔로스 케어</b><span>기관 콘솔</span>

<script>
(function(){
  "use strict";
  var SUPA = "https://xeerqdsedmafbqbgqooi.supabase.co";
  // ★공개 전제값(anon)★ — 회사 콘솔에 박힌 것과 같다. 데이터는 로그인 + 담당자 확인을 지나야 나온다.
  var ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhlZXJxZHNlZG1hZmJxYmdxb29pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzMjYzMjksImV4cCI6MjA5MTkwMjMyOX0.Qg91BDcIkfmAt_5TGG5Cro401OXAyW1-Hu9BEObsZks";
  var FN = SUPA + "/functions/v1/get-walk-report";
  // ★(S697) 어르신 추가는 따로 선 함수 — 보고서(읽기)와 등록(쓰기)은 갈래가 다르다★
  var FN_ADD = SUPA + "/functions/v1/institution-add-elder";
  var SESS_KEY = "telos_gov_session";   // ★회사 콘솔(telos_session)과 다른 칸★

  var state = { contracts: [], contractId: null, tab: "attention", overview: null };

  function el(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
  function sess(){ try { var v = localStorage.getItem(SESS_KEY); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
  function setSess(s){ try { if (s) localStorage.setItem(SESS_KEY, JSON.stringify(s)); else localStorage.removeItem(SESS_KEY); } catch(e){} }

  function showLogin(msg){
    el("login").style.display = "block"; el("app").style.display = "none";
    var e = el("loginErr");
    if (msg) { e.innerHTML = msg; e.style.display = "block"; } else { e.style.display = "none"; }
  }
  function showApp(){ el("login").style.display = "none"; el("app").style.display = "block"; }

  function socialLogin(provider){
    var back = location.origin + location.pathname;
    location.href = SUPA + "/auth/v1/authorize?provider=" + provider + "&redirect_to=" + encodeURIComponent(back);
  }
  // ★(S697) ?contract=<id> — 회사 콘솔에서 넘어올 때 고른 기관. 구글 로그인을 다녀오면 주소가 바뀌므로 잠시 적어 둔다★
  var WANT_KEY = "telos_gov_want_contract";
  var WANT_NAME_KEY = "telos_gov_want_name";   // ★(S698) 볼 수 없는 기관일 때 그 이름을 밝히려고 함께 적는다★
  (function rememberWanted(){
    var p = new URLSearchParams(location.search);
    var q = p.get("contract");
    if (q) { try { sessionStorage.setItem(WANT_KEY, q); sessionStorage.setItem(WANT_NAME_KEY, p.get("name") || ""); } catch(e){} }
  })();
  function wantedName(){
    var n = new URLSearchParams(location.search).get("name");
    if (n) return n;
    try { return sessionStorage.getItem(WANT_NAME_KEY) || ""; } catch(e){ return ""; }
  }
  function wantedContract(){
    var q = new URLSearchParams(location.search).get("contract");
    if (q) return q;
    try { return sessionStorage.getItem(WANT_KEY); } catch(e){ return null; }
  }
  function captureHashSession(){
    if (!location.hash || location.hash.indexOf("access_token") < 0) return;
    var p = new URLSearchParams(location.hash.slice(1));
    var at = p.get("access_token");
    if (at) setSess({ access_token: at, refresh_token: p.get("refresh_token") });
    history.replaceState(null, "", location.pathname);
  }
  function refresh(){
    var s = sess();
    if (!s || !s.refresh_token) return Promise.resolve(false);
    return fetch(SUPA + "/auth/v1/token?grant_type=refresh_token", {
      method: "POST", headers: { "apikey": ANON, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: s.refresh_token }),
    }).then(function(r){ return r.json().then(function(j){
      if (!r.ok || !j.access_token) return false;
      setSess({ access_token: j.access_token, refresh_token: j.refresh_token });
      return true;
    }); }).catch(function(){ return false; });
  }
  function call(body, retried){
    var s = sess();
    if (!s) return Promise.reject(new Error("no_session"));
    body.scope = "gov";
    if (state.contractId && !body.contract_id) body.contract_id = state.contractId;
    return fetch(FN, {
      method: "POST",
      headers: { "apikey": ANON, "Authorization": "Bearer " + s.access_token, "Content-Type": "application/json" },
      body: JSON.stringify(body),
    }).then(function(r){
      if (r.status === 401 && !retried) {
        return refresh().then(function(ok){ if (!ok) throw new Error("session_expired"); return call(body, true); });
      }
      if (r.status === 403) return r.json().then(function(j){ throw new Error(j.reason || "forbidden"); });
      if (!r.ok) return r.text().then(function(t){ throw new Error("http_" + r.status + " " + t.slice(0, 160)); });
      return r;
    });
  }
  function fail(e){
    if (e.message === "not_staff") { setSess(null); showLogin("이 계정은 기관 담당자로 등록되어 있지 않습니다.<br>담당 기관이나 텔로스에 등록을 요청해 주세요."); return; }
    if (e.message === "password_login_blocked") { setSess(null); showLogin("비밀번호 로그인은 받지 않습니다. 구글 계정으로 로그인해 주세요."); return; }
    if (e.message === "no_session" || e.message === "session_expired") { setSess(null); showLogin("로그인이 만료되었습니다. 다시 로그인해 주세요."); return; }
    el("main").innerHTML = '<div class="empty">불러오지 못했습니다 — ' + esc(e.message) + "</div>";
  }

  // ── 화면 ──
  function renderAttention(){
    var o = state.overview;
    var list = o.people.filter(function(p){ return p.attention.length > 0; });
    var html = '<div class="note">평소와 달라진 분을 먼저 보여 드립니다. <b>걸음 기록만 보고 만든 목록이며 건강 상태를 판정하지 않습니다.</b> ' +
      '어르신과 자녀에게는 아무것도 보내지 않습니다. 연락하셨으면 기록을 남겨 두세요 — 담당자끼리 겹쳐 연락하지 않게 됩니다.</div>';
    if (!list.length) {
      html += '<div class="empty">지금 살펴볼 분이 없습니다. (어르신 ' + o.people.length + '분 · 최근 ' + o.weeks + '주 기록 기준)</div>';
    }
    html += '<div class="plist">';   // ★(S695) 카드 묶음 — 20장씩 쪽 나눔·찾기가 여기에 붙는다★
    list.forEach(function(p){
      html += '<div class="card warm"><div><h3>' + esc(p.alias) + '</h3>';
      // ★(S696 · 대표 지적 "누군지 가명이고 주소도 모르잖아") 관리번호·연락처 — 동의하신 분만 번호가 있다★
      html += '<div class="reason"><b>관리번호 ' + esc(p.mgmt_no || "없음") + '</b><span>연락처 ' + esc(p.contact || "없음") + '</span></div>';
      p.attention.forEach(function(a){
        html += '<div class="reason"><b>' + esc(a.title) + '</b><span>' + esc(a.detail) + '</span><small>' + esc(a.basis) + '</small></div>';
      });
      if (p.followup) html += '<div class="fu">' + fuText(p.followup) + "</div>";
      html += '</div><div class="acts">' +
        '<button class="pri" data-fu="contacted" data-id="' + esc(p.id) + '">연락함</button>' +
        '<button data-fu="checked" data-id="' + esc(p.id) + '">확인함(연락 안 함)</button>' +
        '<input placeholder="메모(선택)" id="memo-' + esc(p.id) + '" maxlength="500">' +
        '<button data-report="' + esc(p.id) + '" data-alias="' + esc(p.alias) + '">보고서 보기</button></div></div>';
    });
    html += '</div>';
    if (o.never_measured) html += '<div class="note">아직 한 번도 걸음이 잡히지 않은 분이 ' + o.never_measured + '분 있습니다 — 「어르신 전체」에서 설치·권한을 확인해 주세요.</div>';
    el("main").innerHTML = html;
    bindCardButtons();
  }
  function fuText(f){
    var d = new Date(f.at); var when = (d.getMonth() + 1) + "월 " + d.getDate() + "일";
    return (f.kind === "contacted" ? "연락함" : "확인함") + " · " + when + " · " + esc(f.by) + (f.note ? " · " + esc(f.note) : "");
  }
  function renderAll(){
    var o = state.overview;
    var html = '<div class="note">' + esc(o.contract.name) + ' · 어르신 ' + o.people.length + '분 · 최근 ' + o.weeks + '주 기록. 걸음 수는 휴대폰이 스스로 잰 값이라 휴대폰을 두고 다니신 시간은 빠집니다.</div>';
    html += "<table><tr><th>가명</th><th>관리번호</th><th>연락처</th><th>잰 날(" + o.weeks + "주)</th><th>최근 7일 하루 걸음</th><th>평소 4주</th><th>마지막 기록</th><th>살펴볼 까닭</th><th></th></tr>";
    o.people.forEach(function(p){
      html += "<tr><td>" + esc(p.alias) + "</td><td>" + esc(p.mgmt_no || "없음") +
        ' <button data-mgmt="' + esc(p.id) + '" data-cur="' + esc(p.mgmt_no || "") + '">적기</button></td><td>' + esc(p.contact || "없음") +
        "</td><td>" + p.measured_days + "일</td><td>" + (p.recent_steps ? esc(p.recent_steps) + "보" : "—") +
        "</td><td>" + (p.usual_steps ? esc(p.usual_steps) + "보" : "—") + "</td><td>" + esc(p.last_measured || "아직 없음") + "</td><td>" +
        p.attention.map(function(a){ return '<span class="tag">' + esc(a.title) + "</span>"; }).join("") +
        '</td><td><button data-report="' + esc(p.id) + '" data-alias="' + esc(p.alias) + '"' + (p.measured_days ? "" : " disabled") + ">보고서</button> " +
        '<button class="rm" data-remove="' + esc(p.id) + '" data-alias="' + esc(p.alias) + '">빼기</button></td></tr>';
    });
    el("main").innerHTML = html + "</table>";
    bindCardButtons();
  }
  function renderCohort(){
    el("main").innerHTML = '<div class="note">담당하시는 어르신 전체의 걷기 측정 요약 한 장입니다. <b>측정한 변화를 적은 것이며 서비스 이용의 효과를 뜻하지 않습니다.</b></div>' +
      '<div class="empty"><button class="btn-google" id="cohortBtn" style="max-width:280px">요약 열기</button></div>';
    el("cohortBtn").onclick = function(){ openViewer("걷기 측정 요약", { mode: "cohort" }); };
  }
  // ★(S697 · 대표 결정 「1로 진행」) 어르신 추가 — 어르신 폰의 연동 번호(6자리 · 10분)를 넣는다★
  //   담당자는 보호자가 되지 않는다(기관 소속만 켠다 · sql 171). 번호는 어르신이 옆에 계셔야 보인다.
  var ADD_TEXT = {
    ok: "추가했습니다.",
    already: "이미 이 기관에 계신 분입니다.",
    bad_code: "번호가 맞지 않거나 10분이 지났습니다. 어르신 폰에서 번호를 다시 띄워 주세요.",
    other_contract: "다른 기관 계약에 속한 분입니다. 옮기시려면 텔로스에 요청해 주세요.",
    no_seat: "계약한 인원이 다 찼습니다. 인원을 늘리시려면 텔로스에 요청해 주세요.",
    contract_ended: "계약 기간이 끝났습니다. 텔로스에 문의해 주세요.",
    alias_too_long: "가명은 20자까지 적을 수 있습니다.",
    too_many_tries: "틀린 번호를 여러 번 넣으셨습니다. 한 시간 뒤에 다시 해 주세요.",
  };
  function renderAdd(){
    el("main").innerHTML =
      '<div class="note"><b>어르신 폰에서</b> 「부모님 텔로스 케어」 앱을 열고 홈의 <b>「설정」</b>을 누르면 <b>연동 번호 6자리</b>가 나옵니다. ' +
      '그 번호를 10분 안에 아래에 넣어 주세요. 어르신 폰에 떠 있는 번호라서 <b>어르신이 곁에 계실 때만</b> 넣을 수 있습니다.<br>' +
      '추가하셔도 담당자가 보호자로 연결되지는 않습니다. 자녀 연결은 따로입니다.</div>' +
      '<div class="addbox"><div class="grid">' +
      '<label for="addCode">연동 번호</label><input id="addCode" inputmode="numeric" maxlength="7" placeholder="000000" autocomplete="off">' +
      '<label for="addAlias">가명(선택)</label><input id="addAlias" maxlength="20" placeholder="실명 대신 부를 이름">' +
      '<label for="addMgmt">관리번호(선택)</label><input id="addMgmt" maxlength="40" placeholder="기관 명부의 번호">' +
      '<span></span><div><button id="addBtn">추가</button></div></div>' +
      '<div id="addMsg" class="note" style="display:none;margin:14px 0 0"></div></div>';
    el("addBtn").onclick = function(){
      var code = el("addCode").value.replace(/\D/g, "");
      var msg = el("addMsg");
      msg.style.display = "block";
      if (code.length !== 6) { msg.textContent = "연동 번호 6자리를 넣어 주세요."; return; }
      el("addBtn").disabled = true;
      msg.textContent = "확인하는 중…";
      callAdd({ contract_id: state.contractId, code: code, alias: el("addAlias").value.trim() || null, mgmt_no: el("addMgmt").value.trim() || null })
        .then(function(j){
          el("addBtn").disabled = false;
          var t = ADD_TEXT[j.result] || ("추가하지 못했습니다 (" + (j.result || j.error || "알 수 없음") + ")");
          if (j.result === "ok" || j.result === "already") {
            t += " · " + (j.alias ? "가명 " + j.alias : "가명 없음 — 「어르신 전체」에서 확인해 주세요");
            if (j.mgmt_no && j.mgmt_no !== "ok") t += " · 관리번호는 적지 못했습니다 — 「어르신 전체」의 「적기」로 다시 적어 주세요";
            el("addCode").value = ""; el("addAlias").value = ""; el("addMgmt").value = "";
            // 목록만 새로 받아 둔다 — ★화면을 다시 그리면 이 결과 문구가 지워진다★(다른 탭을 누르면 새 목록이 보인다)
            call({ mode: "overview" }).then(function(r){ return r.json(); }).then(function(o){ state.overview = o; }).catch(function(){});
          }
          msg.textContent = t;
        })
        .catch(function(e){
          el("addBtn").disabled = false;
          if (e.message === "no_session" || e.message === "session_expired") return fail(e);
          msg.textContent = "추가하지 못했습니다 — " + e.message;
        });
    };
    el("addCode").onkeydown = function(ev){ if (ev.key === "Enter") el("addBtn").click(); };
    el("addCode").focus();
  }
  function callAdd(body, retried){
    var s = sess();
    if (!s) return Promise.reject(new Error("no_session"));
    return fetch(FN_ADD, {
      method: "POST",
      headers: { "apikey": ANON, "Authorization": "Bearer " + s.access_token, "Content-Type": "application/json" },
      body: JSON.stringify(body),
    }).then(function(r){
      if (r.status === 401 && !retried) {
        return refresh().then(function(ok){ if (!ok) throw new Error("session_expired"); return callAdd(body, true); });
      }
      if (r.status === 404) throw new Error("이 계약의 담당자가 아닙니다");
      return r.json().catch(function(){ return { error: "http_" + r.status }; });
    });
  }

  function render(){
    Array.prototype.forEach.call(document.querySelectorAll("nav button"), function(b){ b.classList.toggle("on", b.getAttribute("data-tab") === state.tab); });
    if (state.tab === "cohort") return renderCohort();
    if (state.tab === "add") return renderAdd();
    if (!state.overview) { el("main").innerHTML = '<div class="empty">불러오는 중…</div>'; return; }
    if (state.tab === "all") renderAll(); else renderAttention();
  }

  function bindCardButtons(){
    // ★(S696) 기관 관리번호 적기 — 기관 명부의 번호(최대 40자) · 빈칸이면 지운다★
    Array.prototype.forEach.call(document.querySelectorAll("[data-mgmt]"), function(b){
      b.onclick = function(){
        var v = prompt("기관 관리번호(기관 명부의 번호 · 비우면 지웁니다)", b.getAttribute("data-cur") || "");
        if (v === null) return;
        b.disabled = true;
        call({ mode: "set_mgmt_no", elderly_id: b.getAttribute("data-mgmt"), mgmt_no: v.trim().slice(0, 40) })
          .then(function(){ return loadOverview(); })
          .catch(function(e){ b.disabled = false; alert("적지 못했습니다: " + e.message); });
      };
    });
    // ★(S697 · 대표 지시 "기관콘솔에서 어르신 삭제도 가능하게") 빼기 = 이 기관에서만 빠진다 · 자료는 안 지운다★
    Array.prototype.forEach.call(document.querySelectorAll("[data-remove]"), function(b){
      b.onclick = function(){
        var alias = b.getAttribute("data-alias");
        if (!confirm(alias + " 님을 이 기관에서 뺍니다.\n\n" +
                     "· 이 기관의 관리번호와 연락처는 곧바로 지워집니다.\n" +
                     "· 어르신의 걸음 기록과 자녀 연결은 지워지지 않습니다.\n" +
                     "· 다시 넣으려면 어르신 폰의 연동 번호를 「어르신 추가」에 넣으면 됩니다.")) return;
        b.disabled = true;
        callAdd({ contract_id: state.contractId, action: "remove", elderly_id: b.getAttribute("data-remove") })
          .then(function(j){
            if (j.result === "ok") return loadOverview();
            b.disabled = false; alert("빼지 못했습니다 (" + (j.result || j.error || "알 수 없음") + ")");
          })
          .catch(function(e){ b.disabled = false; if (e.message === "no_session" || e.message === "session_expired") return fail(e); alert("빼지 못했습니다 — " + e.message); });
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-report]"), function(b){
      b.onclick = function(){ openViewer(b.getAttribute("data-alias") + " 걷기 분석 보고서", { mode: "report", elderly_id: b.getAttribute("data-report") }); };
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-fu]"), function(b){
      b.onclick = function(){
        var id = b.getAttribute("data-id");
        var memo = (el("memo-" + id) || {}).value || null;
        b.disabled = true;
        call({ mode: "followup", elderly_id: id, kind: b.getAttribute("data-fu"), note: memo })
          .then(function(){ return loadOverview(); })
          .catch(function(e){ b.disabled = false; alert("기록하지 못했습니다: " + e.message); });
      };
    });
  }

  function openViewer(title, body){
    el("vTitle").textContent = title + " · 불러오는 중…";
    el("vFrame").srcdoc = "";
    el("viewer").style.display = "block";
    call(body).then(function(r){ return r.text(); }).then(function(h){
      el("vFrame").srcdoc = h; el("vTitle").textContent = title;
    }).catch(function(e){ el("vTitle").textContent = title + " · 불러오지 못했습니다 (" + e.message + ")"; });
  }
  el("vClose").onclick = function(){ el("viewer").style.display = "none"; };
  el("vPrint").onclick = function(){ var w = el("vFrame").contentWindow; if (w) { w.focus(); w.print(); } };

  function loadOverview(){
    return call({ mode: "overview" }).then(function(r){ return r.json(); }).then(function(j){
      state.overview = j; render();
    });
  }

  function boot(){
    call({ mode: "whoami" }).then(function(r){ return r.json(); }).then(function(j){
      showApp();
      el("who").textContent = j.email + (j.admin ? " · 회사 관리자" : "");
      state.contracts = j.contracts;
      var sel = el("contractSel");
      sel.innerHTML = j.contracts.map(function(k){ return '<option value="' + esc(k.id) + '">' + esc(k.name) + "</option>"; }).join("");
      sel.style.display = j.contracts.length > 1 ? "" : "none";
      if (!j.contracts.length) { el("main").innerHTML = '<div class="empty">연결된 계약이 없습니다.</div>'; return; }
      // ★(S697) 회사 콘솔의 「기관 콘솔 열기」가 준 기관을 먼저 연다★
      var want = wantedContract();
      var hit = j.contracts.filter(function(k){ return k.id === want; })[0];
      state.contractId = hit ? hit.id : j.contracts[0].id;
      sel.value = state.contractId;
      sel.onchange = function(){ state.contractId = sel.value; state.overview = null; render(); loadOverview().catch(fail); };
      // ★(S698 · 대표 지적) 볼 수 없는 기관을 요청받으면 ★말없이 다른 기관을 열지 않는다★ —
      //   qhtn77(시험3 담당)로 신흥사랑을 열었더니 시험3 의 빈 목록이 떠서 "한 명도 안 나온다"로 보였다.
      if (want && !hit) {
        var nm = wantedName();
        sel.style.display = "";
        el("main").innerHTML = '<div class="empty">이 계정(<b>' + esc(j.email) + '</b>)은 ' +
          (nm ? "「<b>" + esc(nm) + "</b>」" : "요청하신 기관") + "의 담당자가 아닙니다.<br>" +
          "그 기관 담당자 이메일로 로그인하시거나, 회사 콘솔 「기관 관리」→「편집」→「기관 담당자」에 이 이메일을 넣어 주세요.<br><br>" +
          "이 계정으로 볼 수 있는 기관: <b>" + j.contracts.map(function(k){ return esc(k.name); }).join(", ") + "</b>" +
          '<br><button class="btn-google" id="openOwn" style="max-width:280px;margin-top:14px">볼 수 있는 기관 열기</button></div>';
        try { sessionStorage.removeItem(WANT_KEY); sessionStorage.removeItem(WANT_NAME_KEY); } catch(e){}
        el("openOwn").onclick = function(){ render(); loadOverview().catch(fail); };
        return;
      }
      render();
      return loadOverview();
    }).catch(fail);
  }

  Array.prototype.forEach.call(document.querySelectorAll("nav button"), function(b){
    b.onclick = function(){ state.tab = b.getAttribute("data-tab"); render(); };
  });
  el("googleBtn").onclick = function(){ socialLogin("google"); };
  el("logoutBtn").onclick = function(){ setSess(null); showLogin(null); };

  captureHashSession();
  if (sess()) boot(); else showLogin(null);
})();
</script>
<!-- ★★(S695 · 대표 지시) 목록마다 20줄 · 아래 쪽 번호 · 목록마다 찾기★★
     대표 = "각 항목에 줄수가 너무 많아서 스크롤 아래로 내리기가 힘들어. 각 항목당 표시되는 항목은
     20개 줄로 한정하고, 항목 칸 아래에 페이지를 추가해서 옆으로 이동하는 페이지를 통해 보여줄 수
     있게 해주고, 각 항목별로 검색기능도 추가해줘." (회사 콘솔 · 기관 콘솔 둘 다)
     ★표를 그리는 코드는 한 줄도 안 고친다★ — 화면(data-pager-root)에 표가 새로 그려지면 이 조각이
     스스로 찾아 붙는다(표가 스무 곳이 넘고 60초마다 다시 그려진다 · 한 곳씩 고치면 반드시 빠진다).
     ★숨길 뿐 지우지 않는다★ — 줄의 클릭·정렬·CSV 는 그대로다(CSV 는 화면이 아니라 자료에서 만든다).
     ★두 콘솔에 글자 그대로 같은 조각★ 이다(CSP 가 외부 스크립트를 막아 한 파일로 못 나눈다) — 한쪽만 고치지 말 것. -->
<style>
.pg-bar{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.pg-bar input{flex:0 1 320px;padding:7px 10px;border:1px solid #d5dde3;border-radius:8px;font:inherit;font-size:13px}
.pg-bar .pg-count{font-size:12px;color:#64748b}
.pg-nav{display:flex;align-items:center;justify-content:center;gap:4px;margin:10px 0 2px;flex-wrap:wrap}
.pg-nav button{min-width:32px;padding:5px 9px;border:1px solid #d5dde3;background:#fff;border-radius:6px;font:inherit;font-size:12.5px;cursor:pointer;color:#1f2933}
.pg-nav button.on{background:#17857A;border-color:#17857A;color:#fff;font-weight:600}
.pg-nav button:disabled{opacity:.4;cursor:default}
.pg-nav .pg-gap{padding:0 4px;color:#94a3b8}
.pg-empty{padding:14px;text-align:center;color:#64748b;font-size:13px}
</style>
<script>
(function(){
  "use strict";
  var PAGE = 20;          // 한 쪽에 보이는 줄
  var SEARCH_FROM = 11;   // 이보다 짧은 목록에는 찾기 칸을 달지 않는다(열 줄 안팎은 눈으로 찾는다)
  var memo = {};          // 목록마다 찾는 말·쪽 — 60초 새로고침으로 다시 그려져도 이어진다
  var typing = null;      // 찾기 칸에 치고 있던 목록(다시 그려진 뒤 커서를 돌려준다)

  function keyOf(root, i){
    var on = document.querySelector("nav button.on");
    return (on ? on.getAttribute("data-tab") : "") + (location.hash || "") + "|" + i;
  }
  // 목록의 한 줄들 — 표면 <td> 가 있는 줄(머리 줄 빼고), 카드 묶음(.plist)이면 그 자식들
  function itemsOf(box){
    var out = [], i;
    if (box.tagName === "TABLE") {
      for (i = 0; i < box.rows.length; i++) if (box.rows[i].querySelector("td")) out.push(box.rows[i]);
    } else {
      for (i = 0; i < box.children.length; i++) out.push(box.children[i]);
    }
    return out;
  }
  function btn(label, page, on, off){
    return '<button type="button" data-pg="' + page + '"' + (on ? ' class="on"' : "") + (off ? " disabled" : "") + ">" + label + "</button>";
  }
  function mount(box, key){
    var items = itemsOf(box);
    if (!items.length) return;   // 줄이 나중에 채워지는 빈 표 — 표시하지 않고 다음에 다시 본다
    box.setAttribute("data-pg-done", "1");
    if (items.length <= PAGE && items.length < SEARCH_FROM) return;
    var anchor = box.tagName === "TABLE" && box.parentNode.classList.contains("tablewrap") ? box.parentNode : box;
    var st = memo[key] || (memo[key] = { q: "", page: 0 });
    var bar = null, input = null;
    if (items.length >= SEARCH_FROM) {
      bar = document.createElement("div");
      bar.className = "pg-bar";
      bar.innerHTML = '<input type="search" placeholder="이 목록에서 찾기 — 이름·가명·숫자 아무거나"><span class="pg-count"></span>';
      anchor.parentNode.insertBefore(bar, anchor);
      input = bar.querySelector("input");
      input.value = st.q;
      input.addEventListener("input", function(){ st.q = input.value; st.page = 0; typing = key; draw(); });
      // 다른 칸을 누르셔서 떠나면 새로고침 뒤에 커서를 돌려주지 않는다
      input.addEventListener("blur", function(ev){ if (ev.relatedTarget) typing = null; });
    }
    var nav = document.createElement("div");
    nav.className = "pg-nav";
    anchor.parentNode.insertBefore(nav, anchor.nextSibling);
    var empty = document.createElement("div");
    empty.className = "pg-empty";
    empty.textContent = "찾는 말이 들어간 줄이 없습니다.";
    empty.style.display = "none";
    anchor.parentNode.insertBefore(empty, nav);
    nav.addEventListener("click", function(ev){
      var b = ev.target.closest ? ev.target.closest("button[data-pg]") : null;
      if (!b || b.disabled) return;
      st.page = Number(b.getAttribute("data-pg"));
      draw();
      anchor.scrollIntoView({ block: "nearest" });
    });
    function draw(){
      var q = st.q.trim().toLowerCase();
      var hit = items.filter(function(r){ return !q || r.textContent.toLowerCase().indexOf(q) >= 0; });
      var pages = Math.max(1, Math.ceil(hit.length / PAGE));
      if (st.page >= pages) st.page = pages - 1;
      var from = st.page * PAGE, to = from + PAGE;
      items.forEach(function(r){ r.style.display = "none"; });
      hit.forEach(function(r, i){ if (i >= from && i < to) r.style.display = ""; });
      empty.style.display = hit.length ? "none" : "";
      if (bar) bar.querySelector(".pg-count").textContent = q
        ? "찾은 줄 " + hit.length + " / 전체 " + items.length
        : "전체 " + items.length + "줄" + (pages > 1 ? " · " + (from + 1) + "–" + Math.min(to, hit.length) + "줄" : "");
      if (pages <= 1) { nav.innerHTML = ""; return; }
      var h = btn("‹ 이전", st.page - 1, false, st.page === 0), last = -1;
      for (var p = 0; p < pages; p++) {
        // 쪽이 많으면 처음·끝·지금 언저리만 — 나머지는 …
        if (p === 0 || p === pages - 1 || Math.abs(p - st.page) <= 2) {
          if (last >= 0 && p - last > 1) h += '<span class="pg-gap">…</span>';
          h += btn(String(p + 1), p, p === st.page, false);
          last = p;
        }
      }
      nav.innerHTML = h + btn("다음 ›", st.page + 1, false, st.page >= pages - 1);
    }
    draw();
    var lost = !document.activeElement || document.activeElement === document.body;
    if (input && typing === key && lost) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
  }
  function scan(root){
    var boxes = root.querySelectorAll("table, .plist"), n = 0;
    for (var i = 0; i < boxes.length; i++) {
      var b = boxes[i];
      if (b.tagName === "TABLE" && b.closest(".plist")) continue;
      var key = keyOf(root, n++);
      if (!b.hasAttribute("data-pg-done")) mount(b, key);
    }
  }
  function watch(root){
    var pending = false;
    new MutationObserver(function(){
      if (pending) return;
      pending = true;
      setTimeout(function(){ pending = false; scan(root); }, 0);
    }).observe(root, { childList: true, subtree: true });
    scan(root);
  }
  function start(){
    var roots = document.querySelectorAll("[data-pager-root]");
    for (var i = 0; i < roots.length; i++) watch(roots[i]);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
</script>
