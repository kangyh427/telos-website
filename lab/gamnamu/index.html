<html lang="ko">

<meta property="og:title" content="백 살 감나무">

<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-RXELWTCRMJ',{'allow_google_signals':false,'allow_ad_personalization_signals':false});</script>

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 화면 전체가 해 질 녘 시골 마당(3D) · 오른쪽(휴대폰은 아래) 한지색 판이 한 단계씩 묻는다. 한 가지 세계로 고정한 어두운 화면 */
:root{
  color-scheme:dark;
  --night:#141a2b; --paper:#f3e7d3; --ink:#2b2118; --ink2:#6d5a47;
  --gam:#ee6a1f; --gam2:#ffb347; --line:rgba(43,33,24,.14);
  --display:"Gowun Batang","Noto Serif KR",serif;
  --body:"IBM Plex Sans KR","Noto Sans KR","Malgun Gothic",sans-serif;
}
html,body{height:100%;margin:0;background:var(--night);color:var(--paper);font-family:var(--body);overflow:hidden}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.brand{position:fixed;left:max(20px,env(safe-area-inset-left,0px));top:calc(16px + env(safe-area-inset-top,0px));font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:.02em;text-shadow:0 2px 14px rgba(0,0,0,.55);pointer-events:none}
.brand small{display:block;font-family:var(--body);font-size:13px;font-weight:400;opacity:.86;margin-top:2px}
.hud{position:fixed;left:max(20px,env(safe-area-inset-left,0px));top:calc(84px + env(safe-area-inset-top,0px));pointer-events:none;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.hud b{display:block;font-family:var(--display);font-size:clamp(46px,7vw,76px);line-height:1;color:var(--gam2);font-variant-numeric:tabular-nums}
.hud span{font-size:15px;opacity:.92}
.hud em{display:block;font-style:normal;font-size:13px;opacity:.8;margin-top:6px}
.sheet{position:fixed;right:max(20px,env(safe-area-inset-right,0px));top:20px;bottom:20px;width:min(384px,calc(100vw - 40px));background:var(--paper);color:var(--ink);border-radius:6px;box-shadow:0 24px 60px rgba(0,0,0,.45);display:flex;flex-direction:column;overflow:hidden}
.prog{display:flex;gap:6px;padding:16px 22px 0}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--gam)}
.body{flex:1;min-height:0;overflow-y:auto;padding:16px 22px 12px;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-size:26px;line-height:1.3;margin:0;text-wrap:balance}
p{margin:0;line-height:1.65;font-size:15px;color:var(--ink2)}
label.t{font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
label.t output{font-family:var(--display);font-size:26px;font-weight:700;color:var(--gam);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--gam);height:30px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:14px;padding:9px 13px;border-radius:999px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.big{font-size:16px;padding:12px 22px}
.chip:focus-visible,button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--gam);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two button{font:inherit;font-size:14px;font-weight:600;padding:11px 8px;border-radius:4px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.two button.up{background:rgba(238,106,31,.14);border-color:rgba(238,106,31,.45)}
.two button:disabled{opacity:.45;cursor:default}
.stats{display:grid;grid-template-columns:1fr;border-top:1px solid var(--line)}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.stat span{font-size:14px;color:var(--ink2)}
.stat b{font-family:var(--display);font-size:26px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat.hot b{color:var(--gam)}
.nudge{font-size:14px;line-height:1.55;background:rgba(238,106,31,.12);padding:10px 12px;border-radius:4px;color:var(--ink)}
.nudge b{color:#b8470c}
.grid{display:grid;grid-template-columns:repeat(20,1fr);gap:2px}
.grid i{aspect-ratio:1;border-radius:50%;background:rgba(43,33,24,.18)}
.grid i.left{background:var(--gam)}
.nai{background:var(--ink);color:var(--paper);padding:14px;border-radius:4px;display:flex;flex-direction:column;gap:8px}
.nai h2{font-family:var(--display);font-size:19px;margin:0;line-height:1.4}
.nai p{color:rgba(243,231,211,.86);font-size:14px}
.nai a{color:var(--ink);background:var(--gam2);font-weight:600;font-size:14px;text-decoration:none;padding:10px 12px;border-radius:4px;text-align:center}
.nai small{font-size:12px;opacity:.76;line-height:1.5}
.sib{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:56px 1fr 44px;gap:8px;align-items:center;font-size:14px}
.row div{height:12px;background:var(--line);border-radius:2px;overflow:hidden}
.row div i{display:block;height:100%;background:var(--gam)}
.row b{text-align:right;font-variant-numeric:tabular-nums}
.foot{padding:12px 22px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;border-top:1px solid var(--line)}
.btn{flex:1;font:inherit;font-weight:600;font-size:15px;padding:13px 12px;border-radius:4px;border:0;background:var(--gam);color:#fff;cursor:pointer}
.btn.ghost{flex:0 0 auto;background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.note{font-size:12px;line-height:1.5;color:var(--ink2)}
.perbox{display:flex;align-items:baseline;justify-content:center;gap:8px;padding:6px 0 2px;font-size:15px;color:var(--ink2)}
.perbox b{font-family:var(--display);font-size:38px;color:var(--gam);font-variant-numeric:tabular-nums;line-height:1}
.sim{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.playrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.playrow .go{font:inherit;font-size:14px;font-weight:600;padding:9px 14px;border-radius:4px;border:0;background:var(--ink);color:var(--paper);cursor:pointer}
.saverow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.saverow button{font:inherit;font-size:14px;padding:9px 12px;border-radius:4px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.saverow label{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.saverow input{font:inherit;font-size:13px;padding:6px;border:1px solid var(--line);border-radius:4px;background:transparent;color:var(--ink);color-scheme:light}
.qr{display:flex;gap:12px;align-items:center}
.qr div{flex:none;width:96px;height:96px;background:#fff;padding:4px;border-radius:4px}
.qr svg{width:100%;height:100%;display:block}
.appbtn{position:fixed;left:max(20px,env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));font:inherit;font-size:14px;font-weight:600;padding:11px 16px;border-radius:999px;border:0;background:var(--gam2);color:var(--ink);cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:4px;font-size:14px}
@media (max-width:760px){
  .sheet{left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:auto;bottom:10px;width:auto;max-height:52%}
  .hud{top:calc(70px + env(safe-area-inset-top,0px))}
  .brand{font-size:20px}
  .appbtn{left:auto;right:max(14px,env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));bottom:auto;padding:9px 13px;font-size:13px}
  h1{font-size:22px}
}
</style>

<canvas id="scene" aria-label="부모님 연세만큼 자란 감나무와 시골집 3D 장면"></canvas>
<div class="brand">백 살 감나무<small>부모님과 앞으로 몇 번을 더 뵐 수 있을까요</small></div>
<div class="hud" aria-live="polite"><b id="hudN">112</b><span id="hudL">번 더 뵐 수 있어요</span><em id="hudU"></em></div>

<section class="sheet" aria-label="입력과 결과">
  <div class="prog" id="prog"></div>
  <div class="body" id="body"></div>
  <div class="foot" id="foot"></div>
</section>
<button class="appbtn" id="appBtn" type="button">나이노트 앱 설치</button>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
'use strict';
const track=(n)=>{try{window.gtag&&gtag('event','lab_interest',{slug:'gamnamu',action:n})}catch{}};
const S={mom:true,dad:false,ageM:72,ageD:72,dist:1,per:4,hrs:6,sib:2,step:0,playing:false,sim:0,speed:1,startAt:Date.now()};
const SPEEDS=[{n:'1년 = 20초',s:20},{n:'1년 = 5초',s:5},{n:'1년 = 1초',s:1}];
const DIST=[{n:'같은 동네',d:0,t:'걸어서 갈 거리'},{n:'차로 1시간',d:1,t:'왕복 2시간'},{n:'KTX 거리',d:2,t:'왕복 5시간쯤'},{n:'비행기 거리',d:3,t:'왕복 하루'}];
const HRS=[{n:'식사 한 끼',h:3},{n:'반나절',h:6},{n:'하루 종일',h:12},{n:'1박 2일',h:30}];
const APP='https://play.google.com/store/apps/details?id=com.naoncare.guardian';
const YEAR=365.25*864e5;
const who=()=>S.mom&&S.dad?'부모님':S.mom?'엄마':'아빠';
const refAge=()=>S.mom&&S.dad?Math.min(S.ageM,S.ageD):S.mom?S.ageM:S.ageD;
const elapsed=()=>Math.max(0,(Date.now()-S.startAt)/YEAR);
const nowAge=()=>refAge()+elapsed();
const calc=()=>{const left=Math.max(0,100-nowAge()),meets=Math.round(left*S.per),view=Math.max(0,left-S.sim),seen=Math.min(365,S.per*Math.ceil(S.hrs/24));return{left,meets,view,viewMeets:Math.round(view*S.per),days:Math.round(meets*S.hrs/24),away:365-seen}};
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const MAXG=200;
const gamUnit=m=>Math.max(1,Math.ceil(m/MAXG));

/* ───────── 화면 단계 ───────── */
const STEPS=[stepWho,stepAge,stepVisit,stepResult,stepKeep];
function render(){const b=$('body'),st=b.scrollTop,same=render.k===S.step;render.k=S.step;$('prog').innerHTML=STEPS.map((_,i)=>`<i class="${i<=S.step?'on':''}"></i>`).join('');STEPS[S.step]();updateHud();b.scrollTop=same?st:0}
function nav(next,label){const f=$('foot');f.innerHTML='';if(S.step>0){const b=document.createElement('button');b.className='btn ghost';b.textContent='이전';b.onclick=()=>{S.step--;render()};f.append(b)}const n=document.createElement('button');n.className='btn';n.textContent=label;n.id='nextBtn';n.onclick=next;f.append(n)}
function chips(el,items,cur,on){el.className='chips';items.forEach((t,i)=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=t;b.setAttribute('aria-pressed',i===cur);b.onclick=()=>{[...el.children].forEach(c=>c.setAttribute('aria-pressed',c===b));on(i)};el.append(b)})}
function stepWho(){
  $('body').innerHTML=`<h1>누구의 감나무를 심을까요?</h1><p>두 분 다 계시면 둘 다 눌러 주세요. 감 하나가 앞으로 뵐 한 번입니다.</p><div class="chips"><button id="pM" type="button" class="chip big" aria-pressed="${S.mom}">엄마</button><button id="pD" type="button" class="chip big" aria-pressed="${S.dad}">아빠</button></div><p class="note">부모님이 100세까지 곁에 계신다고 하고 헤아립니다. 입력하신 내용은 이 화면에서만 쓰고 저장하지 않습니다.</p>`;
  const set=()=>{$('pM').setAttribute('aria-pressed',S.mom);$('pD').setAttribute('aria-pressed',S.dad);setScene();updateHud()};
  $('pM').onclick=()=>{if(S.mom&&!S.dad)return;S.mom=!S.mom;set()};
  $('pD').onclick=()=>{if(S.dad&&!S.mom)return;S.dad=!S.dad;set()};
  nav(()=>{S.step=1;render()},'심기');
}
function stepAge(){
  const one=(k,n,key)=>`<label class="t" for="${k}">${n} 연세<output id="${k}O">${S[key]}세</output></label><input id="${k}" type="range" min="50" max="99" value="${S[key]}">`;
  $('body').innerHTML=`<h1>올해 연세가 어떻게 되세요?</h1><p>움직여 보세요. 나무가 그 연세만큼 자랍니다.</p>${S.mom?one('aM','엄마','ageM'):''}${S.dad?one('aD','아빠','ageD'):''}<div class="stats"><div class="stat"><span>100세까지</span><b id="leftO"></b></div></div>${S.mom&&S.dad?'<p class="note">두 분이면 더 젊으신 분 기준으로 셉니다.</p>':''}`;
  const u=()=>{$('leftO').textContent=Math.round(calc().left)+'해';updateHud();setScene()};
  if(S.mom)$('aM').oninput=e=>{S.ageM=+e.target.value;$('aMO').textContent=S.ageM+'세';u()};
  if(S.dad)$('aD').oninput=e=>{S.ageD=+e.target.value;$('aDO').textContent=S.ageD+'세';u()};
  u();nav(()=>{S.step=2;render()},'다음');
}
function stepVisit(){
  $('body').innerHTML=`<h1>${who()==='엄마'?'엄마는':who()==='아빠'?'아빠는':'부모님은'} 얼마나 멀리 계세요?</h1><div id="c2"></div><label class="t" for="per">1년에 뵙는 횟수<output id="perO">${S.per}번</output></label><input id="per" type="range" min="1" max="52" value="${S.per}"><p id="perH" class="note"></p><label class="t" style="margin-top:2px">한 번 뵐 때</label><div id="c3"></div>`;
  chips($('c2'),DIST.map(d=>d.n),S.dist,i=>{S.dist=i;S.per=[24,8,4,2][i];$('per').value=S.per;u()});
  chips($('c3'),HRS.map(h=>h.n),HRS.findIndex(h=>h.h===S.hrs),i=>{S.hrs=HRS[i].h;u()});
  const u=()=>{$('perO').textContent=S.per+'번';$('perH').textContent=`움직이면 감이 바로 늘고 줄어듭니다 · ${DIST[S.dist].t}`;updateHud();setScene()};
  $('per').oninput=e=>{S.per=+e.target.value;u()};u();
  nav(()=>{S.step=3;render()},'결과 보기');
}
function stepResult(){
  if(!stepResult.seen){stepResult.seen=1;track('result')}
  const c=calc(),more=2*Math.round(c.left),moreD=Math.round(more*S.hrs/24),d=new Date(S.startAt),iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  $('body').innerHTML=`<h1>${who()}, 앞으로 ${fmt(c.meets)}번</h1>
  <div class="perbox"><span>지금 1년에</span><b>${S.per}번</b><span>뵙습니다</span></div>
  <div class="two"><button type="button" id="less">1년에 2번 덜 뵙기</button><button type="button" id="plus" class="up">1년에 2번 더 뵙기</button></div>
  <div class="stats"><div class="stat hot"><span>함께 있을 시간</span><b>${fmt(c.days)}일</b></div><div class="stat"><span>1년 중 못 뵙는 날</span><b>${c.away}일</b></div><div class="stat"><span>남은 설 · 추석</span><b>${Math.round(c.left)*2}번</b></div></div>
  <div class="nudge">1년에 <b>딱 2번만 더</b> 뵈면 <b>${fmt(more)}번</b>이 늘고, 함께할 시간이 <b>${fmt(moreD)}일</b> 더 생깁니다.</div>
  <div class="sim"><label class="t" for="sim">시간을 앞으로 돌려 보기<output id="simO"></output></label><input id="sim" type="range" min="0" max="${Math.round(c.left)}" step="1" value="${Math.round(S.sim)}"><p id="simT" class="note"></p>
  <div class="playrow"><button class="go" id="goBtn" type="button">${S.playing?'멈추기':'재생'}</button><div id="spd"></div><button class="go" id="backNow" type="button" style="background:transparent;color:var(--ink);border:1px solid var(--line)">지금으로</button></div>
  <p class="note">허리와 걸음의 변화는 시간이 흐르는 모습을 그림으로 나타낸 것이며, 실제 건강을 예측하지 않습니다.</p></div>
  <div><p class="note" style="margin-bottom:6px">100칸 = 100년 · 주황 = 앞으로 함께할 해</p><div class="grid" id="grid"></div></div>
  <div class="saverow"><label for="base">기준일 <input type="date" id="base" value="${iso}" max="${new Date().toISOString().slice(0,10)}"></label><button type="button" id="saveB">이 감나무 저장</button><button type="button" id="resetB">처음부터</button></div>
  <p class="note">저장하면 다시 열었을 때 기준일부터 흐른 실제 시간만큼 남은 횟수가 줄어든 모습으로 보입니다. 지금은 이 기기에만 저장되며, 회원 저장은 준비 중입니다. 저장하지 않아도 언제든 처음 화면부터 쓸 수 있습니다.</p>
  <p class="note">100세까지 곁에 계신다고 가정한 셈입니다. 수명을 예측하지 않습니다.</p>`;
  drawGrid();
  $('less').disabled=S.per<=1;$('plus').disabled=S.per>=52;
  $('plus').onclick=()=>{S.per=Math.min(52,S.per+2);render();setScene();visitOnce()};
  $('less').onclick=()=>{S.per=Math.max(1,S.per-2);render();setScene()};
  chips($('spd'),SPEEDS.map(x=>x.n),S.speed,i=>{S.speed=i});
  $('sim').oninput=e=>{S.playing=false;S.sim=+e.target.value;applySim()};
  $('goBtn').onclick=()=>S.playing?(S.playing=false):play();
  $('backNow').onclick=()=>{S.playing=false;S.sim=0;goal=SEASON.autumn;applySim();$('sim').value=0};
  $('base').onchange=e=>{const t=Date.parse(e.target.value);if(!isNaN(t)){S.startAt=Math.min(t,Date.now());S.sim=0;render();setScene()}};

  for(const[x,z]of[[-.46,.6],[.46,.6],[-.46,-.6],[.46,-.6]]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.17,.17,.14,12),std(0x1b1b1f));w.rotation.z=Math.PI/2;w.position.set(x,.17,z);car.add(w)}
  car.visible=false;scene.add(car);

let roadCurve=null,dragYaw=0,camR=20,clockT=0,last=0,zoom=1;
const GATE=V(2.9,0,-3.1);
function buildRoad(){
  // 길: 멀리 자녀가 사는 곳에서 마당 입구까지 이어지는 흙길(거리를 고르면 길이가 바뀜)
  const L=[12,50,95,150][S.dist],end=V(L*.34+12,0,-L*.95-30),pts=[GATE.clone(),V(4.6,0,-9),V(7.5,0,-19),V(9.5,0,-30),end];
  roadCurve=new THREE.CatmullRomCurve3(pts);
  const N=140,pos=[],idx=[],W=.72;
  for(let i=0;i<=N;i++){const t=i/N,p=roadCurve.getPoint(t),d=roadCurve.getTangent(t),s=V(-d.z,0,d.x).normalize();
    for(const k of[-1,1]){const x=p.x+s.x*W*k,z=p.z+s.z*W*k;pos.push(x,groundY(x,z)+.06,z)}
    if(i<N){const a=i*2;idx.push(a,a+2,a+1,a+1,a+2,a+3)}}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();
  if(roadMesh){roadMesh.geometry.dispose();roadMesh.geometry=g}else{roadMesh=new THREE.Mesh(g,std(0x9a7e58,{roughness:1,side:THREE.DoubleSide}));roadMesh.receiveShadow=true;scene.add(roadMesh)}
  city.position.set(end.x+1,groundY(end.x,end.z),end.z-5);const cs=[.5,.8,1.05,1.3][S.dist];city.scale.setScalar(cs);
}
function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
function setScene(){
  target.d=S.dist;mom.visible=S.mom;dad.visible=S.dad;applySim();
  if(buildRoad.k!==S.dist){buildRoad.k=S.dist;buildRoad()}
}
function setGam(n){gamMeta.forEach((g,i)=>{if(i<n){if(g.to===0||g.fall>0){g.to=1;g.fall=0;g.y=0;g.v=0}}else if(g.to===1){g.to=0;g.fall=reduced?0:1;g.v=0;g.y=0}})}

/* 자녀 방문: 차로 와서 내려 → 부모님께 걸어가 만나고 → 감 하나 → 돌아감 */
const visit={on:false,t:0,dur:4,onMeet:null,done:null,met:false};
function startVisit(dur,onMeet){return new Promise(res=>{Object.assign(visit,{on:true,t:0,dur,onMeet,done:res,met:false});kid.visible=true})}
async function visitOnce(){if(visit.on||S.playing)return;await startVisit(5,null)}
function parentsPos(){return V(Math.cos(walkA)*3.6,0,Math.sin(walkA)*3.6)}
let walkA=1.2,angM=1.2,angD=1.2,phase=0;
function stepVisitAnim(dt){
  if(!visit.on)return;visit.t+=dt/visit.dur;const t=visit.t,useCar=S.dist>0&&visit.dur>1.2;
  const tp=parentsPos().add(V(.0,0,0)),gate=GATE.clone(),meetAt=tp.clone().add(gate.clone().sub(tp).normalize().multiplyScalar(.9));
  const ep=x=>x*x*(3-2*x),seg=(a,b)=>THREE.MathUtils.clamp((t-a)/(b-a),0,1);
  // 차
  if(useCar){car.visible=t<.32||t>.7;const ct=t<.3?1-ep(seg(0,.3))*.985:(t>.72?ep(seg(.72,1))*.985+.015:.015),rt=ct*.5;const p=roadCurve.getPoint(rt);car.position.set(p.x,groundY(p.x,p.z)+.06,p.z);const d=roadCurve.getTangent(rt);car.rotation.y=Math.atan2(d.x,d.z)+(t<.3?Math.PI:0)}else car.visible=false;

  else if(t<.6){kid.visible=true;p=meetAt}
  else if(t<.74){kid.visible=true;p=meetAt.clone().lerp(gate,ep(seg(.6,.74)))}

}
function tick(ts){

  const gs=tree.scale.x+(target.grow-tree.scale.x)*Math.min(1,dt*3.2);tree.scale.setScalar(gs||.5);
  const k=Math.min(1,dt*2.4);cur.top.lerp(new THREE.Color(goal.top),k);cur.bot.lerp(new THREE.Color(goal.bot),k);cur.leaf.lerp(new THREE.Color(goal.leaf),k);cur.ground.lerp(new THREE.Color(goal.ground),k);
  cur.dens+=(goal.dens-cur.dens)*k;cur.snow+=(goal.snow-cur.snow)*k;
  leaf.material.color.copy(cur.leaf).lerp(new THREE.Color(0xffffff),.45);ground.material.color.copy(cur.ground);scene.fog.color.copy(cur.bot).lerp(cur.top,.28);
  ridges.forEach(m=>m.material.color.copy(m.userData.base).lerp(cur.bot,.3));
  const M=new THREE.Matrix4(),Q=new THREE.Quaternion(),Sv=V();
  leaf.userData.base.forEach((b,i)=>{const sc=b.k<cur.dens?b.s:0;Sv.set(sc,sc,sc);M.compose(b.p,b.q,Sv);leaf.setMatrixAt(i,M)});leaf.instanceMatrix.needsUpdate=true;
  gamMeta.forEach((g,i)=>{
    if(g.fall>0){g.v+=dt*9;g.y+=g.v*dt;g.fall-=dt*.9;g.s=Math.max(0,Math.min(1,g.fall*2));if(g.fall<=0){g.s=0;g.y=0}}
    else g.s+=(g.to-g.s)*Math.min(1,dt*(g.to?7:14));
    const sw=Math.sin(clockT*1.3+g.ph)*.018,pop=g.to&&g.s<.98?1+Math.sin(g.s*3.14)*.35:1,s=g.s*pop;
    Sv.set(s,s*.92,s);M.compose(V(g.p.x+sw,g.p.y-g.y/Math.max(.3,tree.scale.x),g.p.z),Q,Sv);gam.setMatrixAt(i,M)});
  gam.instanceMatrix.needsUpdate=true;
  // 부모님 걷기(두 분이면 손잡고 나란히 · 나이가 들수록 허리가 굽고 느려짐 · 100세가 되면 멈춰 그 자리에 서 계심)
  const paused=visit.on&&visit.t>.34&&visit.t<.62,el=elapsed()+S.sim;
  const old=a=>THREE.MathUtils.clamp((a+el-74)/24,0,1),oM=old(S.ageM),oD=old(S.ageD);
  const doneM=S.ageM+el>=100,doneD=S.ageD+el>=100,goM=S.mom&&!doneM,goD=S.dad&&!doneD;
  const oW=Math.max(goM?oM:0,goD?oD:0);

  if(goM)angM=walkA;if(goD)angD=walkA;
  const cad=THREE.MathUtils.lerp(4.8,2.2,oW),amp=THREE.MathUtils.lerp(.44,.14,oW);phase+=dt*cad;
  const both=goM&&goD,two=S.mom&&S.dad,inner=two?3.28:3.6,outer=two?3.92:3.6;
  [[mom,inner,oM,angM,!goM],[dad,outer,oD,angD,!goD]].forEach(([p,r,o,ang,stop],idx)=>{
    p.position.set(Math.cos(ang)*r,paused||stop?0:Math.abs(Math.sin(phase))*.025*(1-o*.7),Math.sin(ang)*r);
    p.rotation.y=paused?Math.atan2(kid.position.x-p.position.x,kid.position.z-p.position.z):-ang;
    swing(p,phase+idx*.4,paused||stop?0:amp);
    const u=p.userData,lean=.03+o*.5;u.up.rotation.x=lean;u.hd.rotation.x=-lean*.72;u.cane.visible=o>.42;

  cam.position.set(cx,wide?5.6:7.4,cz);cam.lookAt(lx,wide?3.5:-.4,lz);

}

/* 시간 시뮬레이션: 고른 배속으로 시간이 흐르며 자녀가 다녀갈 때마다 감이 떨어짐 */
async function play(){
  if(S.playing)return;track('play');S.playing=true;applySim();
  const seasons=[SEASON.spring,SEASON.summer,SEASON.autumn,SEASON.winter],left=calc().left;
  if(S.sim>=Math.floor(left))S.sim=0;
  while(S.playing&&S.sim<left-1e-6){
    let d=SPEEDS[S.speed].s/S.per,step=1/S.per;if(d<.5){const k=Math.ceil(.5/d);d*=k;step*=k}
    goal=seasons[Math.floor((S.sim%1)*4)];
    await startVisit(reduced?.3:d,()=>{S.sim=Math.min(left,S.sim+step);applySim()});
  }
  const end=S.sim>=left-1e-6;S.playing=false;goal=SEASON.autumn;applySim();
  if(end){$('hudU').textContent=`${who()} 100세 · 함께한 시간 ${fmt(calc().days)}일`;$('hudL').textContent='모두 함께했습니다'}
}
function load(){try{const v=JSON.parse(localStorage.getItem('gamnamu')||'null');if(v){Object.assign(S,v);S.step=3;return Math.floor(elapsed()*365.25)}}catch{}return -1}
const was=load();
try{if(!window.THREE)throw 0;init();setScene();tree.scale.setScalar(.3)}catch(e){console.error(e);$('scene').style.background='linear-gradient(#24305f,#f2a877)'}
render();
if(was>=0)toast(`저장한 감나무를 열었습니다 · 기준일부터 ${was}일 지났습니다`);
$('appBtn').onclick=()=>{track('app_panel');S.step=4;render()};
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href*="play.google"]');if(a)track('app_install')});
setInterval(()=>{if(!S.playing&&!S.sim)updateHud()},30000);
