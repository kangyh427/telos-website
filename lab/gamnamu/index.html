  // 부모님(두 분이면 손잡고 나란히 · 나이가 들수록 허리가 굽고 느려짐 · 100세가 되면 멈춰 그 자리에 계심)
  const paused=visit.on&&visit.t>.34&&visit.t<.62,el=elapsed()+S.sim;
  const old=a=>THREE.MathUtils.clamp((a+el-74)/24,0,1),oM=old(S.ageM),oD=old(S.ageD);
  const doneM=S.ageM+el>=100,doneD=S.ageD+el>=100,goM=S.mom&&!doneM,goD=S.dad&&!doneD;
  const oW=Math.max(goM?oM:0,goD?oD:0);day.k=1-.5*oW;
  if(!paused&&(goM||goD))stepDay(dt,THREE.MathUtils.lerp(.86,.22,oW));
  const moving=day.moving&&!paused,cad=THREE.MathUtils.lerp(4.8,2.2,oW),amp=THREE.MathUtils.lerp(.44,.14,oW);phase+=dt*cad;
  const both=goM&&goD,side=S.mom&&S.dad?.32:0,sa=Math.sin(day.h),ca=Math.cos(day.h),es=ease(day.sit),eb=ease(day.bend),eg=ease(day.shade);
  [[mom,-side,oM,!goM],[dad,side,oD,!goD]].forEach(([p,off,o,stop],idx)=>{
    const u=p.userData;if(!stop)u.s=es;const sit=u.s||0;
    if(!stop){const x=day.x+ca*off,z=day.z-sa*off;p.position.set(x,(1-sit)*groundY(x,z)+sit*.3+(moving?Math.abs(Math.sin(phase))*.025*(1-o*.7):0),z)}
    if(paused&&sit<.5)p.rotation.y=Math.atan2(kid.position.x-p.position.x,kid.position.z-p.position.z);else if(!stop)p.rotation.y=day.h;
    swing(p,phase+idx*.4,moving&&!stop?amp:0);u.legL.rotation.x-=1.25*sit;u.legR.rotation.x-=1.25*sit;
    const lean=.03+o*.5,b=stop?0:eb,g=stop?0:eg;u.up.rotation.x=lean*(1-.5*sit)+.62*b;u.hd.rotation.x=-lean*.72-.42*b-.16*g;u.cane.visible=o>.42&&sit<.1;
    u.armL.rotation.set(0,0,0);u.armR.rotation.set(0,0,0);
    const free=both&&p===mom?u.armL:u.armR,hold=p===mom?u.armR:u.armL;
    if(paused&&sit<.5){u.armR.rotation.x=-1.1;u.armL.rotation.x=-.8;return}

/* 시간 시뮬레이션: 고른 배속으로 시간이 흐르며 자녀가 다녀갈 때마다 감이 떨어짐 */
async function play(){
  if(S.playing)return;track('play');S.playing=true;applySim();
  const seasons=[SEASON.spring,SEASON.summer,SEASON.autumn,SEASON.winter],left=calc().left;
  if(S.sim>=Math.floor(left))S.sim=0;
  while(S.playing&&S.sim<left-1e-6){
    let d=SPEEDS[S.speed].s/S.per,step=1/S.per;if(d<.5){const k=Math.ceil(.5/d);d*=k;step*=k}
    goal=seasons[Math.floor((S.sim%1)*4)];
    await startVisit(reduced?.3:d,()=>{S.sim=Math.min(left,S.sim+step);applySim()});
  }
  const end=S.sim>=left-1e-6;S.playing=false;goal=SEASON.autumn;applySim();
  if(end){$('hudU').textContent=`${who()} 100세 · 함께한 시간 ${fmt(calc().days)}일`;$('hudL').textContent='모두 함께했습니다'}
}

/* 배경음악: 기본은 켜짐 · 브라우저가 첫 손길 전 소리를 막으면 첫 손길에 시작 · 끈 사람은 기억 · 네 곡을 이어 듣고 처음으로 돌아감 */
const bgm={el:null,i:0,on:false,raf:0,vol:.55,n:4};
function bgmFade(to,ms,done){const a=bgm.el,from=a.volume,t0=performance.now();cancelAnimationFrame(bgm.raf);
  const tick=t=>{const k=THREE.MathUtils.clamp((t-t0)/ms,0,1);a.volume=from+(to-from)*k;if(k<1)bgm.raf=requestAnimationFrame(tick);else if(done)done()};
  bgm.raf=requestAnimationFrame(tick)}
function bgmBtn(){const b=$('musicBtn');b.textContent=bgm.on?'음악 끄기':'음악 켜기';b.setAttribute('aria-pressed',bgm.on);$('volBox').hidden=!bgm.on||bgm.fixed}
function bgmSrc(){bgm.el.src=`music/${bgm.i+1}.mp3`}
async function setMusic(on,quiet){
  if(!on){bgm.on=false;bgmBtn();bgmFade(0,900,()=>bgm.el.pause());return}
  if(!bgm.el){
    const a=bgm.el=new Audio();a.preload='none';a.volume=.5;bgm.fixed=a.volume!==.5;a.volume=0; // 아이폰은 소리 크기를 코드로 못 바꿔 막대를 숨기고 기기 단추에 맡김
    a.onended=()=>{bgm.i=(bgm.i+1)%bgm.n;bgmSrc();a.play().catch(()=>{})};
    a.onerror=()=>{bgm.on=false;bgmBtn();toast('음악을 불러오지 못했습니다')};
    bgm.i=Math.floor(Math.random()*bgm.n);bgmSrc(); // 첫 곡은 무작위 · 그 뒤로는 차례대로
  }
  bgm.on=true;bgmBtn();
  try{await bgm.el.play();bgmFade(bgm.vol,2500);track('music_on');return true}catch{if(quiet)return false;bgm.on=false;bgmBtn();toast('음악을 틀 수 없습니다');return false}
}
function bgmAuto(){
  try{if(localStorage.getItem('gamnamuMusic')==='off')return}catch{}
  const evs=['click','touchend','keydown'],un=()=>evs.forEach(n=>removeEventListener(n,go,true)),go=e=>{if(e.target.closest&&e.target.closest('#musicBtn'))return;un();setMusic(true)};
  bgm.stop=un;evs.forEach(n=>addEventListener(n,go,true));
  setMusic(true,true).then(ok=>{if(ok)un()});
}
function load(){try{const v=JSON.parse(localStorage.getItem('gamnamu')||'null');if(v){Object.assign(S,v);S.done=true;return Math.floor(elapsed()*365.25)}}catch{}return -1}
const was=load();
try{if(!window.THREE)throw 0;init();setScene();tree.scale.setScalar(.3)}catch(e){console.error(e);$('scene').style.background='linear-gradient(#24305f,#f2a877)'}
render();
if(was>=0)closePanel();
if(was>=0)toast(`저장한 감나무를 열었습니다 · 기준일부터 ${was}일 지났습니다`);
if(TO_WEB)$('appBtn').textContent='나이노트 웹으로 보기';

document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href*="play.google"],a[href*="app.telos"]');if(a)track('app_install')});
$('timeBtn').onclick=()=>openPanel(3);
$('musicBtn').onclick=()=>{const v=!bgm.on;try{localStorage.setItem('gamnamuMusic',v?'on':'off')}catch{}if(bgm.stop)bgm.stop();setMusic(v)};

try{const v=localStorage.getItem('gamnamuVol');if(v!==null){bgm.vol=v/100;$('volR').value=v}}catch{}
$('volR').oninput=e=>{bgm.vol=e.target.value/100;cancelAnimationFrame(bgm.raf);if(bgm.el)bgm.el.volume=bgm.vol;try{localStorage.setItem('gamnamuVol',e.target.value)}catch{}};
document.addEventListener('visibilitychange',()=>{if(bgm.el&&bgm.on)document.hidden?bgm.el.pause():bgm.el.play().catch(()=>{})});

$('closeBtn').onclick=closePanel;
$('body').addEventListener('scroll',moreHint);addEventListener('resize',moreHint);
