<!-- ============================================================================
  텔로스 케어 · 관리자 콘솔 (정적 1장 · 외부 라이브러리 0 · SVG 자체 생성)
  정본: naoncare-edge/console/admin_console.html
  배치: telos-website/admin/index.html  →  https://www.telos.it.kr/admin
  수정: 2026-08-08 (S525 — ★의미층 개요 재구성: 추이 → 정렬 상태판 → 전후 비교 · docs/72 §4)
        2026-07-27 (S497 — ★정보구조 재설계: 개요 → 목록 → 상세 드릴다운, 대표 지적)

  ★★(S525) 개요의 순서가 곧 이 콘솔의 주장이다 — docs/72 §4:
      전체 추이 한 선(지금 효과가 나는가) → 어르신 상태판(누가 나빠지는가 · 아무 열이나
      눌러 정렬) → 전후 비교(얼마나 달라졌는가) → 기기·집계 → 내려받기.
    · 종전 "어르신 목록" 표는 ★삭제★ 했다(상태판이 대체 · 두 표가 나란히 있는 것이
      대표가 "중구난방"이라 한 상태다).
    · ★값은 화면이 계산하지 않는다★ — 전부 서버 뷰(032·033)에서 접어서 온다.
      같은 계산이 두 곳에 생기면 언젠가 두 숫자가 갈라지고 무엇이 참인지 아무도 모른다.
    · ★경보는 그리는 김에 서버에 남긴다★(console_record_alerts) — 표⑥의 왼쪽 끝.
      판정은 여전히 콘솔이 하고, 날짜는 서버가 KST 로 찍는다.

  ★이 콘솔이 답하려는 질문(한 줄): "우리 서비스가 어르신 한 분 한 분의 사회적 연결을
    늘리고 있는가?" — 그래서 화면은 ①회사 전체 ②어르신 목록 ③개인 상세 3층으로만 간다.

  ★재설계 이유(대표 지적, 전부 타당했다):
    · 회사 숫자와 개인 숫자가 한 화면에 섞여 "뭘 나타내는지 모르겠다"
    · 차트에 ★누구 것인지 표시가 없었다★(14일 접촉=전원 합계인데 아무 표시 없음)
    · 어디도 클릭해 들어갈 수 없어 개인 추적이 불가능했다
    · "연결 추세 평균 -50" = ★서로 다른 사람의 변화율을 섞은 무의미한 숫자★ → 제거하고
      분포(오름/유지/내림/측정중 인원수)로 대체. 평균 한 개는 아무에게도 답을 주지 않는다.

  ★두 가지 "주차"가 다르다(섞으면 안 되어 화면에 명시한다):
    · 어르신 주차 = 그 어르신 ★등록일 기준★ 1주차·2주차…(connection_weekly)
    · 회사 주차   = 달력 주(월요일 시작, effect_company_weekly)

  ★보안: 로그인(Supabase Auth) + console_admin 이메일 허용목록. 이 파일에 비밀 없음
    (박힌 것은 브라우저 노출 전제인 공개 anon 키뿐 — 그것만으로는 아무 데이터도 못 읽는다).
============================================================================ -->
<style>
  :root{--teal:#17857A;--teal-soft:#e6f2f0;--ink:#1a2b32;--sub:#5b7078;--line:#dbe6e4;
        --bg:#f4f8f7;--card:#ffffff;--amber:#b45309;--red:#b91c1c;--good:#0e7490;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 24px;
         display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5;flex-wrap:wrap}
  header h1{font-size:17px;color:var(--teal);cursor:pointer}
  .live{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub)}

  .dot.on{background:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.18)}
  .spacer{flex:1}
  .who{font-size:12.5px;color:var(--sub)}
  button{border:1px solid var(--line);background:var(--card);border-radius:8px;
         padding:7px 14px;font-size:13px;cursor:pointer;color:var(--ink);font-family:inherit}
  button:hover{background:#f0f6f5}
  button.primary{background:var(--teal);border-color:var(--teal);color:#fff}
  button.primary:hover{background:#136d64}
  button.danger{color:var(--red);border-color:#f0d5d5}
  button.link{border:none;background:none;color:var(--teal);padding:0;text-decoration:underline;font-size:13px}
  main{max-width:1120px;margin:0 auto;padding:20px 20px 60px}
  .crumb{font-size:13px;color:var(--sub);margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .purpose{background:var(--teal-soft);border:1px solid #cfe6e2;border-radius:10px;
           padding:12px 16px;font-size:13.5px;color:#14625b;margin-bottom:18px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .card .k{font-size:12.5px;color:var(--sub);margin-bottom:6px}
  .card .v{font-size:25px;font-weight:700}
  .card .s{font-size:12px;color:var(--sub);margin-top:4px}
  section{background:var(--card);border:1px solid var(--line);border-radius:12px;
          padding:18px;margin-bottom:18px}
  section h2{font-size:15px;margin-bottom:3px}
  section .desc{font-size:12.5px;color:var(--sub);margin-bottom:14px}
  .whose{display:inline-block;background:var(--teal-soft);color:#14625b;border-radius:6px;
         padding:2px 8px;font-size:12px;font-weight:600;margin-left:6px;vertical-align:middle}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--sub);font-weight:600;font-size:12px}
  tr.clickable{cursor:pointer}
  tr.clickable:hover td{background:#f2f8f7}
  .pos{color:var(--good);font-weight:600}.neg{color:var(--amber);font-weight:600}
  .muted{color:var(--sub)}
  .warn{color:var(--amber);font-weight:600}
  .tablewrap{overflow-x:auto}
  svg{display:block;width:100%}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:8px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
  input{padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .note{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.6}
  .sechead{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;flex-wrap:wrap}
  .sechead .csv{flex:0 0 auto}
  .tag{display:inline-block;background:#fff7e6;border:1px solid #f0e0c0;color:#8a5a10;
       border-radius:6px;padding:2px 8px;font-size:12px;margin-left:6px;vertical-align:middle}
  select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;
         font-family:inherit;background:var(--card);color:var(--ink);cursor:pointer}
  #login{max-width:420px;margin:10vh auto;background:var(--card);border:1px solid var(--line);
         border-radius:14px;padding:30px}
  #login h2{color:var(--teal);font-size:19px;margin-bottom:6px}
  #login p{font-size:13px;color:var(--sub);margin-bottom:18px}
  #login input{width:100%;margin-bottom:10px}
  #login button{width:100%;padding:12px;margin-bottom:8px}
  .social{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
  .social button{font-weight:600}
  .btn-google{background:#fff;border:1px solid #d5dbdb;color:#1f2937}
  .btn-kakao{background:#FEE500;border-color:#FEE500;color:#191600}
  .divider{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:12px;margin:14px 0}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
  #loginErr{color:var(--red);font-size:13px;margin-bottom:12px;display:none;line-height:1.5}
  #app{display:none}
</style>
</head>
<body>

<div id="login">
  <h2>텔로스 케어 관리자 콘솔</h2>
  <p>회사 계정으로 로그인하세요. 관리자로 등록된 분만 열람할 수 있습니다.</p>
  <div id="loginErr"></div>
  <!-- ★★(S534) 들어오는 길은 ★구글 하나★ 다 — 대표 지시.
       카카오·이메일 버튼을 지운 것은 꾸밈이 아니라 ★공격면을 줄인 것★ 이다:
       길이 셋이면 가장 약한 길의 안전이 곧 이 콘솔의 안전이 된다.
       ★비밀번호 길은 소셜 계정의 2단계 인증을 지나지 않는다★ — 서버도 amr 로 막는다
       (get-effect-dashboard). 화면에서 지우는 것만으로는 부족하고, ★둘 다 해야 한다★. -->
  <div class="social">
    <button class="btn-google" id="googleBtn">구글 계정으로 로그인</button>
  </div>
</div>

<div id="app">
<header>
  <h1 id="homeBtn">텔로스 케어 · 관리자 콘솔</h1>
  <span class="live"><span class="dot" id="liveDot"></span><span id="liveText">연결 중…</span></span>
  <span class="spacer"></span>
  <select id="rangeSelect" title="일별 기록을 몇 일치까지 볼지">
    <option value="7">최근 7일</option>
    <option value="14">최근 14일</option>
    <option value="30">최근 30일</option>
    <option value="60">최근 60일</option>
    <option value="90">최근 90일</option>
    <option value="180">최근 180일</option>
  </select>
  <span class="who" id="whoText"></span>
  <button id="seatBtn" title="지자체·보험사 계약과 좌석 현황">계약·좌석</button>
  <button id="growthBtn" title="월별 설치·이탈·연동률·좌석">성장판</button>
  <button id="secBtn" title="2단계 인증 · 열람 기록">보안</button>
  <button id="refreshBtn">지금 새로고침</button>
  <button id="logoutBtn" title="로그인 상태는 이 브라우저에 유지됩니다. 공용 PC 에서는 반드시 로그아웃하세요.">로그아웃</button>
</header>
<main id="view"></main>
</div>

<script>
(function(){
  "use strict";
  var SUPA = "https://xeerqdsedmafbqbgqooi.supabase.co";
  // 공개(anon) 키 — 브라우저 노출 전제. 이것만으로는 아무 데이터도 못 읽는다.
  var ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhlZXJxZHNlZG1hZmJxYmdxb29pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzMjYzMjksImV4cCI6MjA5MTkwMjMyOX0.Qg91BDcIkfmAt_5TGG5Cro401OXAyW1-Hu9BEObsZks";
  var DASH = SUPA + "/functions/v1/get-effect-dashboard";
  // ★(S615) 회사 성장판 — 효과측정과 묻는 것이 달라 ★따로 선다★(그 함수의 배열 순서를 안 건드린다).
  var GROWTH = SUPA + "/functions/v1/get-growth-board";
  var GROWTH_DATA = null;   // ★열었을 때만 받아 온다★ — 60초 자동 갱신에 얹지 않는다.
  var POLL_MS = 60000;
  var timer = null;
  var DATA = null;                 // 마지막으로 받아온 전체 데이터
  var route = { view: "overview" };// {view:'overview'|'elder'|'week', id, weekStart}
  var COLORS = ["#17857A", "#b45309", "#2563eb", "#7c3aed", "#db2777", "#0e7490", "#65a30d"];

  function el(id){ return document.getElementById(id); }
  // ★★(S517) 로그인 유지 — 대표 지적("계속 로그인 상태가 유지되어야 하는데").
  //   종전엔 sessionStorage 였다. 그것은 ★탭을 닫으면 사라진다★ — 콘솔은 하루에도 몇 번
  //   여닫는 자리라 그때마다 다시 로그인해야 했다. localStorage 로 옮겨 탭을 닫아도 남긴다.
  //   ★대신 로그아웃 버튼이 확실히 지운다★(공용 PC 에서는 그것을 눌러야 한다 — 화면에도 적었다).
  //   ★옛 열쇠를 한 번 물려받는다★: 이미 로그인해 둔 사람이 이 배포 직후 튕기지 않도록,
  //   sessionStorage 에 남아 있으면 옮겨 온 뒤 지운다(한 번만 일어나는 이사다).
  var SESS_KEY = "telos_session";
  function sess(){
    try {
      var v = localStorage.getItem(SESS_KEY);
      if (!v) {
        var old = sessionStorage.getItem(SESS_KEY);
        if (old) { localStorage.setItem(SESS_KEY, old); sessionStorage.removeItem(SESS_KEY); v = old; }
      }
      return JSON.parse(v || "null");
    } catch(e){ return null; }
  }
  function setSess(s){
    try {
      if (s) localStorage.setItem(SESS_KEY, JSON.stringify(s));
      else { localStorage.removeItem(SESS_KEY); sessionStorage.removeItem(SESS_KEY); }
    } catch(e){}
  }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function num(v){ return (v === null || v === undefined || v === "") ? null : Number(v); }
  function fmt(v, unit){ var n = num(v); return n === null ? '<span class="muted">측정 중</span>'
    : esc(Math.round(n*10)/10) + (unit || ""); }

  // ── 로그인 ───────────────────────────────────────────────────────────
  function showLogin(msg){
    el("login").style.display = "block"; el("app").style.display = "none";
    var e = el("loginErr");
    if (msg) { e.innerHTML = msg; e.style.display = "block"; } else { e.style.display = "none"; }
    if (timer) { clearInterval(timer); timer = null; }
  }
  function showApp(){
    el("login").style.display = "none"; el("app").style.display = "block";
    if (!timer) timer = setInterval(load, POLL_MS);
  }
  function authFetch(path, body){
    return fetch(SUPA + "/auth/v1/" + path, {
      method: "POST", headers: { "apikey": ANON, "Content-Type": "application/json" },
      body: JSON.stringify(body),
    }).then(function(r){ return r.json().then(function(j){ return { ok: r.ok, body: j }; }); });
  }
  function socialLogin(provider){
    var back = location.origin + location.pathname;
    location.href = SUPA + "/auth/v1/authorize?provider=" + provider + "&redirect_to=" + encodeURIComponent(back);
  }
  function captureHashSession(){
    if (!location.hash || location.hash.indexOf("access_token") < 0) return false;
    var p = new URLSearchParams(location.hash.slice(1));
    var at = p.get("access_token");
    if (!at) return false;
    setSess({ access_token: at, refresh_token: p.get("refresh_token") });
    history.replaceState(null, "", location.pathname);
    return true;
  }
  function refreshSession(){
    var s = sess();
    if (!s || !s.refresh_token) return Promise.resolve(false);
    return authFetch("token?grant_type=refresh_token", { refresh_token: s.refresh_token })
      .then(function(r){
        if (!r.ok || !r.body.access_token) return false;
        setSess({ access_token: r.body.access_token, refresh_token: r.body.refresh_token });
        return true;
      }).catch(function(){ return false; });
  }
  function apiFetch(url, opts, retried){
    var s = sess();
    if (!s) return Promise.reject(new Error("no_session"));
    var o = {}; for (var k in (opts || {})) o[k] = opts[k];
    o.headers = { "apikey": ANON, "Authorization": "Bearer " + s.access_token };
    for (var h in ((opts || {}).headers || {})) o.headers[h] = opts.headers[h];
    return fetch(url, o).then(function(r){
      if (r.status === 401 && !retried) {
        return refreshSession().then(function(ok){
          if (!ok) throw new Error("session_expired");
          return apiFetch(url, opts, true);
        });
      }
      return r;
    });
  }
  function rpc(name, args){
    return apiFetch(SUPA + "/rest/v1/rpc/" + name, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(args || {}),
    }).then(function(r){
      return r.text().then(function(t){
        var j = null; try { j = t ? JSON.parse(t) : null; } catch(e) {}
        return { ok: r.ok, body: j, raw: t };
      });
    });
  }

  // ★기간은 취향(비밀 아님)이라 localStorage 에 남긴다 — 탭을 닫아도 다음에 그대로 열린다.
  function rangeDays(){
    var v = Number(localStorage.getItem("telos_range_days"));
    return [7, 14, 30, 60, 90, 180].indexOf(v) >= 0 ? v : 14;
  }
  function setRangeDays(v){ localStorage.setItem("telos_range_days", String(v)); }

  function load(){
    apiFetch(DASH, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ days: rangeDays() }),
    })
      .then(function(r){
        if (r.status === 403) {
          return r.json().then(function(j){
            // ★(S534) 403 이 두 가지 뜻을 갖게 됐다 — 가르지 않으면 2단계가 필요한 사람에게
            //   "당신은 관리자가 아닙니다"라고 거짓말을 하고 ★세션까지 날려 버린다★.
            if (j && j.reason === "password_login_blocked") {
              // ★(S534) 비밀번호로는 이 콘솔을 열지 않는다★ — "권한 없음"과 다른 사유다.
              //   ★세션을 지운다★ — 이 방법으로는 어차피 못 들어오니 다시 고르셔야 한다.
              setSess(null);
              showLogin("이 콘솔은 <b>구글 로그인</b>으로만 열립니다." +
                        "<br><span style='color:#5b7078'>비밀번호로 들어오는 길은 구글의 2단계 인증을 " +
                        "지나지 않아 닫아 두었습니다.</span>");
              throw new Error("not_admin");
            }
            setSess(null);
            showLogin("이 계정(" + esc(j.email || "") + ")은 관리자로 등록되어 있지 않습니다.<br>" +

  // ── 데이터 헬퍼 ──────────────────────────────────────────────────────

  //           자동으로 콘솔에서 빠지는걸 네가 못한다고 했잖아. 그러면 그냥 이런식으로

  function lastSignalDay(id){

  var QUIET_CACHE = { src: null, hidden: null, count: 0 };
  function quietMap(){
    if (QUIET_CACHE.src === DATA) return QUIET_CACHE.hidden;
    var m = {}, c = 0;
    (DATA && DATA.roster ? DATA.roster : []).forEach(function(r){

  /**

   * 상태판·기기 상태·개요 카드·CSV 가 전부 이 함수 하나를 쓰므로 한 자리만 고치면 된다.
   */
  function roster(){
    var m = {};
    var quiet = quietMap();
    (DATA.roster || []).forEach(function(r){
      if (quiet[r.id]) return;
      m[r.id] = { id: r.id, alias: r.alias || "이름 없음", region: r.region || "" };
    });
    return m;
  }
  function dailyOf(id){
    return (DATA.daily || []).filter(function(r){ return r.elderly_id === id; })
      .sort(function(a,b){ return a.metric_date < b.metric_date ? -1 : 1; });
  }

  var DEVICE = {

  };
  function healthOf(id){
    return (DATA.device_health || []).filter(function(r){ return r.elderly_id === id; })
      .sort(function(a, b){ return a.metric_date < b.metric_date ? -1 : 1; });

  function latestHealth(id){

  // ★한 원인이 나머지를 설명하면 나머지를 문제라 부르지 않는다 —

  function deviceProblems(h){

  function daysBetween(dateStr){
    if (!dateStr) return null;
    var d = new Date(dateStr + "T00:00:00");
    var t = new Date(); t.setHours(0, 0, 0, 0);
    return Math.round((t - d) / 86400000);
  }
  // ══════════════════════════════════════════════════════════════════════
  // ★★(S604) 걷기 지표 — 이 콘솔이 걷기 앱을 보는 눈★★
  // ══════════════════════════════════════════════════════════════════════
  //   대표 물음(2026-09-08) = "이동거리와 걸음수를 추적하면 될까? 개별 노인별
  //   걷기 추세를 확인하는 것만 하면 될까?" → ★아니다★. 서버에는 이미
  //   보행 질·야간·생활 리듬까지 쌓이고 있는데 화면이 그것을 하나도 안 보여
  //   주고 있었다(발화·대화 세션·기분 같은 ★대화 앱 시절 열★ 이 자리를 차지했다).

  //   ★★"며칠째 안 걸으셨나"가 첫 화면에 와야 하는 까닭★★
  //     추세 그래프는 ★지나간 일★ 을 말하고, 이 숫자는 ★오늘 해야 할 일★ 을 말한다.
  //     그래프를 아무리 잘 그려도 "오늘 누구에게 전화할까"에는 답하지 못한다.

  //   ★정직한 한계★

  //       사람이 낼 수 없는 값이 나온다(대표 폰 실측 3.25 m/s) → [WALK.speedMax] 위는
  //       ★버린다★. 지우는 것이 아니라 ★그 날의 속도를 모른다고 두는 것★ 이다.

  var WALK = {
    days: 7,           // 최근 며칠로 평균을 내는가
    speedMin: 0.4,     // 이보다 느리면 측정 잡음으로 본다(m/s)
    speedMax: 2.0,     // 이보다 빠르면 사람이 아니라 탈것이다(m/s)
    speedFrail: 0.8,   // 널리 쓰이는 노쇠 경계(m/s) — ★판정이 아니라 참고선★
    cvHigh: 30,        // 보행 변동이 이 위면 눈에 띄게 불안정(%)
    idleDays: 3,       // 이만큼 걸음이 0 이면 살펴볼 때

  function avgOf(arr){
    var v = arr.filter(function(x){ return x !== null && x !== undefined && !isNaN(x); });
    if (!v.length) return null;
    var t = 0; v.forEach(function(x){ t += x; });
    return t / v.length;
  }
  /** 하루치 행에서 보행 속도(m/s). 낼 수 없으면 null(0 이 아니다). */
  function daySpeed(r){
    if (!r) return null;
    var m = r.walk_distance_m, min = r.walking_bout_minutes;
    if (!m || !min || min <= 0) return null;

    if (v < WALK.speedMin || v > WALK.speedMax) return null;   // 탈것·잡음은 버린다

  /**
   * 그 어르신의 걷기 요약. ★상태판·경보·CSV 가 모두 이 함수 하나를 쓴다.★

  function walkStats(id){
    var ds = dailyOf(id);
    if (!ds.length) return null;
    var recent = ds.slice(-WALK.days);
    var stepDays = ds.filter(function(r){ return r.step_count !== null && r.step_count !== undefined; });

    // ★안 걸으신 날수★ — 마지막으로 "한 걸음이라도" 있었던 날로부터 며칠인가.

    var stepBase = avgOf(base.map(function(r){ return r.step_count; }));

      ? Math.round((stepNow - stepBase) / stepBase * 100) : null;

    return {
      days: recent.length,
      // ★★(S606) 잰 날 수 — ★"행이 온 날"과 "걸음을 잰 날"은 다르다★★

      //   2026-09-09 실측: 등록 21곳 중 7일 안에 걸음을 한 번이라도 잰 곳은 8곳뿐인데

      //   앱이 안 돕니다"가 "걷기가 줄었습니다"로 읽힌다★(대표 지적 2026-09-08).
      measuredDays: recent.filter(function(r){ return r.step_count !== null && r.step_count !== undefined; }).length,
      lastWalked: lastWalked,
      idleDays: idleDays,
      steps: stepNow === null ? null : Math.round(stepNow),
      stepDrop: stepDrop,
      walkM: avgOf(recent.map(function(r){ return r.walk_distance_m; })),
      strollM: avgOf(recent.map(function(r){ return r.stroll_distance_m; })),
      vehicleM: avgOf(recent.map(function(r){ return r.vehicle_distance_m; })),
      speed: avgOf(recent.map(daySpeed)),
      cv: avgOf(recent.map(function(r){ return r.gait_cv_percent; })),
      cadence: avgOf(recent.map(function(r){ return r.peak_cadence_steps_per_min; })),
      boutCount: avgOf(recent.map(function(r){ return r.walking_bout_count; })),
      boutMin: avgOf(recent.map(function(r){ return r.walking_bout_minutes; })),
      awayMin: avgOf(recent.map(function(r){ return r.away_from_home_minutes; })),
      outing: avgOf(recent.map(function(r){ return r.outing_count; })),
      firstHour: avgOf(recent.map(function(r){ return r.first_active_hour; })),
      lastHour: avgOf(recent.map(function(r){ return r.last_active_hour; })),
      nightSteps: avgOf(recent.map(function(r){ return r.night_steps; })),
      quietHours: avgOf(recent.map(function(r){ return r.night_longest_quiet_hours; })),

  }

  //   ★null 은 ★빈 칸★ 으로 쓴다(0 으로 쓰면 받는 사람이 "측정했는데 0"으로 읽는다 —

  var BOM = String.fromCharCode(0xFEFF);

  function csvCell(v){
    if (v === null || v === undefined) return "";
    var s = String(v);
    // ★수식 주입 방어: 별명·메모는 자유 입력이라 "=HYPERLINK(...)" 같은 값이 오면 엑셀이
    //   ★수식으로 실행★한다. 숫자가 아닌데 =,+,-,@,탭으로 시작하면 아포스트로피로 강등.
    //   ★순수 숫자는 제외 — OBV(-100)·z 는 음수가 정상값이라 문자로 만들면 분석이 깨진다.
    if (/^[=+\-@\t\r]/.test(s) && !/^-?\d+(\.\d+)?$/.test(s)) s = "'" + s;
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function downloadCsv(filename, headers, rows){
    var lines = [headers.map(csvCell).join(",")];
    rows.forEach(function(r){ lines.push(r.map(csvCell).join(",")); });
    var blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

    // ★★(S606) 내려받기를 걷기 셋으로 줄였다 — 대표 지시 2026-09-09★★

    //   ★남긴 셋★ = 상태판 · 어르신 일별 · 전체 원지표. ★열도 걷기만 남겼다.★
    //   ★화면과 파일이 같은 숫자를 말해야 한다★ — 정렬 순서까지 화면과 같게 맞춘다.
    if (kind === "elders") {
      downloadCsv("텔로스_어르신상태판_" + today() + ".csv",
        ["가명", "동네", "걸음 잰 날(7일 중)", "안 걸으신 날수", "마지막 걸음",
         "걸음(최근7일 평균)", "걸음 변화(앞 2주 대비 %)", "산책(m/일)", "보행속도(m/s)",
         "보행변동CV(%)", "집밖(분/일)", "첫 활동(시)", "마지막 활동(시)",
         "도착일수(7일 중)", "마지막 도착", "메모"],
        sortStatus(statusRows()).map(function(r){
          return [r.alias, r.region, r.w_meas, r.w_idle, (walkStats(r.id) || {}).lastWalked,
                  r.w_steps, r.w_drop, r.w_walkm, r.w_speed,
                  r.w_cv, r.w_away, r.w_first, r.w_last,
                  r.days_arrived_7d, r.last_arrival, r.note];

    } else if (kind === "elderDaily" || kind === "all") {
      // ★한 벌의 열 정의를 둘이 나눠 쓴다★ — 갈라 두면 한쪽만 고쳐져 두 파일이 어긋난다.
      var one = (kind === "elderDaily");
      var m2 = one ? rs[arg] : null;
      var head = (one ? ["가명"] : ["가명", "동네"]).concat(
        ["날짜", "걸음(보)", "걷기(m)", "탈것(m)", "산책(m)", "이동거리(m)",
         "보행구간(회)", "보행구간(분)", "최고걸음빠르기(보/분)",
         // ★보행 속도 — 빈 칸은 "못 쟀다"이지 0 이 아니다(탈것이 섞였거나 보행 시간이 없는 날).
         "보행속도(m/s)", "걸음간격중앙값(ms)", "걸음고름CV(%)", "걸음고름표본수",
         // ★밤 움직임 3칸 — ★"수면"이 아니다★. 셋을 함께 내려받는다.
         "밤 걸음(보)", "밤 움직인 시간대(개)", "밤 조용한 최장(시간)",
         // ★활동 시간대 — ★분포 원본(24칸)까지 함께★. 요약은 되돌릴 수 없다.
         "활동 시간대 수(개)", "첫 활동(시)", "마지막 활동(시)", "시간대별 걸음 24칸",
         // ★(S605) 걸어서 닿은 범위 — 차로 다녀오신 곳은 안 센다(집과 걸어서 이어진 점만).
         "걸어서 닿은 범위(km2)",
         // ★(S604) 새벽 화면 — 0 = 지켜본 조용한 밤 / 빈 칸 = 그 밤을 못 쟀다.
         "새벽 화면(회)", "집밖 체류(분)", "외출(회)"]);
      var rowsSrc = one ? dailyOf(arg) : (DATA.daily || []);
      downloadCsv(one ? ("텔로스_" + (m2 ? m2.alias : "어르신") + "_일별걷기_" + today() + ".csv")
                      : ("텔로스_전체걷기원지표_최근" + (DATA.range_days || 14) + "일_" + today() + ".csv"),
        head,

          return head2.concat(

  // ── 라우팅 ───────────────────────────────────────────────────────────
  // ★★(S517) 뒤로 가기 — 대표 지적("뒤로 가기 누르면 바로 전페이지가 아니라 그냥 튕겨져서").
  //   종전엔 화면을 바꿔도 ★브라우저 이력을 남기지 않았다★ → 뒤로 가기가 콘솔 안의 이전
  //   화면이 아니라 ★콘솔 밖★ 으로 나갔다(그 앞이 로그인 시점이라 로그인 화면으로 보였다).
  //   이제 화면을 옮길 때마다 이력을 하나 쌓고, 뒤로 가기는 그 이력을 되짚는다.
  //   ★replace=true 는 이력을 쌓지 않는다★ — 첫 그림과 데이터 재적재처럼 "옮긴 것이
  //   아닌" 경우에 쓴다. 안 그러면 새로고침마다 이력이 늘어 뒤로 가기가 제자리걸음한다.
  // ★★(S534) 대표 지적 — "60초마다 갑자기 맨 위로 올라가서 중간을 못 읽는다".
  //   [원인] 한 함수가 ★두 가지 뜻★ 을 겸하고 있었다: "화면을 옮겼다"와 "같은 화면을
  //     다시 그렸다". 맨 위로 가는 것은 ★옮겼을 때만★ 옳은데, 60초 자동 갱신도 같은
  //     문을 지나느라 읽던 자리를 매번 빼앗았다.
  //   [처방] 뜻을 가른다 — ★replace=true 는 "다시 그린 것"이므로 스크롤을 건드리지
  //     않는다★. 이 값의 의미는 위 주석이 이미 "옮긴 것이 아닌 경우"라고 적어 두었고,
  //     스크롤만 그 뜻을 안 따르고 있었다.
  //   ★replace=true 호출부는 60초 갱신 하나뿐이고 첫 그림도 그 경로를 지난다★ —
  //     첫 그림은 이미 맨 위라 보존해도 보이는 것이 같다.
  function go(r, replace){
    route = r;
    try {
      if (replace) history.replaceState(r, "", location.pathname);
      else history.pushState(r, "", location.pathname);
    } catch(e){}
    // ★★(S534) 적는 중이면 아예 다시 그리지 않는다.
    //   다시 그리기는 화면을 통째로 갈아 끼우므로, 가명을 적던 중이면 ★적던 글자가
    //   사라진다★. 창구에서 여러 명을 등록할 때 60초마다 이것을 겪으면 못 쓴다.
    //   ★다음 주기에 그리면 된다★ — 데이터는 이미 받아 두었으므로 잃는 것이 없다.
    if (replace && typingInView()) return;
    // ★★(S534) 보안 화면은 자동 갱신이 다시 그리지 않는다.
    //   이 화면은 처음부터 끝까지 사람이 손으로 다루는 자리다(QR·비밀 열쇠·6자리 코드).
    //   60초마다 갈아 끼우면 ★등록하던 것이 통째로 사라진다★ — 대표가 실제로 겪었다
    //   ("준비하는 중"이 한참 있다가 그냥 원래 화면으로 돌아간다).
    if (replace && route && (route.view === "security" || route.view === "seats")) return;
    // ★다시 그리면 스크롤이 스스로 튄다(내용이 통째로 바뀌므로) → 그리기 전에 적어 두고
    //   그린 뒤에 되돌린다. 옮긴 것일 때는 종전대로 맨 위로.
    var keep = replace ? (window.pageYOffset || document.documentElement.scrollTop || 0) : 0;
    renderRoute();
    window.scrollTo(0, keep);
  }
  /** 지금 사람이 화면 안의 입력칸에 손을 대고 있는가(자동 갱신이 빼앗으면 안 되는 상태). */
  function typingInView(){
    var a = document.activeElement;
    if (!a) return false;
    var t = (a.tagName || "").toUpperCase();
    if (t !== "INPUT" && t !== "TEXTAREA" && t !== "SELECT") return false;
    var v = el("view");
    return !!(v && v.contains(a));
  }
  window.addEventListener("popstate", function(e){
    route = (e.state && e.state.view) ? e.state : { view: "overview" };
    renderRoute();
    window.scrollTo(0, 0);
  });
  // ★뒤로 가기로 되돌아왔을 때 화면이 ★로그인 상태로 얼어 있는 것★ 을 푼다.
  //   브라우저가 페이지를 통째로 캐시(bfcache)했다가 되살리면 자바스크립트가 다시 돌지
  //   않아, 세션은 멀쩡한데 그때 보이던 로그인 화면이 그대로 복원된다.
  //   ★그것이 "튕겨서 다시 로그인하라고 나온다"의 정체다★ — 세션을 다시 보고 판단한다.
  window.addEventListener("pageshow", function(e){
    if (!e.persisted) return;
    if (sess()) load(); else showLogin(null);
  });
  // ══════════════════════════════════════════════════════════════════════
  // ★★(S534) 보안 화면 — 로그인 방식 + 열람 기록 (대표 지시)
  // ══════════════════════════════════════════════════════════════════════
  //   ★두 가지를 한 화면에 둔다★: "못 들어오게 하는 것"과 "들어온 것을 남기는 것"은
  //   짝이다 — 앞은 막고, 뒤는 뚫린 뒤에 답한다.
  //
  //   ★막으려던 것★ = 콘솔이 소셜(구글)과 이메일+비밀번호 ★두 길★ 을 다 열어 두었고,
  //   ★비밀번호 길은 구글의 2단계를 지나지 않는다★. 약한 길 하나면 그리로 들어온다.
  //
  //   ★처방이 바뀐 이력(같은 세션 안에서)★ — 처음엔 콘솔에 TOTP(인증 앱 6자리)를
  //   붙였다. 맞는 길이지만 ★사람이 등록이라는 일을 해야 했고 그 흐름이 실제로 막혔다★
  //   (대표 실측). ★약한 길을 아예 닫으면 대표가 이미 쓰시는 구글 2단계가 그대로
  //   콘솔을 지킨다★ — 등록도, 인증 앱도, 6자리도 필요 없다.
  //   ★더 적은 부품으로 같은 것을 막는다.★
  //   판정은 서버(get-effect-dashboard)가 하고 이 화면은 ★그 사실을 보여 줄 뿐★ 이다
  //   — 화면이 스스로 판정하면 두 곳의 규칙이 갈라진다.

  function renderSecurity(){
    var prov = (DATA && DATA.login_provider) || "";
    var html = crumb([{ t: "개요", go: { view: "overview" } }, { t: "보안" }]);

    html += '<section><div class="sechead"><div><h2>로그인' +
      '<span class="tag">구글 전용</span></h2>' +
      '<div class="desc">이 콘솔은 <b>구글 로그인</b>으로만 열립니다. ' +
      '카카오·비밀번호로 들어오던 길은 닫았습니다 — 길이 여럿이면 <b>가장 약한 길의 안전</b>이 곧 이 콘솔의 안전이 됩니다.<br>' +
      '따라서 <b>구글 계정의 2단계 인증이 곧 이 콘솔의 자물쇠</b>입니다 — ' +
      '콘솔에 따로 등록하실 것은 없습니다.</div></div></div>' +
      '<div class="desc">지금 로그인: <b>' + esc(DATA && DATA.viewer || "") + '</b>' +
      (prov ? ' <span class="muted">· ' + esc(prov) + '</span>' : "") + "</div>" +
      '<div class="desc" style="margin-top:10px">★ 이 방어는 <b>구글 계정이 2단계로 지켜지고 있다</b>에 ' +
      '기댑니다. 그 계정이 뚫리면 이 콘솔도 함께 뚫립니다.</div></section>';

    html += '<section><div class="sechead"><div><h2>열람 기록' +
      '<span class="whose">최근 200줄</span></h2>' +
      '<div class="desc">누가 언제 몇 명분을 열었는지 남깁니다. ' +
      '<b>어르신 자료는 한 글자도 적지 않습니다</b>(가명조차) — 이 기록이 또 하나의 유출 대상이 되면 안 되기 때문입니다.<br>' +
      '사고가 났을 때 "무엇이 새었는가"를 답할 수 있는 유일한 자료입니다.</div></div></div>' +
      '<div id="auditBox" class="desc">불러오는 중…</div></section>';

    // ★★(S596 · 대표 지시 2026-09-05) 위치정보 취급대장★★
    //   위치정보법 제16조 제2항 = "위치정보 수집·이용·제공사실 확인자료를 위치정보
    //   시스템에 ★자동으로 기록되고 보존되도록★ 하여야 한다"(어기면 1년 이하 징역
    //   또는 2천만원 이하 벌금). ★사업 신고와 별개 의무이고 유예가 없다.★
    //   ★대장에 좌표를 적지 않는다★ — 법이 묻는 것은 "언제·무엇을·왜·누구에게"이지
    //   "어디였는가"가 아니고, 좌표를 적으면 ★대장 자체가 가장 큰 위치정보 저장소★
    //   가 된다(바로 위 "열람 기록"이 어르신 자료를 한 글자도 안 적는 것과 같은 규율).
    html += '<section><div class="sechead"><div><h2>위치정보 취급대장' +
      '<span class="whose">최근 30일 · 가명</span></h2>' +
      '<div class="desc">위치를 <b>언제 몇 번 받고, 몇 번 쓰고, 몇 번 밖으로 내보냈는지</b>를 남깁니다 ' +
      '(위치정보법 제16조 제2항 · 법정 의무).<br>' +
      '<b>좌표는 한 개도 적지 않습니다</b> — 법이 묻는 것은 "언제·무엇을·왜·누구에게"이지 "어디였는가"가 아니고, ' +
      '좌표를 적으면 이 대장이 가장 큰 위치정보 저장소가 됩니다.<br>' +
      '<b>"밖으로"가 생기는 자리는 119 문자 하나뿐입니다</b> — 그 한 줄이 이 대장의 존재 이유입니다.</div></div>' +
      '<div><button class="btn" id="locCsv">CSV로 내려받기</button></div></div>' +
      '<div id="locBox" class="desc">불러오는 중…</div></section>';

    el("view").innerHTML = html;

  }

  // ★취급대장★ — 읽어서 표로 그린다(판정 없음).
  var LOC_ROWS = [];
  function loadLocationLog(){
    rpc("console_list_location_log", { p_days: 30, p_limit: 500 }).then(function(r){
      var box = el("locBox"); if (!box) return;
      if (!r.ok || !Array.isArray(r.body)) { box.textContent = "대장을 불러오지 못했습니다."; return; }
      LOC_ROWS = r.body;
      if (!r.body.length) {
        // ★"아직 없다"와 "고장났다"를 가른다★ — 단말 관이 붙기 전에는 비어 있는 것이 정상이다.
        box.innerHTML = '아직 기록이 없습니다. <span class="muted">단말에서 올리는 관이 붙으면 하루 한 줄씩 쌓입니다.</span>';
        return;
      }
      var h = '<div class="tablewrap"><table><tr><th>날짜</th><th>어르신</th>' +
              "<th>받음</th><th>씀</th><th>밖으로</th><th>받은 곳</th><th>목적</th></tr>";
      r.body.forEach(function(a){
        var out = Number(a.provide_count || 0);
        h += "<tr><td>" + esc(String(a.log_date || "")) + "</td>" +
             "<td>" + esc(a.alias) + "</td>" +
             "<td>" + esc(a.collect_count) + "</td>" +
             "<td>" + esc(a.use_count) + "</td>" +
             "<td" + (out > 0 ? ' class="warn"' : "") + ">" + esc(out) + "</td>" +
             "<td>" + esc(a.provide_to || "—") + "</td>" +
             '<td class="muted">' + esc(a.purpose || "") + "</td></tr>";
      });
      box.innerHTML = h + "</table></div>";
      var b = el("locCsv");
      if (b) b.onclick = function(){ downloadLocationCsv(); };
    });
  }

  // ★내려받기★ — 감독기관이 요구하면 그 자리에서 내밀 수 있어야 한다.
  function downloadLocationCsv(){
    if (!LOC_ROWS.length) { alert("내려받을 기록이 없습니다."); return; }
    var head = ["날짜", "어르신(가명)", "수집", "이용", "제공", "제공받은곳", "목적"];
    var lines = [head.join(",")];
    LOC_ROWS.forEach(function(a){
      lines.push([
        csvCell(a.log_date), csvCell(a.alias), csvCell(a.collect_count),
        csvCell(a.use_count), csvCell(a.provide_count),
        csvCell(a.provide_to || ""), csvCell(a.purpose || "")
      ].join(","));
    });
    // ★BOM 을 붙인다★ — 없으면 엑셀에서 한글이 깨진다(그러면 제출 자료가 못 쓰게 된다).
    var blob = new Blob([BOM + lines.join(CRLF)], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url;
    link.download = "위치정보_취급대장_" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

  // ══════════════════════════════════════════════════════════════════════
  // ★★(S580) 계약·좌석 — "파는 것은 앱이 아니라 좌석"의 관리 화면
  // ══════════════════════════════════════════════════════════════════════
  //   앱은 스토어에 하나뿐이고(무료), 좌석 스위치(sql 092)가 기능을 가른다.
  //   대표의 유일한 수동 = 여기서 계약을 만들고 코드를 전달하는 것.
  //   · 기관 가입코드 → 요양사가 앱에 1회 입력 → 이후 연동마다 좌석 자동(sql 093)
  //   · 혜택코드 묶음 → 보험사가 자녀에게 → 자녀가 앱에 입력(1회용 · 기간 내장)
  //   화면은 RPC(console_* · sql 094)만 부른다 — 판정·잠금은 전부 서버에 있다.
  //   자동 갱신이 이 화면을 다시 그리지 않는 것은 보안 화면과 같은 이유다(적는 화면).

  var KIND_LABEL = { gov: "지자체", insurer: "보험사", free_pilot: "무료실증", internal: "내부", other: "기타" };

  // ★무료 기간 임계 = 12개월★ — IR 18p STEP 2 가 약속한 "무료 12개월 운영"이 근거다.
  var FREE_MONTHS_LIMIT = 12;
  // ★어르신 1인당 월 LLM 원가 상한(원)★ — S578 실측(하루 10분 = 월 1,000~1,540원)의
  //   ★윗값★ 을 쓴다. 적게 잡으면 청구서가 넘고, 이 칸은 "각오할 금액"을 보는 자리다.
  var COST_PER_SEAT_MONTH = 1540;

  function isFreeKind(kind){ return kind === "free_pilot" || kind === "other"; }

  /** 시작일로부터 지난 개월 수(정수 · 모르면 null). */
  function monthsSince(iso){
    if (!iso) return null;
    var t = Date.parse(String(iso));
    if (isNaN(t)) return null;
    var days = (Date.now() - t) / 86400000;
    if (days < 0) return 0;
    return Math.floor(days / 30.44);
  }

  /** 좌석 수 → 월 부담(원). ★0석이면 0원이라 적는다★ — "—"로 두면 모르는 것처럼 읽힌다. */
  function monthlyCostText(seats){
    var n = Number(seats) || 0;
    return "약 " + (n * COST_PER_SEAT_MONTH).toLocaleString("ko-KR") + "원";
  }

  /**
   * 기간·좌석 고치기.
   * ★연장은 계약과 좌석을 함께 고친다★ — 서버 console_update_contract 가 그 계약의
   * 켜진 좌석 만료까지 같이 갱신한다(계약만 늘리면 어르신 쪽은 옛 날짜로 잠긴다).
   * ★무기한으로 되돌리는 것은 이 화면에서 하지 않는다★ — 되돌릴 일이 드물고,
   * 실수로 눌러 만료를 지우면 유료 계약이 영구 무료가 된다.
   */
  function extendContract(id){
    var months = prompt("기간을 몇 개월로 할까요? (지금부터 · 비우면 기간은 그대로)", "");
    if (months === null) return;
    var seats = prompt("좌석 수를 몇 개로 할까요? (비우면 그대로)", "");
    if (seats === null) return;
    var args = { p_contract_id: id };
    if (String(months).trim() !== "") args.p_months = Number(months);
    if (String(seats).trim() !== "") args.p_seat_total = Number(seats);
    if (args.p_months == null && args.p_seat_total == null) return;
    rpc("console_update_contract", args).then(function(r){
      if (r.ok) { loadContracts(); loadSeats(); }
      else alert("고치지 못했습니다: " + (r.raw || ""));
    });
  }

    el("view").innerHTML = html;

  function loadContracts(){
    rpc("console_list_contracts", {}).then(function(r){
      var box = el("contractBox"); if (!box) return;
      if (!r.ok || !Array.isArray(r.body)) { box.textContent = "불러오지 못했습니다: " + (r.raw || ""); return; }
      var sel = el("bcContract");
      if (sel) {
        sel.innerHTML = "";
        r.body.forEach(function(c){
          var o = document.createElement("option");
          o.value = c.id; o.textContent = c.name + " (" + (KIND_LABEL[c.kind] || c.kind) + ")";
          sel.appendChild(o);
        });
      }
      if (!r.body.length) { box.textContent = "아직 계약이 없습니다. 아래에서 첫 계약을 만드세요."; return; }
      // ★(S580) 무료로 오래 쓰는 계약을 먼저 알린다★ — 무기한 계약은 잊히기 쉽고,
      //   그 사이 LLM 비용은 우리가 낸다. IR 18p 가 약속한 무료 기간이 12개월이라
      //   그것을 임계로 삼는다(근거 있는 값 · 임의의 숫자가 아니다).
      var aged = r.body.filter(function(c){
        return isFreeKind(c.kind) && monthsSince(c.starts_at) >= FREE_MONTHS_LIMIT;
      });
      var h = "";
      if (aged.length) {
        h += '<div class="desc" style="margin-bottom:10px"><span class="warn">' +
             "무료로 " + FREE_MONTHS_LIMIT + "개월 넘게 쓰는 계약 " + aged.length + "건" +
             "</span> — 유료 전환이나 종료를 정하실 때입니다. " +
             '<span class="muted">그대로 두면 아래 "월 부담"이 계속 나갑니다.</span></div>';
      }
      h += '<div class="tablewrap"><table><tr><th>이름</th><th>종류</th><th>좌석</th>' +
           "<th>쓴 기간</th><th>월 부담</th>" +
           "<th>기관 가입코드</th><th>혜택코드</th><th>만료</th><th></th></tr>";
      r.body.forEach(function(c){
        var months = monthsSince(c.starts_at);
        var old = isFreeKind(c.kind) && months >= FREE_MONTHS_LIMIT;
        h += "<tr><td>" + esc(c.name) + "</td>" +
             "<td>" + esc(KIND_LABEL[c.kind] || c.kind) + "</td>" +
             "<td>" + esc(c.seats_used) + " / " + esc(c.seat_total) + "</td>" +
             "<td" + (old ? ' class="warn"' : "") + ">" +
               (months == null ? "—" : esc(months) + "개월") + "</td>" +
             "<td>" + monthlyCostText(c.seats_used) + "</td>" +
             "<td style='font-family:monospace'>" + (c.join_code ? esc(c.join_code) : "—") + "</td>" +
             "<td>" + (c.benefit_total > 0 ? esc(c.benefit_redeemed) + " / " + esc(c.benefit_total) + " 사용" : "—") + "</td>" +
             "<td>" + (c.ends_at ? esc(String(c.ends_at).slice(0, 10)) : "무기한") + "</td>" +
             '<td><button class="link" data-extend="' + esc(c.id) + '">기간·좌석</button>' +
               (c.join_code ? ' <button class="link" data-rotate="' + esc(c.id) + '">코드 재발급</button>' : "") +
             "</td></tr>";
      });
      box.innerHTML = h + "</table></div>";
      Array.prototype.forEach.call(box.querySelectorAll("[data-extend]"), function(b){
        b.addEventListener("click", function(){ extendContract(b.getAttribute("data-extend")); });
      });
      Array.prototype.forEach.call(box.querySelectorAll("[data-rotate]"), function(b){
        b.addEventListener("click", function(){
          if (!confirm("가입코드를 새로 만듭니다. 이미 소속된 요양사는 그대로 유지되고, 옛 코드는 더 이상 통하지 않습니다.")) return;
          rpc("console_rotate_join_code", { p_contract_id: b.getAttribute("data-rotate") }).then(function(rr){
            if (rr.ok) loadContracts(); else alert("실패: " + (rr.raw || ""));
          });
        });
      });
    });
  }

  function createContract(){
    var name = el("scName").value.trim();
    var kind = el("scKind").value;
    var total = Number(el("scTotal").value);
    var months = Number(el("scMonths").value) || null;
    var msg = el("scMsg");
    if (!name) { msg.textContent = "이름을 적어 주세요."; return; }
    if (!(total > 0)) { msg.textContent = "좌석 수를 적어 주세요."; return; }
    msg.textContent = "만드는 중…";
    rpc("console_create_contract", { p_name: name, p_kind: kind, p_seat_total: total, p_months: months })
      .then(function(r){
        if (!r.ok || !Array.isArray(r.body) || !r.body.length) { msg.textContent = "실패: " + (r.raw || ""); return; }
        var row = r.body[0];
        msg.textContent = row.join_code ? ("만들었습니다 · 가입코드 " + row.join_code) : "만들었습니다";
        el("scName").value = "";
        loadContracts();
      });
  }

  function issueBenefit(){
    var cid = el("bcContract").value;
    var cnt = Number(el("bcCount").value);
    var days = Number(el("bcDays").value);
    var msg = el("bcMsg");
    if (!cid) { msg.textContent = "계약을 먼저 만들어 주세요."; return; }
    if (!(cnt > 0)) { msg.textContent = "개수를 적어 주세요."; return; }
    msg.textContent = "발급 중…";
    rpc("console_issue_benefit_codes", { p_contract_id: cid, p_count: cnt, p_duration_days: days || 180 })
      .then(function(r){
        if (!r.ok || !Array.isArray(r.body)) { msg.textContent = "실패: " + (r.raw || ""); return; }
        var codes = r.body.map(function(x){ return x.code; });
        var out = el("bcOut");
        out.value = codes.join(String.fromCharCode(10));
        out.style.display = "block";
        msg.textContent = codes.length + "개 발급 — 아래에서 복사하세요.";
        loadContracts();
      });
  }

  function loadSeats(){
    rpc("console_list_seats", {}).then(function(r){
      var box = el("seatBox"); if (!box) return;
      if (!r.ok || !Array.isArray(r.body)) { box.textContent = "불러오지 못했습니다: " + (r.raw || ""); return; }
      if (!r.body.length) { box.textContent = "어르신이 없습니다."; return; }
      var h = '<div class="tablewrap"><table><tr><th>가명</th><th>동네</th><th>좌석</th>' +
              "<th>재원</th><th>만료</th><th></th></tr>";
      r.body.forEach(function(s){
        h += "<tr><td>" + esc(s.alias || "") + (s.is_internal ? ' <span class="muted">(내부)</span>' : "") + "</td>" +
             "<td>" + esc(s.region || "") + "</td>" +
             "<td>" + (s.seat_active ? "<b>켜짐</b>" : '<span class="muted">꺼짐</span>') + "</td>" +
             "<td>" + esc(s.contract_name || s.seat_funded_by || "—") + "</td>" +
             "<td>" + (s.seat_valid_until ? esc(String(s.seat_valid_until).slice(0, 10)) : "—") + "</td>" +
             '<td><button class="link" data-seat="' + esc(s.elderly_id) + '" data-on="' + (s.seat_active ? "0" : "1") + '">' +
             (s.seat_active ? "끄기" : "켜기") + "</button></td></tr>";
      });
      box.innerHTML = h + "</table></div>";
      Array.prototype.forEach.call(box.querySelectorAll("[data-seat]"), function(b){
        b.addEventListener("click", function(){
          var on = b.getAttribute("data-on") === "1";
          if (!confirm(on ? "이 어르신 좌석을 수동으로 켭니다(무기한 · 라벨 manual)." :
                            "이 어르신 좌석을 끕니다. 대화가 하루 예비분(약 10턴)으로 줄어듭니다.")) return;
          rpc("console_set_seat", { p_elderly_id: b.getAttribute("data-seat"), p_active: on }).then(function(rr){
            if (rr.ok) { loadSeats(); loadContracts(); } else alert("실패: " + (rr.raw || ""));
          });
        });
      });
    });
  }

  // ── 회사 성장판 (S615 · 대표 지시 "회사 성장판 콘솔 작업은 진행해") ────────
  //  ★★무엇을 묻는 화면인가★★
  //    실증 지표판이 "어르신이 나아지고 있는가"를 묻는다면, 이 화면은
  //    ★"회사가 크고 있는가"★ 를 묻는다. 그래서 따로 선다.
  //
  //  ★★셈은 여기서 하지 않는다★★
  //    숫자는 전부 서버(sql 130 growth_board)가 낸 것을 ★그대로★ 그린다.
  //    화면이 다시 세면 ★두 곳이 다른 숫자를 말한다★.
  //
  //  ★★안 센 것을 함께 말한다★★
  //    내부 시험 기기는 안 센다 — 그런데 그 사실을 안 적으면 대표가
  //    "설치가 왜 이것뿐인가"를 결함으로 오해하신다. 그래서 제외 수를 같이 적는다.
  //
  //  ★★예상 매출은 아직 못 셈한다★★
  //    좌석 단가가 ★대표 결정 사항이고 아직 안 정해졌다★.
  //    ★모르는 것을 0 으로 적지 않는다★ — 정해지면 SEAT_PRICE 한 줄만 바꾼다.
  var SEAT_PRICE = null;   // 원/좌석·월 — ★정해지면 숫자를 넣는다★

  function growthFetch(){
    el("liveText").textContent = "성장판 불러오는 중…";
    apiFetch(GROWTH, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ months: 12 }),
    })
      .then(function(r){ if (!r.ok) throw new Error("http " + r.status); return r.json(); })
      .then(function(d){
        GROWTH_DATA = d.board || null;
        el("liveText").textContent = "실측 연결됨 · " + new Date().toLocaleTimeString("ko-KR");
        renderGrowth();
      })
      .catch(function(){
        GROWTH_DATA = "failed";
        el("liveText").textContent = "성장판을 불러오지 못했습니다";
        renderGrowth();

  // ── 실증 지표판 (S609 · 대표 지시) ───────────────────────────────────
  //  ★★왜 만들었나★★
  //    대표 지시(2026-09-10) = "실증 지표판 … 해결해줘".
  //    IR 07장이 ★여덟 개 목표 지표★ 를 걸어 두었는데 ★세는 화면이 없었다★ —
  //    100명을 모아도 손으로 세면 ★4주가 끝난 뒤에야★ 답이 나온다.
  //    ★원자료는 이미 다 여기 와 있다★(DATA.daily) — 그래서 서버를 안 고치고 센다.
  //
  //  ★★넷은 셀 수 있고 넷은 못 센다 — 감추지 않는다 (2026-09-10 서버 실측)★★
  //    센다 = 4주 유지율 · 일 측정 성공률 · 주 3회 실천율 · 1인 평균 걸음
  //    ★못 센다★ = ①AI 권유 응답률 — ★서버에 자료가 0건★ 이다(단말 Room 의
  //      nudge_conversion 에만 있고 올라오는 길이 없다 · 서버에 표 자체가 없다)
  //      ②만족도 ③유료 전환 의향 ④재도입 의향 — ★설문이라 자동으로 못 센다★.
  //    ★못 세는 것을 빈칸으로 두지 않고 "왜 못 세는지"를 적는다★ — 빈칸은 고장으로
  //    읽히고, 고장으로 읽히면 아무도 이 화면을 안 본다(이 콘솔의 관통 원칙).
  //
  //  ★분모를 반드시 함께 적는다★ — "85%"만 적으면 두 사람 중 한 명인지 백 명 중
  //  여든다섯인지 알 수 없다. 이 콘솔은 ★평균 금지 · 대상 명시 · 근거 두께★ 다.
  var KPI = {
    /** 유지율의 기준 — IR 07장이 말하는 "4주". */
    retentionDays: 28,
    /** 최근 구간 — 주 단위 지표의 창. */
    recentDays: 7,
    /** "주 3회 이상 실천"의 기준 회수. */
    practiceDaysPerWeek: 3,
    /** IR 07장 목표치(표시용 · 판정에는 안 쓴다). */
    target: {
      retention: 80, measure: 85, practice: 55, steps: 1500,
    },
  };

  /** 그 어르신의 첫 기록일로부터 며칠 지났나. 기록이 없으면 null. */
  function firstSeenDaysAgo(id){
    var ds = dailyOf(id);
    if (!ds.length) return null;
    return daysBetween(ds[0].metric_date);
  }

  /** 최근 [n]일 안의 행들. */
  function recentRows(id, n){
    return dailyOf(id).filter(function(r){ return daysBetween(r.metric_date) < n; });
  }

  /**
   * 실증 지표 넷을 센다. ★못 세면 null★ — 0 이 아니다.
   *
   * ★"잰 날"의 정의는 상태판과 같다★ = step_count 칸이 있는 날(0 도 잰 날이다).
   * ★"걸으신 날"은 실외 걷기가 난 날★(stroll_distance_m > 0) — 실내 제자리걸음을
   * 실천으로 세면 IR 이 파는 그 숫자가 아니게 된다(대표 결정과 일관).
   */
  function studyKpi(){
    var ids = Object.keys(roster());
    var range = (DATA && DATA.range_days) ? DATA.range_days : 14;

    // ① 4주 유지율 — 대상은 ★28일보다 앞서 시작한 분★ 뿐이다(어제 오신 분을 셀 수 없다).
    var eligible = ids.filter(function(id){
      var d = firstSeenDaysAgo(id);
      return d !== null && d >= KPI.retentionDays;
    });
    var retained = eligible.filter(function(id){ return recentRows(id, KPI.recentDays).length > 0; });
    // ★창이 짧으면 아예 못 센다★ — 28일 앞을 볼 수 없으면 "0명"이 아니라 "모른다".
    var canRetention = range >= (KPI.retentionDays + KPI.recentDays);

    // ② 일 측정 성공률 — 최근 7일, ★사람×날★ 이 분모다.
    var slots = 0, measured = 0;
    // ③ 주 3회 이상 실천율 · ④ 1인 평균 일 걸음
    var practiced = 0, active = 0, stepSum = 0, stepDays = 0;
    ids.forEach(function(id){
      var rows = recentRows(id, KPI.recentDays);
      if (!rows.length) return;
      active++;
      slots += KPI.recentDays;
      var walkDays = 0;
      rows.forEach(function(r){
        if (r.step_count !== null && r.step_count !== undefined) {
          measured++;
          stepSum += num(r.step_count); stepDays++;
        }
        if (num(r.stroll_distance_m) > 0) walkDays++;
      });
      if (walkDays >= KPI.practiceDaysPerWeek) practiced++;
    });

    return {
      rangeDays: range,
      canRetention: canRetention,
      retentionEligible: eligible.length,
      retentionKept: retained.length,
      measureSlots: slots,
      measureDone: measured,
      activeElders: active,
      practiced: practiced,
      stepAvg: stepDays > 0 ? Math.round(stepSum / stepDays) : null,
      stepDays: stepDays,
    };
  }

  /** 백분율 한 칸. ★분모가 0 이면 "—"★ (0% 라고 적으면 실패로 읽힌다). */
  function pct(a, b){ return b > 0 ? Math.round(a / b * 100) + "%" : "—"; }

  /** 실증 지표판 한 덩어리. */

    var k = studyKpi();
    var html = '<section><div class="sechead"><div><h2>실증 지표판' +

    html += '<div class="cards">' +
      cardHtml("4주 유지율",

                 : ("기간을 " + (KPI.retentionDays + KPI.recentDays) + "일 이상으로 바꾸면 셉니다 (지금 " + k.rangeDays + "일)")) +
      cardHtml("일 측정 성공률", pct(k.measureDone, k.measureSlots),

      cardHtml("주 3회 이상 실천율", pct(k.practiced, k.activeElders),
               k.practiced + " / " + k.activeElders + "명 · 최근 7일에 실외 걷기가 3일 이상 · 목표 " + KPI.target.practice + "%") +
      cardHtml("1인 평균 일 걸음",
               k.stepAvg === null ? "—" : (k.stepAvg.toLocaleString() + "보"),
               k.stepDays > 0
                 ? ("잰 날 " + k.stepDays + "일의 평균 · 목표 증가 +" + KPI.target.steps.toLocaleString() + "보")
                 : "최근 7일에 걸음을 잰 날이 없습니다") +
      "</div>";

    // ★못 세는 넷을 그 자리에 적는다★ — 빈칸으로 두면 고장으로 읽힌다.
    html += '<div class="tablewrap"><table><tr><th>아직 못 세는 지표</th><th>왜 못 세나</th><th>세려면</th></tr>' +
      '<tr><td>AI 권유 응답률</td><td>서버에 자료가 0건입니다 — 단말에만 남고 올라오는 길이 없습니다</td>' +
      '<td>단말 nudge_conversion 을 일일 업로드에 싣고 서버 표와 화이트리스트를 함께 만듭니다</td></tr>' +
      '<tr><td>보호자 만족도</td><td>설문입니다</td><td>종이 또는 링크로 받아 입력합니다</td></tr>' +
      '<tr><td>보호자 유료 전환 의향</td><td>설문입니다</td><td>같음</td></tr>' +
      '<tr><td>복지관 재도입 의향</td><td>설문입니다</td><td>같음</td></tr>' +
      "</table></div>";

    html += '<div class="note">셈의 규칙 · ' +
      '“잰 날”은 걸음 칸이 있는 날입니다(0보도 잰 날입니다) · ' +
      '“실천”은 실외 걷기가 난 날입니다(실내 제자리걸음은 세지 않습니다) · ' +
      '유지율의 대상은 28일 전부터 계신 분뿐입니다(어제 오신 분은 셀 수 없습니다) · ' +
      '분모가 0이면 0%가 아니라 —로 적습니다.</div>';

    return html + "</section>";
  }

  // ── 화면 1: 개요 ─────────────────────────────────────────────────────
  function renderOverview(){
    var rs = roster(), ids = Object.keys(rs);
    var quietHidden = quietHiddenCount();
    var reporting = ids.filter(function(id){ return dailyOf(id).length > 0; }).length;
    // ★(S508) 기기 상태 — 보고 중인 기기 수와 그중 이상이 있는 기기 수.
    //   ★두 숫자를 함께 보여 준다★: "이상 0명"만 적으면 아무도 보고를 안 해서 0인 것과
    //   정말로 다 멀쩡한 것이 같아 보인다(근거의 두께를 함께 적는다는 이 콘솔의 원칙).
    var devReporting = ids.filter(function(id){ return latestHealth(id) !== null; }).length;
    // ★★(S540) 보고가 끊긴 기기는 "기기 이상"으로 세지 않는다 — 경보 목록과 같은 규칙★★
    //   [무엇이 어긋나 있었나] 경보 목록(buildAlerts ④)은 ★이미★ staleDays 를 보고
    //   "보고가 끊긴 기기는 옛 값으로 판정하지 않는다"를 지키는데, ★이 요약 숫자만★
    //   날짜를 안 보고 마지막 값으로 판정했다. → ★같은 판정이 두 곳에서 다르게 났다★.
    //   2026-08-13 실측: 어제까지 보고하고 멈춘 기기 2대의 옛 값(마이크 15번 죽음 ·
    //   들은 적 없음)이 오늘 카드에 그대로 세어져 ★"기기 이상 6명" = 전원★ 이 됐다.
    //   ★전원에 뜨는 경보는 경보가 아니라 소음이고, 그 사이에서 진짜 고장이 묻힌다★(S508).
    //
    //   ★"끊김"을 0 으로 접지 않는다★ — 세지 않는 대신 ★따로 센다★(devStale).
    //   보고가 끊긴 것은 "이상 없음"이 아니라 ★다른 종류의 이상★ 이다. 그 사실은
    //   카드 부제에 그대로 적는다(근거의 두께를 함께 적는다는 이 콘솔의 원칙).
    //
    //   ★대표 질문("앱 삭제 때 신호를 보내면 되나")의 실제 답이 이 자리다★ —
    //   안드로이드는 자기 앱이 지워지는 것을 알 수 없어 삭제 신호를 만들 수 없다.
    //   그래서 ★서버가 침묵으로 판정한다★: 보고가 N일 없으면 떠난 것으로 본다.
    function healthGapOf(id){
      var h = latestHealth(id);
      if (!h) return null;
      return daysBetween(h.metric_date);
    }
    function isStaleDevice(id){
      var g = healthGapOf(id);
      return g !== null && g > DEVICE.staleDays;
    }
    var devStale = ids.filter(isStaleDevice).length;
    var devBad = ids.filter(function(id){
      if (isStaleDevice(id)) return false;
      return deviceProblems(latestHealth(id)).length > 0;
    }).length;

    // ★(S523 대표 지적 "체계적으로, 데이터를 쓰기 편하게") — 개요의 축을
    //   "회사 자산으로 무엇이 얼마나 쌓이고 있는가" 로 다시 잡았다.
    //   카드 = 자산 숫자(어르신 · 오늘 도착 · 누적) · 정보성 문구는 전량 걷어냈다(대표 지시).
    var todayStr = today();
    var arrivedToday = ids.filter(function(id){
      return dailyOf(id).some(function(r){ return r.metric_date === todayStr; });
    }).length;
    var totalDailyRows = (DATA.daily || []).length;
    // ★★(S606) 걸음을 재고 있는 곳 — 이 콘솔에서 ★가장 중요한 한 숫자★★★
    //   대표 지적(2026-09-08) = "제대로 사용하지 않아서 위험이라고 나온 경고만 잔뜩".
    //   ★진단은 화면이 아니라 온보딩이었다★ — 2026-09-09 실측: 등록 21곳 중 최근 7일에
    //   걸음을 한 번이라도 잰 곳은 ★8곳뿐★ 이고 나머지 13곳도 ★행은 매일 오고 있었다★.
    //   ★그래서 "데이터가 온다"로는 앱이 도는지 알 수 없다★ — 걸음을 재야 도는 것이다.
    var measuring = ids.filter(function(id){
      var w = walkStats(id);
      return w !== null && w.measuredDays > 0;
    }).length;

    var html = "";
    // ★★(S606) 경보 블록을 통째로 걷어냈다 — 대표 지시 2026-09-09★★

          : (Math.round(r.gait_cv_percent * 10) / 10) + "% <span class=\"muted\">(" +
            (num(r.gait_interval_samples) === null ? "?" : r.gait_interval_samples) + ")</span>") + "</td><td>" +
        // 밤 움직임 — ★"수면"이 아니다★. 폰이 밤에 얼마나 움직였나일 뿐이다.
        (num(r.night_steps) === null
          ? '<span class="muted">측정 중</span>'
          : r.night_steps + "보 <span class=\"muted\">(조용 " +
            (num(r.night_longest_quiet_hours) === null ? "?" : r.night_longest_quiet_hours) +
            "시간)</span>") + "</td><td>" +
        // 활동 시간대 — 창 + ★그 창이 실제로 차 있었나(칸 수)★.
        (num(r.active_hour_count) === null
          ? '<span class="muted">측정 중</span>'
          : (num(r.first_active_hour) === null
              ? '0개 <span class="muted">(안 걸으심)</span>'
              : r.first_active_hour + "~" + r.last_active_hour + "시 " +
                '<span class="muted">(' + r.active_hour_count + "개)</span>")) + "</td><td>" +
        (num(r.life_space_km2) === null ? '<span class="muted">측정 중</span>'
          : (Math.round(num(r.life_space_km2) * 1000) / 1000) + " km²") + "</td><td>" +
        (num(r.night_screen_on_count) === null ? '<span class="muted">측정 중</span>'
          : r.night_screen_on_count + "회") + "</td><td>" +
        fmt(r.away_from_home_minutes, "분") + "</td><td>" +
        fmt(r.outing_count, "회") + "</td></tr>";
    });
    html += "</table></div></section>";

    el("view").innerHTML = html;
    bindGo(); bindCsv();
  }

  // ── 화면 4: 연구 (S513) ──────────────────────────────────────────────
  //   ★왜 별도 화면인가★: 연구 배정은 ★운영자만★ 하는 일이고 자주 하지 않는다.
  //     개요에 얹으면 매일 보는 화면이 길어지고, 정작 급한 "기기 이상"이 아래로 밀린다.
  //   ★PC 전용이다★(대표 지시) — 반응형에 시간 쓰지 말 것.
  function assignmentsOf(){ return DATA.study_assignment || []; }
  function snapshotsOf(){ return DATA.study_snapshot || []; }
  function snapCount(pseudonym){
    return snapshotsOf().filter(function(r){ return r.pseudonym === pseudonym; }).length;
  }
  // ★서버가 준 pending_devices = 두드렸는데 elderly 에 없는 기기★ = ★미등록 집합★.
  //   배정은 됐는데 여기 들어 있으면 그 기기는 자료를 ★모으고는 있지만 못 보내고 있다★
  //   (ingest-study-snapshot 이 미등록 기기에 404 를 준다). 그 조용한 실패를 표에 띄운다.
  function unregisteredSet(){
    var m = {};
    (DATA.pending_devices || []).forEach(function(c){ m[c.device_id] = true; });
    return m;
  }

  // ── 설문(S514) ────────────────────────────────────────────────────────
  //   ★척도 목록을 화면에 박아 두지 않는다★ — IRB 연구계획서가 "정확한 버전·문항은
  //     심리 자문 감수 후 확정한다"고 적어 두었고, CRF 표의 네 행 중 둘이 아직
  //     "[확정]"·"[선택]" 이다. 서버 조회표에 한 줄 넣으면 이 화면이 따라온다.
  // ★측정 시점 — 처음·중간·끝(대표 결정 2026-08-04 · 023 마이그레이션).
  //   ★서버의 study_survey_timepoint_chk 및 console_record_study_survey 의 not in 목록과
  //     ★같은 값이어야 한다★. 어긋나면 화면은 고르게 해 놓고 서버가 거부해,
  //     운영자는 왜 저장이 안 되는지 알 수 없다. 넓히려면 세 곳을 함께 고친다.
  var SURVEY_TIMEPOINTS = [0, 6, 12];
  function tpLabel(t){
    var n = Number(t);
    return n === 0 ? "0주 (기저)" : n === 12 ? "12주 (종료)" : n === 6 ? "6주 (중간)" : n + "주";
  }
  // numeric(6,2) 는 "12.00" 으로 온다 — 사람이 읽는 자리에서는 꼬리 0 을 떼되
  // ★값을 반올림해 뭉개지 않는다★(3.5 를 쓰는 단축척도가 있다).
  function fmtScore(v){ var n = num(v); return n === null ? "" : String(Math.round(n * 100) / 100); }
  function instrumentsOf(){ return DATA.study_survey_instrument || []; }
  function surveysOf(){ return DATA.study_survey || []; }
  function surveyCell(pseudonym, instrument, tp){
    var rows = surveysOf();
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (r.pseudonym === pseudonym && r.instrument === instrument &&
          Number(r.timepoint_week) === Number(tp)) return r;
    }
    return null;
  }
  // ★변화량의 좋고 나쁨은 ★척도가 정한다★ — LSNS-6 은 오르면 좋고 UCLA 외로움은
  //   오르면 나쁘다. 한 방향으로 칠하면 ★외로움이 늘어난 것을 개선으로 보여 준다★.
  function surveyDelta(inst, base, last){
    if (!base || !last) return '<span class="muted">—</span>';
    var d = num(last.total_score) - num(base.total_score);
    var r = Math.round(d * 10) / 10;
    if (r === 0) return '<span class="muted">0</span>';
    var good = inst.higher_is_better ? (r > 0) : (r < 0);
    return '<span class="' + (good ? "pos" : "neg") + '">' + (r > 0 ? "+" : "") + r + "</span>";
  }

  function renderStudy(){
    var assigns = assignmentsOf();
    var active = assigns.filter(function(r){ return !r.revoked_at; });
    var snaps = snapshotsOf();
    var unreg = unregisteredSet();
    var devices = DATA.all_devices || [];

    // 기기 -> 현재 배정된 가명(있으면). 재배정 시 화면이 그 사실을 말해 준다.
    var nameOfDevice = {};
    active.forEach(function(r){ nameOfDevice[r.device_id] = r.pseudonym; });

    // ★(S523 대표 지적 "연구 참여 관리는 또 뭐야? 관리하고 말것도 없어. 데이터 뽑아야해")
    //   — 화면의 정체를 "관리"에서 ★입력 창구★ 로 좁혔다. 하는 일은 딱 둘:
    //   ①가명 배정(자동 수집이 붙는 자리) ②대면 설문 점수 입력. 뽑는 것(CSV)은 개요의
    //   "데이터 내려받기" 허브로 옮겼고, 카드·설명 문구는 걷어냈다.
    var html = crumb([{ t: "개요", go: { view: "overview" } }, { t: "연구" }]);
    html += "<h1>연구 배정 · 설문 입력</h1>";

    // ── 1) 배정 ────────────────────────────────────────────────────────
    //   ★폼을 숨기지 않는다★ — 배정할 새 기기가 없을 때가 곧 고칠 때다.
    html += '<section><div class="sechead"><div><h2>배정</h2>' +
      '<div class="desc">이미 배정된 기기를 다시 고르면 <b>군·기저일만 바뀌고 가명은 그대로</b>입니다.</div></div></div>';
    if (!devices.length) {
      html += '<div class="note">아직 서버를 두드린 기기가 없습니다.</div>';
    } else {
      html += '<div class="row" style="gap:10px;flex-wrap:wrap;align-items:flex-end">' +
        '<label style="display:block">기기<br><select id="asgDevice" style="min-width:340px">' +
        '<option value="">— 고르세요 —</option>';
      devices.forEach(function(c){
        var label = (c.alias ? c.alias : "이름 없음") +
          "  ·  " + String(c.device_id).slice(0, 8) + "…" +
          (nameOfDevice[c.device_id] ? "  ·  현재 " + nameOfDevice[c.device_id] : "  ·  미배정") +
          (c.registered ? "" : "  ·  연동 전");
        html += '<option value="' + esc(c.device_id) + '">' + esc(label) + "</option>";
      });
      html += "</select></label>" +
        '<label style="display:block">군<br><select id="asgCohort">' +
        '<option value="IMMEDIATE">IMMEDIATE (즉시)</option>' +
        '<option value="WAITLIST">WAITLIST (대기)</option></select></label>' +
        '<label style="display:block">기저일(Week0)<br><input id="asgBaseline" type="date" value="' + today() + '"></label>' +
        '<label style="display:block">종이 동의서<br>' +
        '<input type="checkbox" id="asgPaper"> <span style="font-size:13px">서명 받았음</span></label>' +
        '<button class="primary" id="asgBtn" style="margin-bottom:2px">배정</button></div>' +
        '<div id="asgMsg" style="font-size:13px;margin-top:8px"></div>' +
        // ★(S523) 안내는 이 한 줄만 남긴다 — 기저일 오입력은 소급이 안 되는 유일한 값이다
        //   (S515 실측 · 나머지 규칙은 서버가 지키므로 화면이 떠들 필요 없다).
        '<div class="note">★<b>기저일</b>은 처음에 정확히 — 이미 얼린 주차의 번호는 나중에 못 바꿉니다.</div>';
    }
    html += "</section>";

    // ── 2) 참여자 ──────────────────────────────────────────────────────
    html += '<section><div class="sechead"><div><h2>참여자' +
      '<span class="whose">가명 기준 · 대응표 없음</span></h2></div>' +
      csvBtn("study_roster") + "</div>";
    if (!assigns.length) {
      html += '<div class="note">아직 배정된 참여자가 없습니다.</div>';
    } else {
      html += '<div class="tablewrap"><table><tr><th>가명</th><th>군</th><th>기저일</th>' +
        "<th>종이 동의</th><th>자료</th><th>기기</th><th></th></tr>";
      assigns.forEach(function(r){
        var n = snapCount(r.pseudonym), st;
        if (r.revoked_at) st = '<span class="muted">철회됨</span>';
        else if (n > 0) st = "<b>" + n + "주</b>";
        else if (unreg[r.device_id]) st = '<span class="warn">0주 · 연동 전</span>';
        else st = '<span class="muted">0주</span>';
        html += "<tr" + (r.revoked_at ? ' style="opacity:.5"' : "") + ">" +
          "<td><b>" + esc(r.pseudonym) + "</b></td>" +
          "<td>" + esc(r.cohort) + "</td>" +
          "<td>" + esc(r.baseline_date) + "</td>" +
          // ★(S523) 종이 동의 — 안 받았으면 ★경고색★ 이다. IRB 가 약속한 서면 동의라
          //   "아직"이 눈에 안 띄면 8/11 창구에서 통째로 빠진 채 지나간다.
          "<td>" + (r.paper_consent ? "받음" : '<span class="warn">아직</span>') + "</td>" +
          "<td>" + st + "</td>" +
          "<td style=\"font-family:monospace;font-size:11px\" title=\"" + esc(r.device_id) + "\">" +
            esc(String(r.device_id || "").slice(0, 8)) + "…</td>" +
          "<td>" + (r.revoked_at ? "" :
            '<button class="csv" data-revoke="' + esc(r.device_id) + '" data-revokename="' + esc(r.pseudonym) + '">철회</button>') +
          "</td></tr>";
      });
      html += "</table></div>" +
        '<div id="revMsg" style="font-size:13px;margin-top:8px"></div>';
    }
    html += "</section>";

    // ── 3) 설문 점수 (S514) — IRB CRF ① ★사람이 종이로 잰 것★ ────────────
    //   ★기기 자료(아래 ④)보다 ★먼저★ 놓는다★ — CRF 자신의 순서가 그렇고(① 설문 → ②
    //     기기 자동수집), 이 연구의 ★일차 지표★ 가 설문의 사전-사후 변화이기 때문이다.
    //   ★여기 적힌 점수와 아래 주차 자료는 ★같은 가명★ 으로 이어진다★ — 그것이 이 자리를
    //     만든 이유다. 종전에는 두 숫자가 종이와 DB 로 갈라져 사람이 엑셀로 맞춰야 했고,
    //     그 대조는 실수가 섞이고 재현이 안 됐다(S511 §4-D).
    var insts = instrumentsOf();
    html += '<section><div class="sechead"><div><h2>설문 점수 ' +
      '<span class="muted" style="font-size:13px">대면 · IRB CRF ①</span></h2>' +
      '<div class="desc">종이로 받은 점수를 옮겨 적으면 <b>같은 가명으로</b> 아래 기기 자료와 이어집니다.</div></div>' +
      csvBtn("study_survey") + "</div>";
    if (!active.length) {
      html += '<div class="note">참여자가 없습니다. 먼저 배정하세요.</div>';
    } else if (!insts.length) {
      // ★"고를 척도가 없다"를 빈 드롭다운으로 조용히 보여 주지 않는다 — 무엇이 없는지 적는다.
      html += '<div class="note">쓸 수 있는 척도가 없습니다. 서버 척도 목록(study_survey_instrument)에 ' +
              '먼저 척도를 넣어야 합니다.</div>';
    } else {
      html += '<div class="row" style="gap:10px;flex-wrap:wrap;align-items:flex-end">' +
        '<label style="display:block">참여자<br><select id="svPseudo">';
      active.forEach(function(a){
        html += '<option value="' + esc(a.pseudonym) + '">' + esc(a.pseudonym) + " · " + esc(a.cohort) + "</option>";
      });
      html += "</select></label>" +
        '<label style="display:block">척도<br><select id="svInst" style="min-width:280px">';
      insts.forEach(function(x){
        html += '<option value="' + esc(x.code) + '">' + esc(x.label) +
          " (" + esc(fmtScore(x.min_score)) + "~" + esc(fmtScore(x.max_score)) + ")</option>";
      });
      html += "</select></label>" +
        '<label style="display:block">시점<br><select id="svTp">';
      SURVEY_TIMEPOINTS.forEach(function(t){
        html += '<option value="' + t + '">' + esc(tpLabel(t)) + "</option>";
      });
      html += "</select></label>" +
        '<label style="display:block">시행일<br><input id="svDate" type="date" value="' + today() + '"></label>' +
        '<label style="display:block">점수<br><input id="svScore" type="number" step="0.01" style="width:90px"></label>' +
        '<button class="primary" id="svBtn" style="margin-bottom:2px">저장</button>' +
        '<button class="csv" id="svDelBtn" style="margin-bottom:2px">지우기</button></div>' +
        '<div id="svMsg" style="font-size:13px;margin-top:8px"></div>';
      // ★(S523) 사용 규칙 4줄은 걷어냈다(대표 지시) — 덮어쓰기·범위 검증은 서버가
      //   집행하고, 실수는 저장 시 메시지(svMsg)로 그때그때 알린다.

      active.forEach(function(a){
        html += '<div style="margin:18px 0 6px"><b style="font-size:16px">' + esc(a.pseudonym) + "</b>" +
          '<span class="muted" style="margin-left:8px">' + esc(a.cohort) +
          " · 기저일 " + esc(a.baseline_date) + "</span></div>";
        html += '<div class="tablewrap"><table><tr><th>척도</th>';
        SURVEY_TIMEPOINTS.forEach(function(t){ html += "<th>" + esc(tpLabel(t)) + "</th>"; });
        html += "<th>변화 (0→12주)</th></tr>";
        insts.forEach(function(x){
          html += "<tr><td>" + esc(x.label) +
            '<span class="muted" style="font-size:11px"> ' +
            esc(fmtScore(x.min_score)) + "~" + esc(fmtScore(x.max_score)) + " · " +
            (x.higher_is_better ? "높을수록 좋음" : "낮을수록 좋음") + "</span></td>";
          SURVEY_TIMEPOINTS.forEach(function(t){
            var c = surveyCell(a.pseudonym, x.code, t);
            html += "<td" + (c ? ' title="' + esc("시행일 " + c.measured_on +
                     (c.recorded_by ? " · 기록 " + c.recorded_by : "")) + '"' : "") + ">" +
              (c ? "<b>" + esc(fmtScore(c.total_score)) + "</b>" : '<span class="muted">—</span>') + "</td>";
          });
          html += "<td>" + surveyDelta(x, surveyCell(a.pseudonym, x.code, 0),
                                          surveyCell(a.pseudonym, x.code, 12)) + "</td></tr>";
        });
        html += "</table></div>";
      });
      // ★(S523) 표 아래 설명은 걷어냈다(대표 지시) — 척도 방향·범위는 척도 이름 옆에,
      //   빈 칸의 뜻(측정 안 함≠0)은 데이터 규약(RS-4)에 이미 있다.
    }
    html += "</section>";

    // ── 4) 주차 자료 — ★참여자 전원★ 을 그린다(자료가 없어도 자리를 만든다) ──
    html += '<section><div class="sechead"><div><h2>주차 자료' +
      '<span class="whose">참여자 한 명당 한 묶음</span></h2></div>' +
      csvBtn("study_weeks") + "</div>";
    if (!active.length) {
      html += '<div class="note">참여자가 없습니다.</div></section>';
    } else {
      active.forEach(function(a){
        var mine = snaps.filter(function(r){ return r.pseudonym === a.pseudonym; });
        html += '<div style="margin:18px 0 6px"><b style="font-size:16px">' + esc(a.pseudonym) + "</b>" +
          '<span class="muted" style="margin-left:8px">' + esc(a.cohort) +
          " · 기저일 " + esc(a.baseline_date) + " · " + mine.length + "주 도착</span>";
        html += "</div>";
        if (!mine.length) {
          // ★빈 곳은 물음을 만든다 — 없으면 없다고 그 자리에 적는다.
          html += '<div class="note" style="margin:0 0 6px">아직 자료가 없습니다. ' +
                  '<b>첫 주가 끝나야</b> 첫 줄이 생깁니다' +
                  (unreg[a.device_id] ? ' — 게다가 이 기기는 <b>복지사 연동 전</b>이라 아직 서버로 못 보냅니다.' : '.') +
                  "</div>";
          return;
        }
        html += '<div class="tablewrap"><table><tr><th>주차</th><th>기간</th>' +
          // ★★(S606) 연결·발화 열을 걷어냈다 — 대표 지시 2026-09-09★★
          //   걷어낸 것 = 어르신 발화 · 사회적 체크인 · 선제 응답률 · 기분 · 대화(분) ·
          //   연결지수. ★전부 마이크가 재료였고 2026-09-03 이후로는 오지 않는다★ —

          "<th>집 밖(분/일)</th></tr>";
        mine.forEach(function(r){
          html += "<tr><td><b>" + esc(String(r.study_week)) + "주</b></td>" +

            // ★null 은 "측정 중"이 아니라 "—" 다 — 이미 얼린 주는 소급해 안 채워진다.
            "<td>" + (num(r.away_minutes_avg) === null ? '<span class="muted">—</span>'

                        '<span class="muted" style="font-size:11px"> (' +
                        esc(String(r.away_measured_days == null ? "?" : r.away_measured_days)) + "일)</span>") + "</td></tr>";
        });
        html += "</table></div>";
      });
      html += "</section>";
    }

    el("view").innerHTML = html;
    bindGo(); bindCsv(); bindStudy(); bindSurvey();
  }

  // ★(S514) 두 화면(배정·설문)이 같은 말투로 답하도록 ★한 곳★ 에 둔다.
  //   종전엔 bindStudy 안에만 있었는데, 설문에서 복붙하면 어느 날 한쪽만 고쳐져
  //   같은 실패에 화면이 서로 다른 말을 하게 된다(S486 이 TTS 에서 걷어낸 것과 같은 결).
  function say(elId, ok, text){
    var m = el(elId); if (!m) return;
    m.style.color = ok ? "#0e7490" : "#b91c1c";
    m.textContent = text;
    setTimeout(function(){ if (m) m.textContent = ""; }, 6000);
  }
  // ★서버가 던진 코드를 ★사람 말★ 로 옮긴다 — 운영자에게 'SCORE_OUT_OF_RANGE' 를
  //   그대로 보여 주면 무엇을 고쳐야 하는지 알 수 없다.
  function rpcReason(r){
    var raw = (r.body && (r.body.message || r.body.hint)) || r.raw || "";
    if (raw.indexOf("NOT_CONSOLE_ADMIN") >= 0) return "권한이 없습니다.";
    if (raw.indexOf("INVALID_COHORT") >= 0) return "군이 올바르지 않습니다.";
    if (raw.indexOf("BASELINE_DATE_REQUIRED") >= 0) return "기저일을 넣어 주세요.";
    if (raw.indexOf("DEVICE_ID_REQUIRED") >= 0) return "기기를 골라 주세요.";
    if (raw.indexOf("ASSIGNMENT_NOT_FOUND") >= 0) return "그 배정을 찾지 못했습니다.";
    // ★(S514) 설문
    if (raw.indexOf("SCORE_OUT_OF_RANGE") >= 0) return "점수가 그 척도의 범위를 벗어납니다 — 종이를 다시 확인해 주세요.";
    if (raw.indexOf("SCORE_REQUIRED") >= 0) return "점수를 넣어 주세요.";
    if (raw.indexOf("UNKNOWN_INSTRUMENT") >= 0) return "그 척도를 찾지 못했습니다.";
    if (raw.indexOf("INVALID_TIMEPOINT") >= 0) return "시점이 올바르지 않습니다.";
    if (raw.indexOf("MEASURED_ON_REQUIRED") >= 0) return "시행일을 넣어 주세요.";
    if (raw.indexOf("PSEUDONYM_REQUIRED") >= 0) return "참여자를 골라 주세요.";
    if (raw.indexOf("SURVEY_NOT_FOUND") >= 0) return "그 칸에는 적힌 점수가 없습니다.";
    // ★(S525) 사건 기록·경보
    if (raw.indexOf("EVENT_DATE_IN_FUTURE") >= 0) return "앞날은 적을 수 없습니다 — 이미 있었던 일만 적습니다.";
    if (raw.indexOf("EVENT_DATE_REQUIRED") >= 0) return "날짜를 골라 주세요.";
    if (raw.indexOf("NOTE_TOO_LONG") >= 0) return "너무 깁니다(200자까지).";
    if (raw.indexOf("NOTE_EMPTY") >= 0) return "내용을 적어 주세요.";
    if (raw.indexOf("ELDERLY_NOT_FOUND") >= 0) return "그 어르신을 찾지 못했습니다.";
    return "처리하지 못했습니다. 잠시 후 다시 시도해 주세요.";
  }

  // 배정·철회 — 성공하면 데이터를 다시 받아 표에 즉시 반영한다(성공 후 다시 받아 오는 결).
  function bindStudy(){
    var reason = rpcReason;

    var btn = el("asgBtn");
    if (btn) btn.addEventListener("click", function(){
      var dev = el("asgDevice").value, base = el("asgBaseline").value;
      if (!dev) { say("asgMsg", false, "기기를 골라 주세요."); return; }
      if (!base) { say("asgMsg", false, "기저일을 넣어 주세요."); return; }
      btn.disabled = true;
      // ★(이력) 종전에는 "종이 동의서는 콘솔이 묻지 않는다(대표 지시) — 대표가 직접
      //   받으신다" 였고, 그래서 이 값을 안 넘겨 서버는 늘 false 였다.
      // ★★(S523 · 2026-08-08 대표 지시로 뒤집힘) "콘솔박스 진행" — 종이로 받는 것과
      //   그 사실을 시스템에 남기는 것은 다르다. 8/11 PoC 에서 10명 서명을 받아도
      //   남길 곳이 없어(콘솔에 칸 0개) IRB 대조가 사람 기억에 걸려 있었다.
      //   서버 RPC 는 p_paper_consent 를 ★처음부터★ 받고 있었다 — 없던 것은 화면뿐이다.
      // ★체크 안 하면 아예 안 넘긴다(undefined)★ — false 를 보내도 서버가
      //   "paper_consent or 새값" 으로 지켜 주지만, 화면이 "안 받았다"를 주장하지는 않는다.
      var paperEl = el("asgPaper");
      var payload = {
        p_device_id: dev,
        p_cohort: el("asgCohort").value,
        p_baseline_date: base
      };
      if (paperEl && paperEl.checked) payload.p_paper_consent = true;
      rpc("console_assign_study_participant", payload).then(function(r){
        btn.disabled = false;
        if (r.ok) {
          var b = r.body, row = (b && b.length) ? b[0] : b;
          var name = row && row.pseudonym ? row.pseudonym : "";
          say("asgMsg", true, "배정했습니다" + (name ? " — 가명 " + name : "") +
              ". 그 기기는 다음 날 스스로 등록됩니다.");
          load();
        } else say("asgMsg", false, reason(r));
      });
    });

    Array.prototype.forEach.call(el("view").querySelectorAll("[data-revoke]"), function(b){
      b.addEventListener("click", function(){
        var dev = b.getAttribute("data-revoke"), name = b.getAttribute("data-revokename");
        // ★확인을 한 번 받는다★ — 표 안의 버튼이라 손이 미끄러지면 엉뚱한 참여자를 거둔다.
        //   ★같은 좌표를 두 번 누르는 사고를 막는다(메모리 adb-tap-repeat-destructive 와 같은 결).
        if (!window.confirm(name + " 님의 연구 배정을 철회할까요?\n\n" +
            "그 기기는 다음 날 스스로 연구에서 빠지고,\n회사에 보관된 그분 몫의 숫자도 지워 달라고 청합니다.")) return;
        b.disabled = true;
        rpc("console_revoke_study_assignment", { p_device_id: dev }).then(function(r){
          b.disabled = false;
          if (r.ok) { say("revMsg", true, name + " 배정을 철회했습니다."); load(); }
          else say("revMsg", false, reason(r));
        });
      });
    });
  }

  // ★(S514) 설문 저장·지우기 — 종이에서 옮겨 적는 그 한 칸.
  function bindSurvey(){
    var btn = el("svBtn");
    if (btn) btn.addEventListener("click", function(){
      var score = el("svScore").value, date = el("svDate").value;
      // ★빈 칸을 0 으로 보내지 않는다★ — "안 쟀다"와 "0점"은 다른 사실이고,
      //   0 으로 적으면 그분이 관계망이 전무하다는 뜻이 된다(서버도 같은 이유로 거부한다).
      if (score === "") { say("svMsg", false, "점수를 넣어 주세요."); return; }
      if (!date) { say("svMsg", false, "시행일을 넣어 주세요."); return; }
      btn.disabled = true;
      rpc("console_record_study_survey", {
        p_pseudonym: el("svPseudo").value,
        p_instrument: el("svInst").value,
        p_timepoint_week: Number(el("svTp").value),
        p_measured_on: date,
        p_total_score: Number(score)
      }).then(function(r){
        btn.disabled = false;
        if (r.ok) {
          say("svMsg", true, "저장했습니다.");
          // ★점수 칸을 비운다★ — 안 비우면 다음 참여자를 고르고 그대로 눌렀을 때
          //   ★앞사람 점수가 그 사람 것으로 저장된다★.
          el("svScore").value = "";
          load();
        } else say("svMsg", false, rpcReason(r));
      });
    });

    var del = el("svDelBtn");
    if (del) del.addEventListener("click", function(){
      var p = el("svPseudo").value, i = el("svInst").value, t = Number(el("svTp").value);
      var c = surveyCell(p, i, t);
      if (!c) { say("svMsg", false, "그 칸에는 적힌 점수가 없습니다."); return; }
      // ★확인을 받는다★ — 지우면 되돌릴 수 없고 원본은 종이에만 남는다.
      //   ★"고치려는 것이면 지우지 말라"고 여기서 말해 준다★ — 덮어쓰기가 정정 수단이고,
      //   지우기가 습관이 되면 언젠가 남의 칸을 지운다.
      if (!window.confirm(p + " · " + tpLabel(t) + " 의 점수 " + fmtScore(c.total_score) + " 를 지울까요?\n\n" +
          "되돌릴 수 없습니다.\n점수를 고치려는 것이라면 지우지 말고 다시 저장하세요(덮어씁니다).")) return;
      del.disabled = true;
      rpc("console_delete_study_survey", {
        p_pseudonym: p, p_instrument: i, p_timepoint_week: t
      }).then(function(r){
        del.disabled = false;
        if (r.ok) { say("svMsg", true, "지웠습니다."); load(); }
        else say("svMsg", false, rpcReason(r));
      });
    });
  }


  // ★★(S606) 일별 걸음 막대 — 종전 dailySvg(관계망·미디어)를 대신한다★★
  //   ★못 잰 날은 막대를 아예 안 그린다★ — 0 높이 막대와 "그림 없음"은 화면에서
  //   같아 보이므로, 미측정인 날은 자리만 비우고 날짜 라벨은 남긴다(그 날이
  //   존재하지 않은 것처럼 보이면 안 된다).
  function dailyStepSvg(ds){
    if (!ds.length) return '<div class="muted" style="font-size:13px">이 기간에는 기록이 없습니다</div>';
    var maxV = 100;
    ds.forEach(function(r){
      var v = num(r.step_count);
      if (v !== null && v > maxV) maxV = v;
    });
    var W = 1000, H = 210, L = 46, R = 10, T = 12, B = 30;
    var bw = (W - L - R) / ds.length;
    var y = function(v){ return T + (1 - v / maxV) * (H - T - B); };
    var out = '<svg viewBox="0 0 ' + W + " " + H + '">';
    out += '<text x="4" y="' + (T + 10) + '" font-size="11" fill="#5b7078">' + Math.round(maxV) + "보</text>";
    ds.forEach(function(r, i){
      var v = num(r.step_count), x0 = L + i * bw;
      if (v !== null) {
        out += '<rect x="' + (x0 + bw * 0.2) + '" y="' + y(v) + '" width="' + bw * 0.6 +
               '" height="' + (y(0) - y(v)) + '" fill="#17857A" rx="2"><title>' +
               esc(r.metric_date + " · " + v + "보") + "</title></rect>";
      }
      out += '<text x="' + (x0 + bw / 2) + '" y="' + (H - 8) + '" font-size="10.5" fill="#5b7078" text-anchor="middle">' +
             esc(String(r.metric_date).slice(5)) + "</text>";
    });
    out += "</svg>";
    out += '<div class="legend"><span><i style="background:#17857A"></i>하루 걸음</span>' +
           '<span class="muted">막대 없는 날 = 못 잰 날(0보가 아닙니다)</span></div>';
    return out;
  }

  // ── 관리자 관리 ──────────────────────────────────────────────────────
  function adminSection(){
    return "<section><h2>관리자 관리</h2>" +
      '<div class="desc">여기 등록된 이메일 계정만 이 콘솔을 열 수 있습니다. 아직 가입하지 않은 사람도 미리 등록해 둘 수 있어요' +
      "(나중에 같은 이메일로 로그인하면 바로 들어옵니다). 본인은 지울 수 없고, 마지막 한 명도 지울 수 없습니다.</div>" +
      '<div class="row" style="margin-bottom:12px">' +
      '<input id="newAdminEmail" type="email" placeholder="추가할 이메일" style="flex:1;min-width:220px">' +
      '<input id="newAdminNote" type="text" placeholder="메모 (예: 운영팀 김OO)" style="flex:1;min-width:180px">' +
      '<button class="primary" id="addAdminBtn">관리자 추가</button></div>' +
      '<div id="adminMsg" style="font-size:13px;margin-bottom:10px"></div>' +
      '<div class="tablewrap"><table id="adminTable"></table></div></section>';
  }
  function friendlyRpcError(r){
    var msg = (r.body && (r.body.message || r.body.hint)) || r.raw || "";
    if (msg.indexOf("INVALID_EMAIL") >= 0) return "이메일 형식이 올바르지 않습니다.";
    if (msg.indexOf("CANNOT_REMOVE_SELF") >= 0) return "본인은 지울 수 없습니다.";
    if (msg.indexOf("CANNOT_REMOVE_LAST_ADMIN") >= 0) return "마지막 관리자는 지울 수 없습니다.";
    if (msg.indexOf("NOT_CONSOLE_ADMIN") >= 0) return "권한이 없습니다.";
    return "처리하지 못했습니다. 잠시 후 다시 시도해 주세요.";
  }
  function adminMsg(text, ok){
    var e = el("adminMsg"); if (!e) return;
    e.textContent = text; e.style.color = ok ? "#0e7490" : "#b91c1c";
    setTimeout(function(){ if (e.textContent === text) e.textContent = ""; }, 6000);
  }
  function bindAdmin(){
    var add = el("addAdminBtn"); if (!add) return;
    add.addEventListener("click", function(){
      var email = el("newAdminEmail").value.trim();
      if (!email) { adminMsg("이메일을 입력해 주세요.", false); return; }
      rpc("console_add_admin", { p_email: email, p_note: el("newAdminNote").value.trim() }).then(function(r){
        if (r.ok) { el("newAdminEmail").value = ""; el("newAdminNote").value = ""; adminMsg("추가했습니다.", true); }
        else adminMsg(friendlyRpcError(r), false);
        loadAdmins();
      });
    });
    loadAdmins();
  }
  function loadAdmins(){
    var t = el("adminTable"); if (!t) return;
    rpc("console_list_admins").then(function(r){
      if (!r.ok || !Array.isArray(r.body)) { t.innerHTML = '<tr><td class="muted">관리자 목록을 불러오지 못했습니다</td></tr>'; return; }
      var me = (el("whoText").textContent || "").toLowerCase();
      t.innerHTML = "<tr><th>이메일</th><th>메모</th><th>등록일</th><th></th></tr>" + r.body.map(function(a){
        var isMe = String(a.email).toLowerCase() === me;
        var btn = isMe ? '<span class="muted">본인</span>'
                       : '<button class="danger" data-remove="' + esc(a.email) + '">삭제</button>';
        return "<tr><td>" + esc(a.email) + "</td><td>" + esc(a.note || "") + "</td><td>" +
               esc(String(a.created_at || "").slice(0, 10)) + "</td><td>" + btn + "</td></tr>";
      }).join("");
      Array.prototype.forEach.call(t.querySelectorAll("[data-remove]"), function(b){
        b.addEventListener("click", function(){
          var email = b.getAttribute("data-remove");
          if (!confirm(email + " 님의 관리자 권한을 지울까요?")) return;
          rpc("console_remove_admin", { p_email: email }).then(function(r2){
            adminMsg(r2.ok ? "삭제했습니다." : friendlyRpcError(r2), r2.ok);
            loadAdmins();
          });
        });
      });
    });
  }

  // ── 이벤트 ───────────────────────────────────────────────────────────
  el("googleBtn").addEventListener("click", function(){ socialLogin("google"); });
  el("refreshBtn").addEventListener("click", load);
  el("homeBtn").addEventListener("click", function(){ go({ view: "overview" }); });
  el("growthBtn").addEventListener("click", function(){ go({ view: "growth" }); });
  el("secBtn").addEventListener("click", function(){ go({ view: "security" }); });
  el("seatBtn").addEventListener("click", function(){ go({ view: "seats" }); });
  el("logoutBtn").addEventListener("click", function(){ setSess(null); showLogin(null); });
  el("rangeSelect").value = String(rangeDays());
  el("rangeSelect").addEventListener("change", function(){
    setRangeDays(Number(el("rangeSelect").value));
    el("liveText").textContent = "기간 바꾸는 중…";
    load();   // 기간이 바뀌면 서버에서 다시 받아 그 자리에서 갱신한다
  });

  captureHashSession();
  if (sess()) load(); else showLogin(null);
})();
</script>
