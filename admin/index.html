<title>텔로스 케어 · 관리자 콘솔</title>
<!-- ============================================================================
  텔로스 케어 · 관리자 콘솔 (정적 1장 · 외부 라이브러리 0 · SVG 자체 생성)
  정본: naoncare-edge/console/admin_console.html
  배치: telos-website/admin/index.html  →  https://www.telos.it.kr/admin
  수정: 2026-08-08 (S525 — ★의미층 개요 재구성: 추이 → 정렬 상태판 → 전후 비교 · docs/72 §4)
        2026-07-27 (S497 — ★정보구조 재설계: 개요 → 목록 → 상세 드릴다운, 대표 지적)

  ★★(S525) 개요의 순서가 곧 이 콘솔의 주장이다 — docs/72 §4:
      전체 추이 한 선(지금 효과가 나는가) → 어르신 상태판(누가 나빠지는가 · 아무 열이나
      눌러 정렬) → 전후 비교(얼마나 달라졌는가) → 기기·집계 → 내려받기.
    · 종전 "어르신 목록" 표는 ★삭제★ 했다(상태판이 대체 · 두 표가 나란히 있는 것이
      대표가 "중구난방"이라 한 상태다).
    · ★값은 화면이 계산하지 않는다★ — 전부 서버 뷰(032·033)에서 접어서 온다.
      같은 계산이 두 곳에 생기면 언젠가 두 숫자가 갈라지고 무엇이 참인지 아무도 모른다.
    · ★경보는 그리는 김에 서버에 남긴다★(console_record_alerts) — 표⑥의 왼쪽 끝.
      판정은 여전히 콘솔이 하고, 날짜는 서버가 KST 로 찍는다.

  ★이 콘솔이 답하려는 질문(한 줄): "우리 서비스가 어르신 한 분 한 분의 사회적 연결을
    늘리고 있는가?" — 그래서 화면은 ①회사 전체 ②어르신 목록 ③개인 상세 3층으로만 간다.

  ★재설계 이유(대표 지적, 전부 타당했다):
    · 회사 숫자와 개인 숫자가 한 화면에 섞여 "뭘 나타내는지 모르겠다"
    · 차트에 ★누구 것인지 표시가 없었다★(14일 접촉=전원 합계인데 아무 표시 없음)
    · 어디도 클릭해 들어갈 수 없어 개인 추적이 불가능했다
    · "연결 추세 평균 -50" = ★서로 다른 사람의 변화율을 섞은 무의미한 숫자★ → 제거하고
      분포(오름/유지/내림/측정중 인원수)로 대체. 평균 한 개는 아무에게도 답을 주지 않는다.

  ★두 가지 "주차"가 다르다(섞으면 안 되어 화면에 명시한다):
    · 어르신 주차 = 그 어르신 ★등록일 기준★ 1주차·2주차…(connection_weekly)
    · 회사 주차   = 달력 주(월요일 시작, effect_company_weekly)

  ★보안: 로그인(Supabase Auth) + console_admin 이메일 허용목록. 이 파일에 비밀 없음
    (박힌 것은 브라우저 노출 전제인 공개 anon 키뿐 — 그것만으로는 아무 데이터도 못 읽는다).

<style>
  :root{--teal:#17857A;--teal-soft:#e6f2f0;--ink:#1a2b32;--sub:#5b7078;--line:#dbe6e4;
        --bg:#f4f8f7;--card:#ffffff;--amber:#b45309;--red:#b91c1c;--good:#0e7490;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 24px;
         display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5;flex-wrap:wrap}
  header h1{font-size:17px;color:var(--teal);cursor:pointer}
  .live{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub)}
  .dot{width:8px;height:8px;border-radius:50%;background:#9ca3af}
  .dot.on{background:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.18)}
  .spacer{flex:1}
  .who{font-size:12.5px;color:var(--sub)}
  button{border:1px solid var(--line);background:var(--card);border-radius:8px;
         padding:7px 14px;font-size:13px;cursor:pointer;color:var(--ink);font-family:inherit}
  button:hover{background:#f0f6f5}
  button.primary{background:var(--teal);border-color:var(--teal);color:#fff}
  button.primary:hover{background:#136d64}
  button.danger{color:var(--red);border-color:#f0d5d5}
  button.link{border:none;background:none;color:var(--teal);padding:0;text-decoration:underline;font-size:13px}
  main{max-width:1120px;margin:0 auto;padding:20px 20px 60px}
  .crumb{font-size:13px;color:var(--sub);margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .purpose{background:var(--teal-soft);border:1px solid #cfe6e2;border-radius:10px;
           padding:12px 16px;font-size:13.5px;color:#14625b;margin-bottom:18px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .card .k{font-size:12.5px;color:var(--sub);margin-bottom:6px}
  .card .v{font-size:25px;font-weight:700}
  .card .s{font-size:12px;color:var(--sub);margin-top:4px}
  section{background:var(--card);border:1px solid var(--line);border-radius:12px;
          padding:18px;margin-bottom:18px}
  section h2{font-size:15px;margin-bottom:3px}
  section .desc{font-size:12.5px;color:var(--sub);margin-bottom:14px}
  .whose{display:inline-block;background:var(--teal-soft);color:#14625b;border-radius:6px;
         padding:2px 8px;font-size:12px;font-weight:600;margin-left:6px;vertical-align:middle}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--sub);font-weight:600;font-size:12px}
  tr.clickable{cursor:pointer}
  tr.clickable:hover td{background:#f2f8f7}
  .pos{color:var(--good);font-weight:600}.neg{color:var(--amber);font-weight:600}
  .muted{color:var(--sub)}
  .warn{color:var(--amber);font-weight:600}
  .tablewrap{overflow-x:auto}
  svg{display:block;width:100%}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:8px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
  input{padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .note{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.6}
  .sechead{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;flex-wrap:wrap}
  .sechead .csv{flex:0 0 auto}
  .tag{display:inline-block;background:#fff7e6;border:1px solid #f0e0c0;color:#8a5a10;
       border-radius:6px;padding:2px 8px;font-size:12px;margin-left:6px;vertical-align:middle}
  select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;
         font-family:inherit;background:var(--card);color:var(--ink);cursor:pointer}
  /* 경보 */
  .alerts{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
  .alert{display:flex;gap:12px;align-items:flex-start;border-radius:10px;padding:13px 16px;
         border:1px solid;cursor:pointer}
  .alert:hover{filter:brightness(0.985)}
  .alert.hi{background:#fdf2f2;border-color:#f0cccc}
  .alert.mid{background:#fff8ec;border-color:#f0e0c0}
  .alert.low{background:#f4f7f8;border-color:#dde5e8}
  .alert .badge{flex:0 0 auto;font-size:11.5px;font-weight:700;border-radius:6px;padding:3px 9px;
                margin-top:1px;white-space:nowrap}
  .alert.hi .badge{background:#b91c1c;color:#fff}
  .alert.mid .badge{background:#b45309;color:#fff}
  .alert.low .badge{background:#7a8f96;color:#fff}
  .alert .body{flex:1;min-width:0}
  .alert .t{font-size:14px;font-weight:600;margin-bottom:2px}
  .alert .d{font-size:12.5px;color:var(--sub);line-height:1.55}
  .ok-banner{background:#eef8f4;border:1px solid #cde8db;color:#166534;border-radius:10px;
             padding:13px 16px;font-size:13.5px;margin-bottom:20px}
  #login{max-width:420px;margin:10vh auto;background:var(--card);border:1px solid var(--line);
         border-radius:14px;padding:30px}
  #login h2{color:var(--teal);font-size:19px;margin-bottom:6px}
  #login p{font-size:13px;color:var(--sub);margin-bottom:18px}
  #login input{width:100%;margin-bottom:10px}
  #login button{width:100%;padding:12px;margin-bottom:8px}
  .social{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
  .social button{font-weight:600}
  .btn-google{background:#fff;border:1px solid #d5dbdb;color:#1f2937}
  .btn-kakao{background:#FEE500;border-color:#FEE500;color:#191600}
  .divider{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:12px;margin:14px 0}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
  #loginErr{color:var(--red);font-size:13px;margin-bottom:12px;display:none;line-height:1.5}
  #app{display:none}
</style>
</head>
<body>

<div id="login">
  <h2>텔로스 케어 관리자 콘솔</h2>
  <p>회사 계정으로 로그인하세요. 관리자로 등록된 분만 열람할 수 있습니다.</p>
  <div id="loginErr"></div>
  <div class="social">
    <button class="btn-google" id="googleBtn">구글 계정으로 로그인</button>
    <button class="btn-kakao" id="kakaoBtn">카카오 계정으로 로그인</button>
  </div>
  <div class="divider">또는 이메일로</div>
  <input id="emailInput" type="email" placeholder="이메일" autocomplete="username">
  <input id="pwInput" type="password" placeholder="비밀번호" autocomplete="current-password">
  <button class="primary" id="loginBtn">로그인</button>
</div>

<div id="app">
<header>
  <h1 id="homeBtn">텔로스 케어 · 관리자 콘솔</h1>
  <span class="live"><span class="dot" id="liveDot"></span><span id="liveText">연결 중…</span></span>
  <span class="spacer"></span>
  <select id="rangeSelect" title="일별 기록을 몇 일치까지 볼지">
    <option value="7">최근 7일</option>
    <option value="14">최근 14일</option>
    <option value="30">최근 30일</option>
    <option value="60">최근 60일</option>
    <option value="90">최근 90일</option>
    <option value="180">최근 180일</option>
  </select>
  <span class="who" id="whoText"></span>
  <button id="refreshBtn">지금 새로고침</button>
  <button id="logoutBtn" title="로그인 상태는 이 브라우저에 유지됩니다. 공용 PC 에서는 반드시 로그아웃하세요.">로그아웃</button>
</header>
<main id="view"></main>
</div>

<script>
(function(){
  "use strict";
  var SUPA = "https://xeerqdsedmafbqbgqooi.supabase.co";
  // 공개(anon) 키 — 브라우저 노출 전제. 이것만으로는 아무 데이터도 못 읽는다.
  var ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhlZXJxZHNlZG1hZmJxYmdxb29pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzMjYzMjksImV4cCI6MjA5MTkwMjMyOX0.Qg91BDcIkfmAt_5TGG5Cro401OXAyW1-Hu9BEObsZks";
  var DASH = SUPA + "/functions/v1/get-effect-dashboard";
  var POLL_MS = 60000;
  var timer = null;
  var DATA = null;                 // 마지막으로 받아온 전체 데이터
  var route = { view: "overview" };// {view:'overview'|'elder'|'week', id, weekStart}
  var COLORS = ["#17857A", "#b45309", "#2563eb", "#7c3aed", "#db2777", "#0e7490", "#65a30d"];

  function el(id){ return document.getElementById(id); }
  // ★★(S517) 로그인 유지 — 대표 지적("계속 로그인 상태가 유지되어야 하는데").
  //   종전엔 sessionStorage 였다. 그것은 ★탭을 닫으면 사라진다★ — 콘솔은 하루에도 몇 번
  //   여닫는 자리라 그때마다 다시 로그인해야 했다. localStorage 로 옮겨 탭을 닫아도 남긴다.
  //   ★대신 로그아웃 버튼이 확실히 지운다★(공용 PC 에서는 그것을 눌러야 한다 — 화면에도 적었다).
  //   ★옛 열쇠를 한 번 물려받는다★: 이미 로그인해 둔 사람이 이 배포 직후 튕기지 않도록,
  //   sessionStorage 에 남아 있으면 옮겨 온 뒤 지운다(한 번만 일어나는 이사다).
  var SESS_KEY = "telos_session";
  function sess(){
    try {
      var v = localStorage.getItem(SESS_KEY);
      if (!v) {
        var old = sessionStorage.getItem(SESS_KEY);
        if (old) { localStorage.setItem(SESS_KEY, old); sessionStorage.removeItem(SESS_KEY); v = old; }
      }
      return JSON.parse(v || "null");
    } catch(e){ return null; }
  }
  function setSess(s){
    try {
      if (s) localStorage.setItem(SESS_KEY, JSON.stringify(s));
      else { localStorage.removeItem(SESS_KEY); sessionStorage.removeItem(SESS_KEY); }
    } catch(e){}
  }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function num(v){ return (v === null || v === undefined || v === "") ? null : Number(v); }
  function fmt(v, unit){ var n = num(v); return n === null ? '<span class="muted">측정 중</span>'
    : esc(Math.round(n*10)/10) + (unit || ""); }
  function fmtSigned(v){ var n = num(v); if (n === null) return '<span class="muted">측정 중</span>';
    var r = Math.round(n);
    return r > 0 ? '<span class="pos">+' + r + '</span>'
         : r < 0 ? '<span class="neg">' + r + '</span>'
                 : '<span class="muted">0 (변화 없음)</span>'; }

  // ── 로그인 ───────────────────────────────────────────────────────────
  function showLogin(msg){
    el("login").style.display = "block"; el("app").style.display = "none";
    var e = el("loginErr");
    if (msg) { e.innerHTML = msg; e.style.display = "block"; } else { e.style.display = "none"; }
    if (timer) { clearInterval(timer); timer = null; }
  }
  function showApp(){
    el("login").style.display = "none"; el("app").style.display = "block";
    if (!timer) timer = setInterval(load, POLL_MS);
  }
  function authFetch(path, body){
    return fetch(SUPA + "/auth/v1/" + path, {
      method: "POST", headers: { "apikey": ANON, "Content-Type": "application/json" },
      body: JSON.stringify(body),
    }).then(function(r){ return r.json().then(function(j){ return { ok: r.ok, body: j }; }); });
  }
  function loginWithPassword(){
    var email = el("emailInput").value.trim(), pw = el("pwInput").value;
    if (!email || !pw) { showLogin("이메일과 비밀번호를 입력해 주세요."); return; }
    authFetch("token?grant_type=password", { email: email, password: pw }).then(function(r){
      if (!r.ok || !r.body.access_token) {
        showLogin("로그인하지 못했습니다. 이메일·비밀번호를 확인해 주세요.<br>" +
                  "<span style='color:#5b7078'>구글·카카오로 가입한 계정은 위의 소셜 버튼을 쓰세요(비밀번호가 없습니다).</span>");
        return;
      }
      setSess({ access_token: r.body.access_token, refresh_token: r.body.refresh_token });
      load();
    }).catch(function(){ showLogin("네트워크 오류입니다. 잠시 후 다시 시도해 주세요."); });
  }
  function socialLogin(provider){
    var back = location.origin + location.pathname;
    location.href = SUPA + "/auth/v1/authorize?provider=" + provider + "&redirect_to=" + encodeURIComponent(back);
  }
  function captureHashSession(){
    if (!location.hash || location.hash.indexOf("access_token") < 0) return false;
    var p = new URLSearchParams(location.hash.slice(1));
    var at = p.get("access_token");
    if (!at) return false;
    setSess({ access_token: at, refresh_token: p.get("refresh_token") });
    history.replaceState(null, "", location.pathname);
    return true;
  }
  function refreshSession(){
    var s = sess();
    if (!s || !s.refresh_token) return Promise.resolve(false);
    return authFetch("token?grant_type=refresh_token", { refresh_token: s.refresh_token })
      .then(function(r){
        if (!r.ok || !r.body.access_token) return false;
        setSess({ access_token: r.body.access_token, refresh_token: r.body.refresh_token });
        return true;
      }).catch(function(){ return false; });
  }
  function apiFetch(url, opts, retried){
    var s = sess();
    if (!s) return Promise.reject(new Error("no_session"));
    var o = {}; for (var k in (opts || {})) o[k] = opts[k];
    o.headers = { "apikey": ANON, "Authorization": "Bearer " + s.access_token };
    for (var h in ((opts || {}).headers || {})) o.headers[h] = opts.headers[h];
    return fetch(url, o).then(function(r){
      if (r.status === 401 && !retried) {
        return refreshSession().then(function(ok){
          if (!ok) throw new Error("session_expired");
          return apiFetch(url, opts, true);
        });
      }
      return r;
    });
  }
  function rpc(name, args){
    return apiFetch(SUPA + "/rest/v1/rpc/" + name, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(args || {}),
    }).then(function(r){
      return r.text().then(function(t){
        var j = null; try { j = t ? JSON.parse(t) : null; } catch(e) {}
        return { ok: r.ok, body: j, raw: t };
      });
    });
  }

  // ★기간은 취향(비밀 아님)이라 localStorage 에 남긴다 — 탭을 닫아도 다음에 그대로 열린다.
  function rangeDays(){
    var v = Number(localStorage.getItem("telos_range_days"));
    return [7, 14, 30, 60, 90, 180].indexOf(v) >= 0 ? v : 14;
  }
  function setRangeDays(v){ localStorage.setItem("telos_range_days", String(v)); }

  function load(){
    apiFetch(DASH, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ days: rangeDays() }),
    })
      .then(function(r){
        if (r.status === 403) {
          return r.json().then(function(j){
            setSess(null);
            showLogin("이 계정(" + esc(j.email || "") + ")은 관리자로 등록되어 있지 않습니다.<br>" +
                      "<span style='color:#5b7078'>관리자에게 등록을 요청하세요.</span>");
            throw new Error("not_admin");
          });
        }
        if (!r.ok) throw new Error("http " + r.status);
        return r.json();
      })
      .then(function(d){
        DATA = d; showApp();
        el("whoText").textContent = d.viewer || "";
        // ★서버가 실제 적용한 기간으로 선택기를 맞춘다(요청과 다르면 화면이 거짓말하지 않게).
        if (d.range_days) el("rangeSelect").value = String(d.range_days);
        el("liveDot").className = "dot on";
        el("liveText").textContent = "실측 연결됨 · " + new Date().toLocaleTimeString("ko-KR") + " (60초마다 자동)";
        // ★(S517) 지금 보고 있는 화면을 이력의 ★현재 항목★ 으로 심는다(쌓지는 않는다).
        //   60초마다 도는 자동 갱신이 이력을 쌓으면 뒤로 가기가 제자리걸음이 된다.
        go(route, true);
      })
      .catch(function(e){
        var m = String(e.message || "");
        if (m === "not_admin") return;
        if (m === "session_expired" || m === "no_session") {
          setSess(null); showLogin("로그인 시간이 만료됐습니다. 다시 로그인해 주세요."); return;
        }
        el("liveDot").className = "dot";
        el("liveText").textContent = "연결 실패 — 다음 주기에 재시도";
      });
  }

  // ── 데이터 헬퍼 ──────────────────────────────────────────────────────
  function roster(){
    var m = {};
    (DATA.roster || []).forEach(function(r){ m[r.id] = { id: r.id, alias: r.alias || "이름 없음", region: r.region || "" }; });
    return m;
  }
  function label(id){
    var r = roster()[id];
    return r ? (r.alias + (r.region ? " · " + r.region : "")) : String(id).slice(0, 8);
  }
  function weeksOf(id){
    return (DATA.weekly_obv || []).filter(function(w){ return w.elderly_id === id; })
      .sort(function(a,b){ return a.week_index - b.week_index; });
  }
  function latestWeek(id){
    var ws = weeksOf(id);
    return ws.length ? ws[ws.length - 1] : null;
  }
  function dailyOf(id){
    return (DATA.daily || []).filter(function(r){ return r.elderly_id === id; })
      .sort(function(a,b){ return a.metric_date < b.metric_date ? -1 : 1; });
  }
  function effectOf(id){
    return (DATA.elderly || []).filter(function(r){ return r.elderly_id === id; })
      .sort(function(a,b){ return a.week_start < b.week_start ? -1 : 1; });
  }
  function trendBucket(w){
    if (!w || w.connection_obv === null || w.connection_obv === undefined) return "unknown";
    var n = Number(w.connection_obv);
    return n > 0 ? "up" : (n < 0 ? "down" : "flat");
  }
  function noteOf(id){
    var n = (DATA.notes || []).filter(function(r){ return r.elderly_id === id; })[0];
    return n ? (n.note || "") : "";
  }

  // ── 기기 상태 (S508) ─────────────────────────────────────────────────
  //  ★이 블록이 답하는 질문은 나머지와 다르다: "어르신이 어떻게 지내시는가"가 아니라
  //    ★"그분의 기기가 돌고는 있는가"★ 다. 만든 것이 실제로 도는지 보는 자리다.
  //  ★왜 필요한가(S507 실측): 하루에 조용한 고장 셋이 났는데 전부 로드맵상 완료 영역이었고
  //    ★아무도 몰랐다★. 어르신이 겪는 증상은 하나다 — 불러도 대답이 없고 먼저 말도 안 건다.
  //  ★★판정 규칙이 ★여기(콘솔)★ 에 있는 이유: 단말은 사실(숫자·예아니오)만 보낸다.
  //    규칙을 앱에 두면 임계를 바꿀 때마다 ★220만 대에 앱 업데이트를 밀어야 한다★.
  //    단말에도 같은 규칙의 판정기가 있지만 그것은 기기 자신의 로그용이고, ★정본은 이쪽★ 이다.
  //  ★들어오는 값에 대화 내용·좌표는 없다 — 집 좌표는 있다/없다 한 칸뿐이다.
  var DEVICE = {
    deafMinutes: 24 * 60,   // 이만큼 아무것도 못 들었으면 듣고 있지 않다고 본다
    staleDays: 2,           // 기기 상태 보고가 이 일수 이상 없으면 신호 자체가 끊긴 것
  };
  function healthOf(id){
    return (DATA.device_health || []).filter(function(r){ return r.elderly_id === id; })
      .sort(function(a, b){ return a.metric_date < b.metric_date ? -1 : 1; });
  }
  function latestHealth(id){
    var h = healthOf(id);
    return h.length ? h[h.length - 1] : null;
  }
  function agoLabel(minutes){
    var m = num(minutes);
    if (m === null) return null;
    if (m < 60) return m + "분 전";
    if (m < 60 * 48) return Math.floor(m / 60) + "시간 전";
    return Math.floor(m / 1440) + "일 전";
  }
  // ★한 원인이 나머지를 설명하면 나머지를 문제라 부르지 않는다 —
  //   동의를 안 하셨으면 청취가 꺼진 것이 정상이고, 청취를 꺼 두셨으면 안 들리는 것이 정상이다.
  //   나란히 나열하면 기기 하나에 빨간불이 넷 켜지고 ★진짜 고장이 묻힌다★.
  function deviceProblems(h){
    if (!h) return [];
    if (h.consent_granted === false) {
      return [{ sev: "hi", t: "동의 없음",
        d: "동의 화면에서 멈춰 있어 청취가 시작되지 않습니다. 어르신께 동의 절차를 안내해 주세요." }];
    }
    // ★(S514) "청취 꺼짐"이 ★무엇을 멈추고 무엇을 안 멈추는지★ 를 적는다.
    //   [왜 고쳤나] 종전 문구는 "듣기를 끄셨습니다"까지만 말해, 화면을 보는 사람이
    //     ★아무것도 안 모이는 상태★ 로 읽었다(2026-08-04 실제로 그렇게 오해가 났다).
    //   ★사실은 다르다★ — 듣기 종료는 서비스를 끄지 않고 ★모드만★ 바꾼다
    //     (MainActivity.switchToMetadataOnly · S494 대표 결정 · docs/60 §4).
    //     계속되는 것: 소리의 물리량(observation)·접촉 상태(contact_state)·이동 →
    //     ★연결지수의 재료는 그대로 쌓인다★. 폰 실측(2026-08-04, 듣기 OFF 상태):
    //     observation 651행 · contact_state 124행이 그날에도 쌓였다.
    //     멈추는 것: 전사·호명 응답·선제 발화 = ★어르신이 불러도 대답하지 않는다★.
    //   ★그래도 등급은 '위험'으로 둔다★ — 돌봄의 본체(먼저 말 걸기·부르면 대답하기)가
    //     멈춘 것이고, 음성으로 119 를 부르는 길도 함께 닫히기 때문이다.
    //     ★단 "측정이 멈췄다"고 오해하게 두지는 않는다 — 그것은 사실이 아니다.
    if (h.listening_desired === false) {
      return [{ sev: "hi", t: "청취 꺼짐",
        d: "어르신이 듣기를 꺼 두셨습니다. 불러도 대답하지 않고 먼저 말을 걸지도 않습니다" +
           "(음성으로 119를 부르는 것도 안 됩니다). 앱에서 다시 켜 드려야 합니다. " +
           "다만 연결 측정에 쓰는 기록(소리의 물리량·접촉 상태·이동)은 계속 쌓이고 있습니다." }];
    }
    var out = [];
    // ★null 을 괜찮음으로 접지 않는다 — 관측이 한 건도 없다는 것은 들은 적이 없다는 뜻이다.
    var m = num(h.minutes_since_observation);
    if (m === null) {
      out.push({ sev: "hi", t: "들은 적이 없음",
        d: "관측 기록이 한 건도 없습니다. 마이크 권한과 청취 서비스를 확인해 주세요." });
    } else if (m > DEVICE.deafMinutes) {
      out.push({ sev: "hi", t: Math.floor(m / 60) + "시간째 아무것도 못 들음",
        d: "사람이 계신 집에서 하루 내내 아무 소리도 안 잡히는 일은 없습니다. 마이크가 죽었을 수 있어요." });
    }
    var deaths = num(h.mic_death_count);
    if (deaths !== null && deaths > 0) {
      out.push({ sev: "mid", t: "마이크가 " + deaths + "번 죽었다 살아남",
        d: "앱이 스스로 되살렸지만 그동안은 돌봄이 멈춰 있었습니다. 다른 앱이 마이크를 자주 가져가는지 확인해 주세요." });
    }
    if (h.home_location_known === false) {
      out.push({ sev: "mid", t: "집 좌표 없음",
        d: "집을 몰라 먼저 말 걸기가 통째로 멈춥니다. 어르신 앱에서 주소를 다시 저장해 주세요(댁에서 저장해야 잡힙니다)." });
    }
    return out;
  }

  // ── 경보 ─────────────────────────────────────────────────────────────
  //  ★설계 원칙 3가지(이걸 어기면 경보는 곧 무시된다)
  //   ① ★근거가 얇으면 등급을 낮춘다★ — 기록 이틀·비교 축 1개로 나온 "급감"을 빨간 경보로
  //      띄우면, 사람은 며칠 만에 경보 전체를 무시하게 된다(늑대 소년). 얇으면 회색으로 내린다.
  //   ② ★못 잰 것을 나쁜 것으로 세지 않는다★ — null 은 "0"이 아니다. 측정 실패는 '데이터 유입'
  //      문제로만 알리고, 연결이 나빠졌다고 말하지 않는다.
  //   ③ ★무엇을 하면 되는지 함께 적는다★ — 원인이 기기인지 사람인지에 따라 할 일이 다르다.
  //  ※ 임계값은 운영하며 조정할 대상이다(지금은 초기값). 여기 한곳에만 둔다.
  var ALERT = {
    silentDays: 3,        // 마지막 데이터가 이 일수 이상 전 → 주의
    silentDaysHigh: 7,    // 이 이상이면 위험
    dropObv: -30,         // 이번 주 추세가 이 값 이하 → 급감 후보
    thinDays: 3,          // 그 주 기록일이 이 값 미만이면 근거 얇음
    thinAxes: 2,          // 비교된 축이 이 값 미만이면 근거 얇음
  };
  function daysBetween(dateStr){
    if (!dateStr) return null;
    var d = new Date(dateStr + "T00:00:00");
    var t = new Date(); t.setHours(0, 0, 0, 0);
    return Math.round((t - d) / 86400000);
  }
  function buildAlerts(){
    var rs = roster(), out = [];
    Object.keys(rs).forEach(function(id){
      var name = rs[id].alias + (rs[id].region ? " · " + rs[id].region : "");
      var ds = dailyOf(id), w = latestWeek(id);

      // ① 데이터가 한 번도 안 왔다 — 기기가 아예 안 돌고 있다는 뜻.
      if (!ds.length) {
        out.push({ sev: "hi", id: id, r: "데이터 미도착", t: name + " — 데이터가 한 번도 오지 않았습니다",
          d: "등록은 됐지만 기기에서 지표가 0건입니다. 기기 전원·인터넷 연결·앱 동의 화면을 확인해 주세요." });
        return;
      }
      // ② 오다가 끊겼다.
      var gap = daysBetween(ds[ds.length - 1].metric_date);
      if (gap !== null && gap >= ALERT.silentDays) {
        out.push({
          sev: gap >= ALERT.silentDaysHigh ? "hi" : "mid", id: id, r: "데이터 끊김",
          t: name + " — " + gap + "일째 데이터가 없습니다",
          d: "마지막 기록이 " + ds[ds.length - 1].metric_date + "입니다. 기기가 꺼졌거나 인터넷이 끊겼을 수 있어요.",
        });
      }
      // ③ 연결 급감 — ★근거 두께에 따라 등급을 나눈다(원칙 ①).
      if (w && num(w.connection_obv) !== null && num(w.connection_obv) <= ALERT.dropObv) {
        var thin = (w.observed_days || 0) < ALERT.thinDays || (w.valid_axis_count || 0) < ALERT.thinAxes;
        out.push({
          sev: thin ? "low" : "mid", id: id, r: "연결 급감",
          t: name + " — 지난주보다 연결이 크게 줄었습니다 (" + Math.round(num(w.connection_obv)) + ")",
          d: thin
            ? "다만 근거가 얇습니다(기록 " + (w.observed_days || 0) + "일 · 비교된 축 " +
              (w.valid_axis_count || 0) + "/3). 숫자보다 며칠 더 지켜보는 편이 낫습니다."
            : "기록 " + (w.observed_days || 0) + "일 · 비교된 축 " + (w.valid_axis_count || 0) +
              "/3 로 비교했습니다. 어떤 축이 줄었는지 상세에서 확인해 보세요.",
        });
      }

      // ④ ★(S508) 기기가 스스로 알려 온 고장 — 안전망.
      //    ★기기가 보고를 하고 있을 때만 본다★: 보고 자체가 끊긴 경우는 ②가 이미 알린다.
      //    같은 사실을 두 곳에서 두 번 알리면 경보는 곧 무시된다(설계 원칙 ①).
      var h = latestHealth(id);
      var hGap = h ? daysBetween(h.metric_date) : null;
      if (h && hGap !== null && hGap <= DEVICE.staleDays) {
        deviceProblems(h).forEach(function(p){
          out.push({ sev: p.sev, id: id, r: "기기: " + p.t, t: name + " — 기기: " + p.t, d: p.d });
        });
      } else if (!h) {
        // ★고장이라고 말하지 않는다 — 아직 이 신호를 안 보내는 앱 버전일 수 있다.
        //   다만 ★모른다는 사실★ 은 알린다(모르는 것을 괜찮음으로 접지 않는다).
        out.push({ sev: "low", id: id,
          t: name + " — 기기 상태를 알 수 없습니다",
          d: "이 기기가 기기 상태 신호를 보내지 않고 있습니다. 앱 버전이 낮으면 그럴 수 있어요(고장이라는 뜻은 아닙니다)." });
      }
    });
    // 위험 → 주의 → 정보 순.
    var rank = { hi: 0, mid: 1, low: 2 };
    return out.sort(function(a, b){ return rank[a.sev] - rank[b.sev]; });
  }
  function alertsHtml(){
    // ★(S523 대표 지적 "위험, 주의, 이건 뭐지?") — ★위험·주의만 띄운다★.
    //   "참고" 등급(기기 상태 신호 없음 · 근거 얇은 하락)은 매일 떠서 경보를 무디게 했다.
    //   S508 원칙("매일 울리는 경보는 아무도 안 본다")을 표시 단계에도 적용한 것.
    var list = buildAlerts().filter(function(a){ return a.sev !== "low"; });
    if (!list.length) {
      return '<div class="ok-banner">지금 살펴볼 것이 없습니다 — 데이터가 끊긴 기기도, 크게 줄어든 분도 없습니다.</div>';
    }
    var badge = { hi: "위험", mid: "주의", low: "참고" };
    return '<div class="alerts">' + list.map(function(a){
      return '<div class="alert ' + a.sev + '" data-go=\'' + esc(JSON.stringify({ view: "elder", id: a.id })) + "'>" +
        '<span class="badge">' + badge[a.sev] + '</span><div class="body">' +
        '<div class="t">' + esc(a.t) + '</div><div class="d">' + esc(a.d) + "</div></div></div>";
    }).join("") + "</div>";
  }

  /**
   * ★(S525) 경보를 ★서버에 기록★ 한다 — docs/72 표⑥("며칠 만에 잡았다").
   *
   * ★종전엔 경보가 화면에 그려지고 사라졌다★ → "악화를 언제 발견했는지"를 증명할 길이
   * 영영 없었다. 12주 뒤 타임라인을 그리려면 그 순간을 남겨야 한다(소급 불가).
   *
   * ★판정은 여전히 콘솔이 한다★(S508 원칙) — 서버로 보내는 것은 ★결과 기록★ 뿐이고,
   * ★날짜는 서버가 KST 로 찍는다★(화면이 보내면 발견 시각을 나중에 지어낼 수 있다).
   * ★같은 사유는 하루 1행★ — (어르신·날짜·사유) 유니크라 화면을 몇 번 열어도 안 쌓인다.
   * 그래서 reason(a.r)은 ★날짜·숫자가 섞이지 않은 고정 문구★ 여야 한다(숫자는 detail 로).
   *
   * ★실패해도 화면은 그대로 간다★ — 기록은 부수적인 일이고, 그것 때문에 개요가 안 뜨면
   * 정작 봐야 할 경보를 못 본다(안전망이 본체를 망가뜨리지 않는다).
   * ★참고 등급은 보내지 않는다★ — 화면에 안 띄우는 것을 이력에만 쌓으면 두 곳이 갈라진다.
   */
  function recordAlerts(list){
    var payload = list.filter(function(a){ return a.sev !== "low" && a.id && a.r; })
      .map(function(a){
        return { elderly_id: a.id, level: a.sev === "hi" ? "위험" : "주의",
                 reason: a.r, detail: a.d || "" };
      });
    if (!payload.length) return;
    rpc("console_record_alerts", { p_alerts: payload });   // 결과를 기다리지 않는다
  }

  // ── 의미층 접근자 (S525 · 서버 뷰 032·033) ──────────────────────────
  //   ★화면이 스스로 평균을 내지 않는다★ — 같은 계산이 서버와 화면 두 곳에 생기면
  //   언젠가 두 숫자가 갈라지고, 그때 무엇이 참인지 아무도 모른다(S506 교훈).
  function statusOf(id){
    var rows = DATA.console_status || [];
    for (var i = 0; i < rows.length; i++) if (rows[i].elderly_id === id) return rows[i];
    return null;
  }
  function prepostOf(id){
    var rows = DATA.console_prepost || [];
    for (var i = 0; i < rows.length; i++) if (rows[i].elderly_id === id) return rows[i];
    return null;
  }
  function eventsOf(id){
    return (DATA.console_events || []).filter(function(e){ return e.elderly_id === id; });
  }
  function alertLogOf(id){
    return (DATA.console_alerts || []).filter(function(a){ return a.elderly_id === id; });
  }
  // ★(S526) cohortAll() 을 지웠다 — 호출처가 0 인 죽은 함수였고, 그것이 읽던
  //   DATA.console_cohort 는 ★사용 중지된 절대 척도의 집단 평균★ 이다(sql 012).
  //   서버(get-effect-dashboard)에서 조회 자체를 뺐으므로 이 키는 이제 오지 않는다.
  //   되살릴 때는 ★OBV 로 다시 만든 뒤★ — 그 절차는 Edge 쪽 주석에 적어 두었다.
  /**
   * ★★(S525 정정) 일간 OBV — ★이것이 정본 척도다★(sql 034 · 대표 지시).
   *
   * ★절대 연결지수(console_status.index_avg_7d)를 사람끼리 비교하는 데 쓰지 말 것★ —
   * 그 값은 목표치 60분·60분·3000m 로 잰 것이고 ★그 목표치는 2026-07-26 에 사용
   * 중지됐다★(sql 012: "최대 목표치는 필요없어"). 어르신마다 삶이 다른데 하나의 목표를
   * 세우는 것은 "평균적 노인을 상정하지 않는다"는 제0원칙에 정면으로 어긋난다.
   * ★해도 되는 비교는 "그분이 자기 어제보다 나아졌는가" 하나뿐이다.★
   */
  function obvRowsOf(id){
    return (DATA.console_obv || []).filter(function(r){ return r.elderly_id === id; });
  }
  function obvLatest(id){
    var rows = obvRowsOf(id);
    return rows.length ? rows[rows.length - 1] : null;
  }

  // ── 상태판 정렬 (S525 · 대표 지시 "정렬 가능한 정보들로") ────────────
  //   ★정렬은 화면에서 한다★ — 자료는 이미 다 받아 왔다. 서버를 다시 부르면 느리고,
  //   폴링과 겹쳐 정렬이 제멋대로 되돌아간다.
  //   ★빈 값은 방향과 무관하게 언제나 맨 아래★ — null 을 "가장 나쁨"으로 올리면
  //   ★아직 못 잰 사람★ 이 ★나빠진 사람★ 을 화면 위에서 밀어낸다.
  var SORT = { key: "base7", dir: 1 };   // 기본 = 자기 평소보다 나빠진 순
  var STATUS_COLS = [
    { k: "alias",   t: "어르신",      txt: true,  v: function(r){ return r.alias; } },
    // ★★척도 셋은 전부 ★그분 자신★ 을 기준으로 한다(sql 034 · 대표 정본).
    //   절대 지수는 이 표에서 걷어냈다 — 사람끼리 견주게 만드는 열이었다.
    { k: "prev",    t: "어제 대비",   hint: "%",     v: function(r){ return num(r.vsPrev); } },
    { k: "base7",   t: "평소 대비",   hint: "직전 7일", v: function(r){ return num(r.vsBase7); } },
    { k: "obv",     t: "추세(OBV)",   hint: "시작 이후 누적", v: function(r){ return num(r.obv); } },
    { k: "alone",   t: "혼자 비율",   v: function(r){ return num(r.alone_pct_7d); } },
    { k: "utter",   t: "발화",        v: function(r){ return num(r.utter_7d); } },
    { k: "sess",    t: "대화 세션",   v: function(r){ return num(r.sessions_7d); } },
    { k: "away",    t: "집밖",        v: function(r){ return num(r.away_avg_7d); } },
    { k: "mood",    t: "안부(기분)",  v: function(r){ return num(r.mood_last); } },
    { k: "arrived", t: "도착",        hint: "7일 중", v: function(r){ return num(r.days_arrived_7d); } },
    { k: "note",    t: "메모",        txt: true,  v: function(r){ return r.note || ""; } }
  ];
  function statusRows(){
    var rs = roster();
    return Object.keys(rs).map(function(id){
      var s = statusOf(id) || {};
      var out = { id: id, alias: rs[id].alias, region: rs[id].region, note: noteOf(id) };
      Object.keys(s).forEach(function(k){ out[k] = s[k]; });
      // ★(S525 정정) 정본 척도는 일간 OBV 다 — 마지막 관측일의 값을 붙인다.
      var o = obvLatest(id);
      out.vsPrev  = o ? o.connection_vs_prev_pct  : null;
      out.vsBase7 = o ? o.connection_vs_base7_pct : null;
      out.obv     = o ? o.connection_obv          : null;
      out.obvDate = o ? o.metric_date             : null;
      return out;
    });
  }
  function sortStatus(rows){
    var col = null;
    STATUS_COLS.forEach(function(c){ if (c.k === SORT.key) col = c; });
    if (!col) col = STATUS_COLS[0];
    return rows.slice().sort(function(a, b){
      var va = col.v(a), vb = col.v(b);
      if (col.txt) return String(va || "").localeCompare(String(vb || "")) * SORT.dir;
      var na = (va === null || va === undefined), nb = (vb === null || vb === undefined);
      if (na && nb) return 0;
      if (na) return 1;      // ★빈 값은 늘 아래
      if (nb) return -1;
      return (va - vb) * SORT.dir;
    });
  }
  /** 방향 화살표 — ★0 을 "변화 없음"으로 색칠하지 않는다(0 도 측정된 사실이다). */
  function deltaCell(v){
    var n = num(v);
    if (n === null) return '<span class="muted">—</span>';
    var r = Math.round(n * 10) / 10;
    if (r > 0) return '<span class="pos">▲ +' + r + "</span>";
    if (r < 0) return '<span class="neg">▼ ' + r + "</span>";
    return "0";
  }
  function statusTableHtml(){
    var rows = sortStatus(statusRows());
    var html = '<section><div class="sechead"><div><h2>어르신 상태판' +
      '<span class="whose">열 이름을 누르면 그 기준으로 정렬됩니다</span></h2>' +
      '<div class="desc"><b>모든 비교는 그분 자신을 기준으로 합니다</b> — 어제의 그분, 요즘의 그분. ' +
      '어르신끼리 견주지 않습니다(삶이 저마다 달라 하나의 목표를 세울 수 없습니다).<br>' +
      '어제 대비 = 그날의 답 · 평소 대비 = 직전 7일 자기 평균과 견준 것(하루 출렁임이 걷힙니다) · ' +
      '추세(OBV) = 시작 이후 누적. 참여·안부는 최근 7일(<b>오늘 제외</b>)이고, ' +
      '“도착”이 7일 중 며칠인지를 함께 보세요 — <b>이틀치로 나온 평균은 평균이 아닙니다</b>.</div></div>' +
      csvBtn("elders") + "</div><div class=\"tablewrap\"><table><tr>";
    STATUS_COLS.forEach(function(c){
      var on = SORT.key === c.k;
      html += '<th class="sortable" data-sort="' + c.k + '" style="cursor:pointer' +
        (on ? ";color:var(--teal)" : "") + '">' + esc(c.t) +
        (c.hint ? ' <span class="muted" style="font-weight:400">' + esc(c.hint) + "</span>" : "") +
        (on ? (SORT.dir === 1 ? " ▲" : " ▼") : "") + "</th>";
    });
    html += "</tr>";
    if (!rows.length) html += '<tr><td colspan="' + STATUS_COLS.length + '" class="muted">등록된 어르신이 없습니다</td></tr>';
    rows.forEach(function(r){
      html += '<tr class="clickable" data-go=\'' + esc(JSON.stringify({ view: "elder", id: r.id })) + "'>" +
        "<td><b>" + esc(r.alias) + "</b>" + (r.region ? ' <span class="muted">· ' + esc(r.region) + "</span>" : "") + "</td>" +
        "<td>" + deltaCell(r.vsPrev) + "</td>" +
        "<td>" + deltaCell(r.vsBase7) + "</td>" +
        "<td>" + deltaCell(r.obv) + "</td>" +
        "<td>" + fmt(r.alone_pct_7d, "%") + "</td>" +
        "<td>" + fmt(r.utter_7d, "회") + "</td>" +
        "<td>" + fmt(r.sessions_7d, "회") + "</td>" +
        "<td>" + fmt(r.away_avg_7d, "분") + "</td>" +
        // ★안부는 값과 ★그 날짜★ 를 함께 — 날짜가 없으면 3주 전 기분이 오늘처럼 읽힌다.
        "<td>" + (num(r.mood_last) === null ? '<span class="muted">기록 없음</span>'
                  : Math.round(num(r.mood_last) * 10) / 10 +
                    ' <span class="muted">' + esc(String(r.checkin_date || "").slice(5)) + "</span>") + "</td>" +
        "<td>" + (num(r.days_arrived_7d) === null ? '<span class="muted">—</span>'
                  : (num(r.days_arrived_7d) < 7 ? '<span class="warn">' + r.days_arrived_7d + "/7</span>"
                                                : r.days_arrived_7d + "/7")) + "</td>" +
        '<td style="text-align:left;white-space:normal;min-width:180px;max-width:220px">' +
          (r.note ? esc(r.note) : '<span class="muted">—</span>') + "</td></tr>";
    });
    return html + "</table></div></section>";
  }
  function bindSort(){
    Array.prototype.forEach.call(el("view").querySelectorAll("[data-sort]"), function(th){
      th.addEventListener("click", function(){
        var k = th.getAttribute("data-sort");
        if (SORT.key === k) SORT.dir = -SORT.dir; else { SORT.key = k; SORT.dir = 1; }
        renderRoute();     // ★다시 그리기만 한다 — 서버를 부르지 않는다
      });
    });
  }

  // ── 전후 비교(표① 슬로프) ────────────────────────────────────────────
  //   ★값이 없는 것은 고장이 아니라 "아직 기저가 아니다" 다★ — 반드시 진행도를 적는다.
  function prepostHtml(){
    var rows = statusRows().map(function(r){
      var p = prepostOf(r.id) || {};
      return { id: r.id, alias: r.alias, region: r.region, p: p };
    });
    var html = '<section><div class="sechead"><div><h2>사용 전후 비교' +
      '<span class="whose">기저 = 관측 시작 첫 14일</span></h2>' +
      '<div class="desc">이 서비스를 쓰기 시작한 첫 2주와 최근 2주를 견줍니다(두 구간은 겹치지 않습니다). ' +
      '기저가 아직 안 찬 분은 <b>몇 일째인지</b>가 대신 나옵니다 — 그 칸이 비었다고 나빠진 것이 아닙니다.<br>' +
      '<b>★모든 비교는 그분 안에서만 합니다</b> — 지수 칸의 숫자를 <b>어르신끼리 견주지 마세요</b>. ' +
      '그 값은 잠정 목표치로 잰 것이라(사용 중지된 척도) 사람 간 비교에 쓸 수 없습니다. ' +
      '견줄 수 있는 것은 맨 오른쪽 <b>OBV 변화</b>입니다.</div></div></div>' +
      '<div class="tablewrap"><table><tr><th>어르신</th><th>기저 구간</th><th>기저 지수</th>' +
      "<th>최근 구간</th><th>최근 지수</th><th>변화</th><th>혼자 비율 변화</th><th>OBV 변화</th></tr>";
    if (!rows.length) html += '<tr><td colspan="8" class="muted">등록된 어르신이 없습니다</td></tr>';
    rows.forEach(function(r){
      var p = r.p;
      // ★OBV 변화 = (마지막 누적) − (기저 구간 끝의 누적).
      //   누적선의 두 지점 차이라 ★그분 안의 변화★ 이고, 척도가 정본이라 사람끼리도 견줄 수 있다.
      var ob = obvRowsOf(r.id).filter(function(o){ return num(o.connection_obv) !== null; });
      var obvDelta = null;
      // ★기저 창이 아직 안 닫혔으면 계산하지 않는다★ — 그때는 "기저 끝"이 미래라
      //   마지막 행이 그대로 잡혀 ★변화 0★ 이라는 거짓이 나온다(미리보기에서 실제로 나왔다).
      if (ob.length && p.baseline_end && p.baseline_window_closed) {
        var atBase = null;
        ob.forEach(function(o){ if (o.metric_date <= p.baseline_end) atBase = o; });
        if (atBase) obvDelta = Math.round((num(ob[ob.length - 1].connection_obv) - num(atBase.connection_obv)) * 10) / 10;
      }
      var baseCell = p.baseline_ready
        ? fmt(p.baseline_index_avg) + ' <span class="muted">' + p.baseline_days + "일</span>"
        : '<span class="muted">모으는 중 ' + (p.baseline_days == null ? 0 : p.baseline_days) + "/14일</span>";
      var recCell = p.recent_ready
        ? fmt(p.recent_index_avg) + ' <span class="muted">' + p.recent_days + "일</span>"
        : '<span class="muted">' + (p.recent_days == null ? 0 : p.recent_days) + "/14일</span>";
      html += '<tr class="clickable" data-go=\'' + esc(JSON.stringify({ view: "elder", id: r.id })) + "'>" +
        "<td><b>" + esc(r.alias) + "</b></td>" +
        '<td class="muted">' + (p.baseline_start ? esc(p.baseline_start) + " ~ " + esc(p.baseline_end) : "—") + "</td>" +
        "<td>" + baseCell + "</td>" +
        '<td class="muted">' + (p.recent_start ? esc(p.recent_start) + " ~ " + esc(p.recent_end) : "—") + "</td>" +
        "<td>" + recCell + "</td>" +
        "<td>" + deltaCell(p.index_delta) + "</td>" +
        "<td>" + deltaCell(p.alone_pct_delta) + "</td>" +
        "<td>" + deltaCell(obvDelta) + "</td></tr>";
    });
    return html + "</table></div></section>";
  }

  // ── 일간 OBV 추세(표②) — ★선 1개 = 어르신 1명★ ──────────────────────
  //   ★★평균 한 개를 그리지 않는다★★ — 서로 다른 사람의 값을 평균내면 아무에게도
  //   답을 주지 않는다(S497 에 이미 같은 이유로 "연결 추세 평균 -50"을 걷어냈다).
  //   그리고 절대 지수의 평균은 ★사용 중지된 목표치★ 로 잰 값이라 더더욱 안 된다.
  //   ★모든 선은 0 에서 시작한다★ — 각자 자기 시작점이 기준이라 선끼리 높이를
  //   비교하는 것이 아니라 ★올라가는가 내려가는가★ 를 본다.
  function obvDailySvg(){
    var rs = roster();
    var series = Object.keys(rs).map(function(id){
      return { id: id, rows: obvRowsOf(id).filter(function(r){ return num(r.connection_obv) !== null; }) };
    });
    var drawn = series.filter(function(s){ return s.rows.length > 0; });
    var none = series.filter(function(s){ return s.rows.length === 0; });
    var noteHtml = none.length
      ? '<div class="muted" style="font-size:12.5px;margin-top:6px">' +
        none.map(function(s){ return esc(label(s.id)); }).join(" · ") +
        " — 아직 비교할 직전 날이 없습니다(둘째 날부터 선이 생깁니다)</div>"
      : "";
    if (!drawn.length) {
      return '<div class="muted" style="font-size:13px">아직 그릴 선이 없습니다 — 이틀째부터 첫 비교가 생깁니다.</div>' + noteHtml;
    }
    // 가로축 = 날짜(전원 공통). 세로축 = 0 을 가운데 둔 대칭.
    var dates = {};
    drawn.forEach(function(s){ s.rows.forEach(function(r){ dates[r.metric_date] = 1; }); });
    var xs = Object.keys(dates).sort();
    var maxAbs = 20;
    drawn.forEach(function(s){ s.rows.forEach(function(r){
      var v = Math.abs(num(r.connection_obv)); if (v > maxAbs) maxAbs = v;
    }); });
    var W = 1000, H = 250, L = 50, R = 20, T = 16, B = 34;
    var x = function(dt){ var i = xs.indexOf(dt);
      return xs.length === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (xs.length - 1); };
    var y = function(v){ return T + (1 - (v + maxAbs) / (2 * maxAbs)) * (H - T - B); };
    var out = '<svg viewBox="0 0 ' + W + " " + H + '">';
    out += '<line x1="' + L + '" y1="' + y(0) + '" x2="' + (W - R) + '" y2="' + y(0) +
      '" stroke="#94a3a0" stroke-dasharray="4 4"/>';
    out += '<text x="6" y="' + (y(0) + 4) + '" font-size="11" fill="#5b7078">0 (시작)</text>';
    out += '<text x="6" y="' + (y(maxAbs) + 10) + '" font-size="11" fill="#5b7078">+' + Math.round(maxAbs) + "</text>";
    out += '<text x="6" y="' + (y(-maxAbs) - 2) + '" font-size="11" fill="#5b7078">-' + Math.round(maxAbs) + "</text>";
    drawn.forEach(function(s, i){
      var c = COLORS[i % COLORS.length];
      var d = s.rows.map(function(r, j){ return (j ? "L" : "M") + x(r.metric_date) + " " + y(num(r.connection_obv)); }).join(" ");
      if (s.rows.length > 1) out += '<path d="' + d + '" fill="none" stroke="' + c + '" stroke-width="2.5"/>';
      s.rows.forEach(function(r){
        out += '<circle cx="' + x(r.metric_date) + '" cy="' + y(num(r.connection_obv)) + '" r="3.5" fill="' + c + '"><title>' +
          esc(label(s.id) + " · " + r.metric_date + " · 누적 " + r.connection_obv +
              " · 어제 대비 " + (r.connection_vs_prev_pct === null ? "—" : r.connection_vs_prev_pct)) + "</title></circle>";
      });
    });
    var step = Math.max(1, Math.ceil(xs.length / 8));
    xs.forEach(function(dt, i){
      if (i % step) return;
      out += '<text x="' + x(dt) + '" y="' + (H - 10) + '" font-size="11" fill="#5b7078" text-anchor="middle">' +
        esc(dt.slice(5)) + "</text>";
    });
    out += "</svg>";
    out += '<div class="legend">' + drawn.map(function(s, i){
      return '<span><i style="background:' + COLORS[i % COLORS.length] + '"></i>' + esc(label(s.id)) + "</span>";
    }).join("") + '<span class="muted">0 위 = 시작보다 나아진 쪽</span></div>';
    return out + noteHtml;
  }

  // ── CSV 내려받기 ─────────────────────────────────────────────────────
  //   ★null 은 ★빈 칸★ 으로 쓴다(0 으로 쓰면 받는 사람이 "측정했는데 0"으로 읽는다 —
  //     화면의 "측정 중"과 같은 원칙을 파일에서도 지킨다).
  //   ★맨 앞에 BOM 을 붙인다 — 없으면 엑셀이 한글을 깨뜨린다(실사용에서 가장 흔한 사고).
  //   ★값에 쉼표·따옴표·줄바꿈이 있어도 깨지지 않게 RFC4180 방식으로 감싼다.
  function csvCell(v){
    if (v === null || v === undefined) return "";
    var s = String(v);
    // ★수식 주입 방어: 별명·메모는 자유 입력이라 "=HYPERLINK(...)" 같은 값이 오면 엑셀이
    //   ★수식으로 실행★한다. 숫자가 아닌데 =,+,-,@,탭으로 시작하면 아포스트로피로 강등.
    //   ★순수 숫자는 제외 — OBV(-100)·z 는 음수가 정상값이라 문자로 만들면 분석이 깨진다.
    if (/^[=+\-@\t\r]/.test(s) && !/^-?\d+(\.\d+)?$/.test(s)) s = "'" + s;
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function downloadCsv(filename, headers, rows){
    var lines = [headers.map(csvCell).join(",")];
    rows.forEach(function(r){ lines.push(r.map(csvCell).join(",")); });
    var blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  //   이제 화면을 옮길 때마다 이력을 하나 쌓고, 뒤로 가기는 그 이력을 되짚는다.
  //   ★replace=true 는 이력을 쌓지 않는다★ — 첫 그림과 데이터 재적재처럼 "옮긴 것이
  //   아닌" 경우에 쓴다. 안 그러면 새로고침마다 이력이 늘어 뒤로 가기가 제자리걸음한다.
  function go(r, replace){
    route = r;
    try {
      if (replace) history.replaceState(r, "", location.pathname);
      else history.pushState(r, "", location.pathname);
    } catch(e){}
    renderRoute();
    window.scrollTo(0, 0);
  }
  window.addEventListener("popstate", function(e){
    route = (e.state && e.state.view) ? e.state : { view: "overview" };
    renderRoute();
    window.scrollTo(0, 0);
  });

  //   않아, 세션은 멀쩡한데 그때 보이던 로그인 화면이 그대로 복원된다.
  //   ★그것이 "튕겨서 다시 로그인하라고 나온다"의 정체다★ — 세션을 다시 보고 판단한다.
  window.addEventListener("pageshow", function(e){

    //   정말로 다 멀쩡한 것이 같아 보인다(근거의 두께를 함께 적는다는 이 콘솔의 원칙).

    // ★★(S525) 여기부터가 docs/72 §4 가 그린 개요다 —

  /**

   *
   * ★서버가 판정하고 화면은 옮기기만 한다★ — 이미 등록된 기기인지, 가명이 겹치는지는
   * console_register_pending_device 가 결정한다. 화면이 스스로 판정하려 들면 두 곳의
   * 규칙이 갈라지고, 그때부터 무엇이 참인지 아무도 모른다.
   * ★성공해도 목록을 손으로 지우지 않고 다시 불러온다★ — 화면이 서버보다 앞서가면
   * 등록에 실패했는데 사라진 것처럼 보일 수 있다.
   */
  function bindPendingRegister(){
    Array.prototype.forEach.call(el("view").querySelectorAll(".pendReg"), function(b){
      b.addEventListener("click", function(){
        var dev = b.getAttribute("data-dev");
        function pick(cls){
          var n = el("view").querySelector(cls + '[data-dev="' + dev.replace(/"/g, '\\"') + '"]');
          return n ? n.value.trim() : "";
        }
        var msg = el("view").querySelector('.pendMsg[data-dev="' + dev.replace(/"/g, '\\"') + '"]');
        function say(t, ok){ if (msg) { msg.textContent = t; msg.style.color = ok ? "#0e7490" : "#b91c1c"; } }

        var alias = pick(".pendAlias");
        if (!alias) { say("가명을 적어 주세요(배정표와 똑같이).", false); return; }

        b.disabled = true; say("등록하는 중…", true);
        rpc("console_register_pending_device", {
          p_device_id: dev, p_alias: alias, p_region: pick(".pendRegion"),
        }).then(function(r){
          b.disabled = false;
          if (!r.ok) { say(friendlyRpcError(r), false); return; }
          var row = Array.isArray(r.body) ? r.body[0] : r.body;
          var st = row && row.register_status;
          if (st === "CREATED") { say("등록했습니다.", true); load(); return; }
          if (st === "ALIAS_TAKEN") {
            // ★막은 것이지 고장이 아니다★ — 같은 분이 두 명으로 늘어나는 것을 막았다.
            say('"' + (row.linked_alias || alias) + '" 이라는 이름의 어르신이 이미 있습니다. 다른 이름을 적어 주세요.', false);
            return;
          }
          if (st === "ALREADY_REGISTERED") { say("이미 등록된 기기입니다.", false); load(); return; }
          say("결과를 확인하지 못했습니다. 목록을 새로고침해 확인해 주세요.", false);
        });
      });
    });
  }

    return all.length ? all[all.length - 1] : null;

          (pp.baseline_ready ? fmt(pp.baseline_alone_pct, "%") : '<span class="muted">—</span>') + "</td></tr>" +
        "<tr><td><b>최근</b></td><td>" +

    if (!evs.length) html += '<tr><td colspan="4" class="muted">아직 적어 둔 사건이 없습니다</td></tr>';
    evs.forEach(function(e){
      // ★min-width 를 준다 — 없으면 창이 좁을 때 한 글자씩 세로로 무너진다(미리보기 실측).

    // ★★(S525) 경보 이력 — 표⑥ "며칠 만에 잡았다".

    //   다시 누른다고 갱신되면 그 값이 매번 0 으로 리셋된다(서버가 막는다).

    if (als.length) {

    // 이 사람만의 일별
    html += '<section><div class="sechead"><div><h2>' + rangeLabel() + ' · 일별 기록' + '<span class="whose">' + esc(me.alias) + "</span></h2>" +

      csvBtn("elderDaily", id) + "</div>" +
      dailySvg(ds) +
      // ★★(S525) "어르신 발화"를 ★초★ 로 보여 준다 — 분은 이 축을 통째로 삼키고 있었다.
      //   실측: 8/7 발화 46건인데 분 칸은 0(유성 합 52초 → 내림해서 0). 값은 정직했고

      var utter = num(r.elder_utterance_seconds) !== null

  /**
   * ★(S525) 사건 기록 등록·삭제.
   * ★서버가 판정한다★ — 앞날·빈 값·200자 초과는 RPC 가 거부하고 화면은 그 말을 옮긴다
   * (같은 규칙을 화면에도 쓰면 두 곳이 갈라진다 · bindPendingRegister 와 같은 결).
   * ★성공하면 목록을 손으로 고치지 않고 다시 받아 온다★ — 화면이 서버보다 앞서가면
   * 실패했는데 저장된 것처럼 보일 수 있다.
   */
  function bindEvents(id){
    var add = el("evAdd"), note = el("evNote"), date = el("evDate"), msg = el("evMsg");
    function say(t, ok){ if (msg) { msg.textContent = t; msg.style.color = ok ? "#0e7490" : "#b91c1c"; } }
    if (add && note && date) {
      var submit = function(){
        var text = note.value.trim();
        if (!text) { say("무슨 일이 있었는지 한 줄 적어 주세요.", false); return; }
        add.disabled = true; say("기록하는 중…", true);
        rpc("console_add_elderly_event", {
          p_elderly_id: id, p_event_date: date.value, p_note: text,
        }).then(function(r){
          add.disabled = false;
          if (!r.ok) { say(rpcReason(r), false); return; }
          note.value = ""; say("기록했습니다.", true); load();
        });
      };
      add.addEventListener("click", submit);
      note.addEventListener("keydown", function(e){ if (e.key === "Enter") submit(); });
    }
    Array.prototype.forEach.call(el("view").querySelectorAll(".evDel"), function(b){
      b.addEventListener("click", function(){
        b.disabled = true;
        rpc("console_delete_elderly_event", { p_id: Number(b.getAttribute("data-ev")) }).then(function(r){
          b.disabled = false;
          if (!r.ok) { say(rpcReason(r), false); return; }
          load();
        });
      });
    });
  }

  /** ★(S525) 경보 확인. 메모는 선택 — 없어도 "언제 확인했는지"는 남는다. */
  function bindAck(){
    Array.prototype.forEach.call(el("view").querySelectorAll(".ackBtn"), function(b){
      b.addEventListener("click", function(){
        var msg = el("ackMsg");
        b.disabled = true;
        rpc("console_ack_alert", { p_id: Number(b.getAttribute("data-alert")), p_note: "" }).then(function(r){
          b.disabled = false;
          if (!r.ok) {
            if (msg) { msg.style.color = "#b91c1c"; msg.textContent = rpcReason(r); }
            return;
          }
          load();
        });
      });
    });
  }

  // 이름표 저장/지우기 — 저장 후 데이터를 다시 받아 목록·CSV 에도 즉시 반영한다.
  function bindNote(id){
    var save = el("saveNoteBtn"), clear = el("clearNoteBtn"), input = el("noteInput");
    if (!save || !input) return;
    function put(text){
      rpc("console_set_elderly_note", { p_elderly_id: id, p_note: text }).then(function(r){
        var msg = el("noteMsg"); if (!msg) return;
        if (r.ok) {
          msg.style.color = "#0e7490";
          msg.textContent = text ? "저장했습니다." : "지웠습니다.";
          load();   // 서버에서 다시 받아 목록·CSV 에도 반영
        } else {
          var raw = (r.body && (r.body.message || r.body.hint)) || r.raw || "";
          msg.style.color = "#b91c1c";
          msg.textContent = raw.indexOf("NOTE_TOO_LONG") >= 0 ? "메모가 너무 깁니다(200자까지)."
                          : raw.indexOf("NOT_CONSOLE_ADMIN") >= 0 ? "권한이 없습니다."
                          : "저장하지 못했습니다. 잠시 후 다시 시도해 주세요.";
        }
        setTimeout(function(){ if (msg) msg.textContent = ""; }, 5000);
      });
    }
    save.addEventListener("click", function(){ put(input.value.trim()); });
    input.addEventListener("keydown", function(e){ if (e.key === "Enter") put(input.value.trim()); });
    if (clear) clear.addEventListener("click", function(){ input.value = ""; put(""); });
  }

  // ── 화면 4: 연구 (S513) ──────────────────────────────────────────────
  //   ★왜 별도 화면인가★: 연구 배정은 ★운영자만★ 하는 일이고 자주 하지 않는다.
  //     개요에 얹으면 매일 보는 화면이 길어지고, 정작 급한 "기기 이상"이 아래로 밀린다.
  //   ★PC 전용이다★(대표 지시) — 반응형에 시간 쓰지 말 것.
  function assignmentsOf(){ return DATA.study_assignment || []; }
  function snapshotsOf(){ return DATA.study_snapshot || []; }
  function snapCount(pseudonym){
    return snapshotsOf().filter(function(r){ return r.pseudonym === pseudonym; }).length;
  }
  // ★서버가 준 pending_devices = 두드렸는데 elderly 에 없는 기기★ = ★미등록 집합★.
  //   배정은 됐는데 여기 들어 있으면 그 기기는 자료를 ★모으고는 있지만 못 보내고 있다★
  //   (ingest-study-snapshot 이 미등록 기기에 404 를 준다). 그 조용한 실패를 표에 띄운다.
  function unregisteredSet(){
    var m = {};
    (DATA.pending_devices || []).forEach(function(c){ m[c.device_id] = true; });
    return m;
  }

  // ── 설문(S514) ────────────────────────────────────────────────────────
  //   ★척도 목록을 화면에 박아 두지 않는다★ — IRB 연구계획서가 "정확한 버전·문항은
  //     심리 자문 감수 후 확정한다"고 적어 두었고, CRF 표의 네 행 중 둘이 아직
  //     "[확정]"·"[선택]" 이다. 서버 조회표에 한 줄 넣으면 이 화면이 따라온다.
  // ★측정 시점 — 처음·중간·끝(대표 결정 2026-08-04 · 023 마이그레이션).
  //   ★서버의 study_survey_timepoint_chk 및 console_record_study_survey 의 not in 목록과
  //     ★같은 값이어야 한다★. 어긋나면 화면은 고르게 해 놓고 서버가 거부해,
  //     운영자는 왜 저장이 안 되는지 알 수 없다. 넓히려면 세 곳을 함께 고친다.
  var SURVEY_TIMEPOINTS = [0, 6, 12];
  function tpLabel(t){
    var n = Number(t);
    return n === 0 ? "0주 (기저)" : n === 12 ? "12주 (종료)" : n === 6 ? "6주 (중간)" : n + "주";
  }
  // numeric(6,2) 는 "12.00" 으로 온다 — 사람이 읽는 자리에서는 꼬리 0 을 떼되
  // ★값을 반올림해 뭉개지 않는다★(3.5 를 쓰는 단축척도가 있다).
  function fmtScore(v){ var n = num(v); return n === null ? "" : String(Math.round(n * 100) / 100); }
  function instrumentsOf(){ return DATA.study_survey_instrument || []; }
  function surveysOf(){ return DATA.study_survey || []; }
  function surveyCell(pseudonym, instrument, tp){
    var rows = surveysOf();
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (r.pseudonym === pseudonym && r.instrument === instrument &&
          Number(r.timepoint_week) === Number(tp)) return r;
    }
    return null;
  }
  // ★변화량의 좋고 나쁨은 ★척도가 정한다★ — LSNS-6 은 오르면 좋고 UCLA 외로움은
  //   오르면 나쁘다. 한 방향으로 칠하면 ★외로움이 늘어난 것을 개선으로 보여 준다★.
  function surveyDelta(inst, base, last){
    if (!base || !last) return '<span class="muted">—</span>';
    var d = num(last.total_score) - num(base.total_score);
    var r = Math.round(d * 10) / 10;
    if (r === 0) return '<span class="muted">0</span>';
    var good = inst.higher_is_better ? (r > 0) : (r < 0);
    return '<span class="' + (good ? "pos" : "neg") + '">' + (r > 0 ? "+" : "") + r + "</span>";
  }

  function renderStudy(){
    var assigns = assignmentsOf();
    var active = assigns.filter(function(r){ return !r.revoked_at; });
    var snaps = snapshotsOf();
    var unreg = unregisteredSet();
    var devices = DATA.all_devices || [];

    // 기기 -> 현재 배정된 가명(있으면). 재배정 시 화면이 그 사실을 말해 준다.
    var nameOfDevice = {};
    active.forEach(function(r){ nameOfDevice[r.device_id] = r.pseudonym; });

    // ★(S523 대표 지적 "연구 참여 관리는 또 뭐야? 관리하고 말것도 없어. 데이터 뽑아야해")
    //   — 화면의 정체를 "관리"에서 ★입력 창구★ 로 좁혔다. 하는 일은 딱 둘:
    //   ①가명 배정(자동 수집이 붙는 자리) ②대면 설문 점수 입력. 뽑는 것(CSV)은 개요의
    //   "데이터 내려받기" 허브로 옮겼고, 카드·설명 문구는 걷어냈다.
    var html = crumb([{ t: "개요", go: { view: "overview" } }, { t: "연구" }]);
    html += "<h1>연구 배정 · 설문 입력</h1>";

    // ── 1) 배정 ────────────────────────────────────────────────────────
    //   ★폼을 숨기지 않는다★ — 배정할 새 기기가 없을 때가 곧 고칠 때다.
    html += '<section><div class="sechead"><div><h2>배정</h2>' +
      '<div class="desc">이미 배정된 기기를 다시 고르면 <b>군·기저일만 바뀌고 가명은 그대로</b>입니다.</div></div></div>';
    if (!devices.length) {
      html += '<div class="note">아직 서버를 두드린 기기가 없습니다.</div>';
    } else {
      html += '<div class="row" style="gap:10px;flex-wrap:wrap;align-items:flex-end">' +
        '<label style="display:block">기기<br><select id="asgDevice" style="min-width:340px">' +
        '<option value="">— 고르세요 —</option>';
      devices.forEach(function(c){
        var label = (c.alias ? c.alias : "이름 없음") +
          "  ·  " + String(c.device_id).slice(0, 8) + "…" +
          (nameOfDevice[c.device_id] ? "  ·  현재 " + nameOfDevice[c.device_id] : "  ·  미배정") +
          (c.registered ? "" : "  ·  연동 전");
        html += '<option value="' + esc(c.device_id) + '">' + esc(label) + "</option>";
      });
      html += "</select></label>" +
        '<label style="display:block">군<br><select id="asgCohort">' +
        '<option value="IMMEDIATE">IMMEDIATE (즉시)</option>' +
        '<option value="WAITLIST">WAITLIST (대기)</option></select></label>' +
        '<label style="display:block">기저일(Week0)<br><input id="asgBaseline" type="date" value="' + today() + '"></label>' +
        '<label style="display:block">종이 동의서<br>' +
        '<input type="checkbox" id="asgPaper"> <span style="font-size:13px">서명 받았음</span></label>' +
        '<button class="primary" id="asgBtn" style="margin-bottom:2px">배정</button></div>' +
        '<div id="asgMsg" style="font-size:13px;margin-top:8px"></div>' +
        // ★(S523) 안내는 이 한 줄만 남긴다 — 기저일 오입력은 소급이 안 되는 유일한 값이다
        //   (S515 실측 · 나머지 규칙은 서버가 지키므로 화면이 떠들 필요 없다).
        '<div class="note">★<b>기저일</b>은 처음에 정확히 — 이미 얼린 주차의 번호는 나중에 못 바꿉니다.</div>';
    }
    html += "</section>";

    // ── 2) 참여자 ──────────────────────────────────────────────────────
    html += '<section><div class="sechead"><div><h2>참여자' +
      '<span class="whose">가명 기준 · 대응표 없음</span></h2></div>' +
      csvBtn("study_roster") + "</div>";
    if (!assigns.length) {
      html += '<div class="note">아직 배정된 참여자가 없습니다.</div>';
    } else {
      html += '<div class="tablewrap"><table><tr><th>가명</th><th>군</th><th>기저일</th>' +
        "<th>종이 동의</th><th>자료</th><th>기기</th><th></th></tr>";
      assigns.forEach(function(r){
        var n = snapCount(r.pseudonym), st;
        if (r.revoked_at) st = '<span class="muted">철회됨</span>';
        else if (n > 0) st = "<b>" + n + "주</b>";
        else if (unreg[r.device_id]) st = '<span class="warn">0주 · 연동 전</span>';
        else st = '<span class="muted">0주</span>';
        html += "<tr" + (r.revoked_at ? ' style="opacity:.5"' : "") + ">" +
          "<td><b>" + esc(r.pseudonym) + "</b></td>" +
          "<td>" + esc(r.cohort) + "</td>" +
          "<td>" + esc(r.baseline_date) + "</td>" +
          // ★(S523) 종이 동의 — 안 받았으면 ★경고색★ 이다. IRB 가 약속한 서면 동의라
          //   "아직"이 눈에 안 띄면 8/11 창구에서 통째로 빠진 채 지나간다.
          "<td>" + (r.paper_consent ? "받음" : '<span class="warn">아직</span>') + "</td>" +
          "<td>" + st + "</td>" +
          "<td style=\"font-family:monospace;font-size:11px\" title=\"" + esc(r.device_id) + "\">" +
            esc(String(r.device_id || "").slice(0, 8)) + "…</td>" +
          "<td>" + (r.revoked_at ? "" :
            '<button class="csv" data-revoke="' + esc(r.device_id) + '" data-revokename="' + esc(r.pseudonym) + '">철회</button>') +
          "</td></tr>";
      });
      html += "</table></div>" +
        '<div id="revMsg" style="font-size:13px;margin-top:8px"></div>';
    }
    html += "</section>";

    // ── 3) 설문 점수 (S514) — IRB CRF ① ★사람이 종이로 잰 것★ ────────────
    //   ★기기 자료(아래 ④)보다 ★먼저★ 놓는다★ — CRF 자신의 순서가 그렇고(① 설문 → ②
    //     기기 자동수집), 이 연구의 ★일차 지표★ 가 설문의 사전-사후 변화이기 때문이다.
    //   ★여기 적힌 점수와 아래 주차 자료는 ★같은 가명★ 으로 이어진다★ — 그것이 이 자리를
    //     만든 이유다. 종전에는 두 숫자가 종이와 DB 로 갈라져 사람이 엑셀로 맞춰야 했고,
    //     그 대조는 실수가 섞이고 재현이 안 됐다(S511 §4-D).
    var insts = instrumentsOf();
    html += '<section><div class="sechead"><div><h2>설문 점수 ' +
      '<span class="muted" style="font-size:13px">대면 · IRB CRF ①</span></h2>' +
      '<div class="desc">종이로 받은 점수를 옮겨 적으면 <b>같은 가명으로</b> 아래 기기 자료와 이어집니다.</div></div>' +
      csvBtn("study_survey") + "</div>";
    if (!active.length) {
      html += '<div class="note">참여자가 없습니다. 먼저 배정하세요.</div>';
    } else if (!insts.length) {
      // ★"고를 척도가 없다"를 빈 드롭다운으로 조용히 보여 주지 않는다 — 무엇이 없는지 적는다.
      html += '<div class="note">쓸 수 있는 척도가 없습니다. 서버 척도 목록(study_survey_instrument)에 ' +
              '먼저 척도를 넣어야 합니다.</div>';
    } else {
      html += '<div class="row" style="gap:10px;flex-wrap:wrap;align-items:flex-end">' +
        '<label style="display:block">참여자<br><select id="svPseudo">';
      active.forEach(function(a){
        html += '<option value="' + esc(a.pseudonym) + '">' + esc(a.pseudonym) + " · " + esc(a.cohort) + "</option>";
      });
      html += "</select></label>" +
        '<label style="display:block">척도<br><select id="svInst" style="min-width:280px">';
      insts.forEach(function(x){
        html += '<option value="' + esc(x.code) + '">' + esc(x.label) +
          " (" + esc(fmtScore(x.min_score)) + "~" + esc(fmtScore(x.max_score)) + ")</option>";
      });
      html += "</select></label>" +
        '<label style="display:block">시점<br><select id="svTp">';
      SURVEY_TIMEPOINTS.forEach(function(t){
        html += '<option value="' + t + '">' + esc(tpLabel(t)) + "</option>";
      });
      html += "</select></label>" +
        '<label style="display:block">시행일<br><input id="svDate" type="date" value="' + today() + '"></label>' +
        '<label style="display:block">점수<br><input id="svScore" type="number" step="0.01" style="width:90px"></label>' +
        '<button class="primary" id="svBtn" style="margin-bottom:2px">저장</button>' +
        '<button class="csv" id="svDelBtn" style="margin-bottom:2px">지우기</button></div>' +
        '<div id="svMsg" style="font-size:13px;margin-top:8px"></div>';
      // ★(S523) 사용 규칙 4줄은 걷어냈다(대표 지시) — 덮어쓰기·범위 검증은 서버가
      //   집행하고, 실수는 저장 시 메시지(svMsg)로 그때그때 알린다.

      active.forEach(function(a){
        html += '<div style="margin:18px 0 6px"><b style="font-size:16px">' + esc(a.pseudonym) + "</b>" +
          '<span class="muted" style="margin-left:8px">' + esc(a.cohort) +
          " · 기저일 " + esc(a.baseline_date) + "</span></div>";
        html += '<div class="tablewrap"><table><tr><th>척도</th>';
        SURVEY_TIMEPOINTS.forEach(function(t){ html += "<th>" + esc(tpLabel(t)) + "</th>"; });
        html += "<th>변화 (0→12주)</th></tr>";
        insts.forEach(function(x){
          html += "<tr><td>" + esc(x.label) +
            '<span class="muted" style="font-size:11px"> ' +
            esc(fmtScore(x.min_score)) + "~" + esc(fmtScore(x.max_score)) + " · " +
            (x.higher_is_better ? "높을수록 좋음" : "낮을수록 좋음") + "</span></td>";
          SURVEY_TIMEPOINTS.forEach(function(t){
            var c = surveyCell(a.pseudonym, x.code, t);
            html += "<td" + (c ? ' title="' + esc("시행일 " + c.measured_on +
                     (c.recorded_by ? " · 기록 " + c.recorded_by : "")) + '"' : "") + ">" +
              (c ? "<b>" + esc(fmtScore(c.total_score)) + "</b>" : '<span class="muted">—</span>') + "</td>";
          });
          html += "<td>" + surveyDelta(x, surveyCell(a.pseudonym, x.code, 0),
                                          surveyCell(a.pseudonym, x.code, 12)) + "</td></tr>";
        });
        html += "</table></div>";
      });
      // ★(S523) 표 아래 설명은 걷어냈다(대표 지시) — 척도 방향·범위는 척도 이름 옆에,
      //   빈 칸의 뜻(측정 안 함≠0)은 데이터 규약(RS-4)에 이미 있다.
    }
    html += "</section>";

    // ── 4) 주차 자료 — ★참여자 전원★ 을 그린다(자료가 없어도 자리를 만든다) ──
    html += '<section><div class="sechead"><div><h2>주차 자료' +
      '<span class="whose">참여자 한 명당 한 묶음</span></h2></div>' +
      csvBtn("study_weeks") + "</div>";
    if (!active.length) {
      html += '<div class="note">참여자가 없습니다.</div></section>';
    } else {
      active.forEach(function(a){
        var mine = snaps.filter(function(r){ return r.pseudonym === a.pseudonym; });
        html += '<div style="margin:18px 0 6px"><b style="font-size:16px">' + esc(a.pseudonym) + "</b>" +
          '<span class="muted" style="margin-left:8px">' + esc(a.cohort) +
          " · 기저일 " + esc(a.baseline_date) + " · " + mine.length + "주 도착</span>";
        if (mine.length) {
          var trend = mine.map(function(r){ return r.elder_utterance_count == null ? "?" : r.elder_utterance_count; }).join(" → ");
          html += '<div class="muted" style="margin-top:2px">어르신 발화 추이 &nbsp;<b>' + esc(trend) + "</b></div>";
        }
        html += "</div>";
        if (!mine.length) {
          // ★빈 곳은 물음을 만든다 — 없으면 없다고 그 자리에 적는다.
          html += '<div class="note" style="margin:0 0 6px">아직 자료가 없습니다. ' +
                  '<b>첫 주가 끝나야</b> 첫 줄이 생깁니다' +
                  (unreg[a.device_id] ? ' — 게다가 이 기기는 <b>복지사 연동 전</b>이라 아직 서버로 못 보냅니다.' : '.') +
                  "</div>";
          return;
        }
        html += '<div class="tablewrap"><table><tr><th>주차</th><th>기간</th>' +

          "<th>대화(분)</th><th>집 밖(분/일)</th><th>연결지수</th></tr>";
        mine.forEach(function(r){
          // ★null 은 "측정 중"이 아니라 "—" 다 — 이미 얼린 주는 소급해 안 채워진다.
          function dash(v, suffix){
            return num(v) === null ? '<span class="muted">—</span>' : (suffix || "");
          }
          html += "<tr><td><b>" + esc(String(r.study_week)) + "주</b></td>" +

            "<td>" + esc(String(r.elder_utterance_count == null ? "" : r.elder_utterance_count)) + "</td>" +

            "<td>" + (num(r.proactive_response_rate) === null ? '<span class="muted">—</span>'
                      : Math.round(num(r.proactive_response_rate) * 100) + "%") + "</td>" +
            "<td>" + (num(r.mood_avg) === null ? '<span class="muted">—</span>'
                      : esc(Math.round(num(r.mood_avg) * 10) / 10)) + "</td>" +
            "<td>" + (num(r.conversation_minutes) === null ? '<span class="muted">—</span>'
                      : esc(Math.round(num(r.conversation_minutes) * 10) / 10)) + "</td>" +
            "<td>" + (num(r.away_minutes_avg) === null ? '<span class="muted">—</span>'
                      : esc(String(Math.round(num(r.away_minutes_avg)))) +
                        '<span class="muted" style="font-size:11px"> (' +
                        esc(String(r.away_measured_days == null ? "?" : r.away_measured_days)) + "일)</span>") + "</td>" +
            "<td>" + (num(r.connection_index) === null ? '<span class="muted">—</span>'
                      : esc(String(Math.round(num(r.connection_index)))) +
                        '<span class="muted" style="font-size:11px"> ' +

  // ★(S514) 두 화면(배정·설문)이 같은 말투로 답하도록 ★한 곳★ 에 둔다.
  //   종전엔 bindStudy 안에만 있었는데, 설문에서 복붙하면 어느 날 한쪽만 고쳐져
  //   같은 실패에 화면이 서로 다른 말을 하게 된다(S486 이 TTS 에서 걷어낸 것과 같은 결).
  function say(elId, ok, text){
    var m = el(elId); if (!m) return;
    m.style.color = ok ? "#0e7490" : "#b91c1c";
    m.textContent = text;
    setTimeout(function(){ if (m) m.textContent = ""; }, 6000);
  }
  // ★서버가 던진 코드를 ★사람 말★ 로 옮긴다 — 운영자에게 'SCORE_OUT_OF_RANGE' 를
  //   그대로 보여 주면 무엇을 고쳐야 하는지 알 수 없다.
  function rpcReason(r){
    var raw = (r.body && (r.body.message || r.body.hint)) || r.raw || "";
    if (raw.indexOf("NOT_CONSOLE_ADMIN") >= 0) return "권한이 없습니다.";
    if (raw.indexOf("INVALID_COHORT") >= 0) return "군이 올바르지 않습니다.";
    if (raw.indexOf("BASELINE_DATE_REQUIRED") >= 0) return "기저일을 넣어 주세요.";
    if (raw.indexOf("DEVICE_ID_REQUIRED") >= 0) return "기기를 골라 주세요.";
    if (raw.indexOf("ASSIGNMENT_NOT_FOUND") >= 0) return "그 배정을 찾지 못했습니다.";
    // ★(S514) 설문
    if (raw.indexOf("SCORE_OUT_OF_RANGE") >= 0) return "점수가 그 척도의 범위를 벗어납니다 — 종이를 다시 확인해 주세요.";
    if (raw.indexOf("SCORE_REQUIRED") >= 0) return "점수를 넣어 주세요.";
    if (raw.indexOf("UNKNOWN_INSTRUMENT") >= 0) return "그 척도를 찾지 못했습니다.";
    if (raw.indexOf("INVALID_TIMEPOINT") >= 0) return "시점이 올바르지 않습니다.";
    if (raw.indexOf("MEASURED_ON_REQUIRED") >= 0) return "시행일을 넣어 주세요.";
    if (raw.indexOf("PSEUDONYM_REQUIRED") >= 0) return "참여자를 골라 주세요.";
    if (raw.indexOf("SURVEY_NOT_FOUND") >= 0) return "그 칸에는 적힌 점수가 없습니다.";
    // ★(S525) 사건 기록·경보
    if (raw.indexOf("EVENT_DATE_IN_FUTURE") >= 0) return "앞날은 적을 수 없습니다 — 이미 있었던 일만 적습니다.";
    if (raw.indexOf("EVENT_DATE_REQUIRED") >= 0) return "날짜를 골라 주세요.";
    if (raw.indexOf("NOTE_TOO_LONG") >= 0) return "너무 깁니다(200자까지).";
    if (raw.indexOf("NOTE_EMPTY") >= 0) return "내용을 적어 주세요.";
    if (raw.indexOf("ELDERLY_NOT_FOUND") >= 0) return "그 어르신을 찾지 못했습니다.";
    return "처리하지 못했습니다. 잠시 후 다시 시도해 주세요.";
  }

  // 배정·철회 — 성공하면 데이터를 다시 받아 표에 즉시 반영한다(bindNote 와 같은 결).
  function bindStudy(){
    var reason = rpcReason;

    var btn = el("asgBtn");
    if (btn) btn.addEventListener("click", function(){
      var dev = el("asgDevice").value, base = el("asgBaseline").value;
      if (!dev) { say("asgMsg", false, "기기를 골라 주세요."); return; }
      if (!base) { say("asgMsg", false, "기저일을 넣어 주세요."); return; }
      btn.disabled = true;
      // ★(이력) 종전에는 "종이 동의서는 콘솔이 묻지 않는다(대표 지시) — 대표가 직접
      //   받으신다" 였고, 그래서 이 값을 안 넘겨 서버는 늘 false 였다.
      // ★★(S523 · 2026-08-08 대표 지시로 뒤집힘) "콘솔박스 진행" — 종이로 받는 것과
      //   그 사실을 시스템에 남기는 것은 다르다. 8/11 PoC 에서 10명 서명을 받아도
      //   남길 곳이 없어(콘솔에 칸 0개) IRB 대조가 사람 기억에 걸려 있었다.
      //   서버 RPC 는 p_paper_consent 를 ★처음부터★ 받고 있었다 — 없던 것은 화면뿐이다.
      // ★체크 안 하면 아예 안 넘긴다(undefined)★ — false 를 보내도 서버가
      //   "paper_consent or 새값" 으로 지켜 주지만, 화면이 "안 받았다"를 주장하지는 않는다.
      var paperEl = el("asgPaper");
      var payload = {
        p_device_id: dev,
        p_cohort: el("asgCohort").value,
        p_baseline_date: base
      };
      if (paperEl && paperEl.checked) payload.p_paper_consent = true;
      rpc("console_assign_study_participant", payload).then(function(r){
        btn.disabled = false;
        if (r.ok) {
          var b = r.body, row = (b && b.length) ? b[0] : b;
          var name = row && row.pseudonym ? row.pseudonym : "";
          say("asgMsg", true, "배정했습니다" + (name ? " — 가명 " + name : "") +
              ". 그 기기는 다음 날 스스로 등록됩니다.");
          load();
        } else say("asgMsg", false, reason(r));
      });
    });

    Array.prototype.forEach.call(el("view").querySelectorAll("[data-revoke]"), function(b){
      b.addEventListener("click", function(){
        var dev = b.getAttribute("data-revoke"), name = b.getAttribute("data-revokename");
        // ★확인을 한 번 받는다★ — 표 안의 버튼이라 손이 미끄러지면 엉뚱한 참여자를 거둔다.
        //   ★같은 좌표를 두 번 누르는 사고를 막는다(메모리 adb-tap-repeat-destructive 와 같은 결).
        if (!window.confirm(name + " 님의 연구 배정을 철회할까요?\n\n" +
            "그 기기는 다음 날 스스로 연구에서 빠지고,\n회사에 보관된 그분 몫의 숫자도 지워 달라고 청합니다.")) return;
        b.disabled = true;
        rpc("console_revoke_study_assignment", { p_device_id: dev }).then(function(r){
          b.disabled = false;
          if (r.ok) { say("revMsg", true, name + " 배정을 철회했습니다."); load(); }
          else say("revMsg", false, reason(r));
        });
      });
    });
  }

  // ★(S514) 설문 저장·지우기 — 종이에서 옮겨 적는 그 한 칸.
  function bindSurvey(){
    var btn = el("svBtn");
    if (btn) btn.addEventListener("click", function(){
      var score = el("svScore").value, date = el("svDate").value;
      // ★빈 칸을 0 으로 보내지 않는다★ — "안 쟀다"와 "0점"은 다른 사실이고,
      //   0 으로 적으면 그분이 관계망이 전무하다는 뜻이 된다(서버도 같은 이유로 거부한다).
      if (score === "") { say("svMsg", false, "점수를 넣어 주세요."); return; }
      if (!date) { say("svMsg", false, "시행일을 넣어 주세요."); return; }
      btn.disabled = true;
      rpc("console_record_study_survey", {
        p_pseudonym: el("svPseudo").value,
        p_instrument: el("svInst").value,
        p_timepoint_week: Number(el("svTp").value),
        p_measured_on: date,
        p_total_score: Number(score)
      }).then(function(r){
        btn.disabled = false;
        if (r.ok) {
          say("svMsg", true, "저장했습니다.");
          // ★점수 칸을 비운다★ — 안 비우면 다음 참여자를 고르고 그대로 눌렀을 때
          //   ★앞사람 점수가 그 사람 것으로 저장된다★.
          el("svScore").value = "";
          load();
        } else say("svMsg", false, rpcReason(r));
      });
    });

    var del = el("svDelBtn");
    if (del) del.addEventListener("click", function(){
      var p = el("svPseudo").value, i = el("svInst").value, t = Number(el("svTp").value);
      var c = surveyCell(p, i, t);
      if (!c) { say("svMsg", false, "그 칸에는 적힌 점수가 없습니다."); return; }
      // ★확인을 받는다★ — 지우면 되돌릴 수 없고 원본은 종이에만 남는다.
      //   ★"고치려는 것이면 지우지 말라"고 여기서 말해 준다★ — 덮어쓰기가 정정 수단이고,
      //   지우기가 습관이 되면 언젠가 남의 칸을 지운다.
      if (!window.confirm(p + " · " + tpLabel(t) + " 의 점수 " + fmtScore(c.total_score) + " 를 지울까요?\n\n" +
          "되돌릴 수 없습니다.\n점수를 고치려는 것이라면 지우지 말고 다시 저장하세요(덮어씁니다).")) return;
      del.disabled = true;
      rpc("console_delete_study_survey", {
        p_pseudonym: p, p_instrument: i, p_timepoint_week: t
      }).then(function(r){
        del.disabled = false;
        if (r.ok) { say("svMsg", true, "지웠습니다."); load(); }
        else say("svMsg", false, rpcReason(r));
      });
    });
  }

  function pct(v){

    return r > 0 ? '<span class="pos">+' + r + "%</span>"
         : r < 0 ? '<span class="neg">' + r + "%</span>"
                 : '<span class="muted">0%</span>';
  }
