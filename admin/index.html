  function fmtPlainNum(v){ var n = num(v); return n === null ? "측정 중" : String(Math.round(n)); }

  // ── 차트 ─────────────────────────────────────────────────────────────
  // 전원 OBV — 선마다 색 + ★범례★(누구 선인지 반드시 보이게)
  function obvSvg(series){
    var drawn = series.filter(function(s){
      return s.rows.some(function(w){ return w.connection_obv !== null && w.connection_obv !== undefined; });
    });
    // ★(S523) 기준 주만 있는 어르신도 ★이름은 보이게★ 한다 — 대표 지적("추세가 왜
    //   1명만이지? 정보는 2명에게 받는다며?"). 첫 주는 비교 대상(지난주)이 없어 OBV 가
    //   null 이라 선을 못 그리는데, 종전엔 그 사람이 그래프에서 통째로 사라져
    //   "데이터가 안 온다"로 오독됐다. 선이 없어도 ★왜 없는지★ 는 화면이 말해야 한다.
    var baseOnly = series.filter(function(s){
      return s.rows.length > 0 && !s.rows.some(function(w){ return w.connection_obv !== null && w.connection_obv !== undefined; });
    });
    var baseNote = baseOnly.length
      ? '<div class="muted" style="font-size:12.5px;margin-top:6px">' +
        baseOnly.map(function(s){ return esc(label(s.id)); }).join(" · ") +
        " — 첫 주(기준 주) 진행 중 · 다음 주부터 선이 생깁니다</div>"
      : "";
    if (!drawn.length) return '<div class="muted" style="font-size:13px">아직 그릴 추세가 없습니다 — 두 번째 주가 지나야 첫 비교가 생깁니다.</div>' + baseNote;
    var maxWeek = 1, maxAbs = 10;
    drawn.forEach(function(s){ s.rows.forEach(function(w){
      if (w.week_index > maxWeek) maxWeek = w.week_index;
      var v = num(w.connection_obv);
      if (v !== null && Math.abs(v) > maxAbs) maxAbs = Math.abs(v);
    }); });
    var W = 1000, H = 250, L = 50, R = 20, T = 16, B = 34;
    var x = function(wi){ return maxWeek === 1 ? (L + W - R) / 2 : L + (wi - 1) * (W - L - R) / (maxWeek - 1); };
    var y = function(v){ return T + (1 - (v + maxAbs) / (2 * maxAbs)) * (H - T - B); };
    var out = '<svg viewBox="0 0 ' + W + " " + H + '">';
    out += '<line x1="' + L + '" y1="' + y(0) + '" x2="' + (W - R) + '" y2="' + y(0) + '" stroke="#94a3a0" stroke-dasharray="4 4"/>';
    out += '<text x="6" y="' + (y(0) + 4) + '" font-size="11" fill="#5b7078">0 (기준)</text>';
    out += '<text x="6" y="' + (y(maxAbs) + 10) + '" font-size="11" fill="#5b7078">+' + Math.round(maxAbs) + "</text>";
    out += '<text x="6" y="' + (y(-maxAbs) - 2) + '" font-size="11" fill="#5b7078">-' + Math.round(maxAbs) + "</text>";
    drawn.forEach(function(s, i){
      var pts = s.rows.filter(function(w){ return num(w.connection_obv) !== null; });
      var c = COLORS[i % COLORS.length];
      var dstr = pts.map(function(w, j){ return (j ? "L" : "M") + x(w.week_index) + " " + y(num(w.connection_obv)); }).join(" ");
      if (pts.length > 1) out += '<path d="' + dstr + '" fill="none" stroke="' + c + '" stroke-width="2.5"/>';
      pts.forEach(function(w){ out += '<circle cx="' + x(w.week_index) + '" cy="' + y(num(w.connection_obv)) + '" r="4" fill="' + c + '"/>'; });
    });
    for (var wi = 1; wi <= maxWeek; wi++) {
      out += '<text x="' + x(wi) + '" y="' + (H - 10) + '" font-size="11.5" fill="#5b7078" text-anchor="middle">' + wi + "주차</text>";
    }
    out += "</svg>";
    out += '<div class="legend">' + drawn.map(function(s, i){
      return '<span><i style="background:' + COLORS[i % COLORS.length] + '"></i>' + esc(label(s.id)) + "</span>";
    }).join("") + "</div>";
    return out + baseNote;
  }

  // 한 사람의 축별 OBV(무엇이 오르고 내렸는지)
  function elderAxisSvg(ws){
    var axes = [
      { key: "relational_obv", name: "관계망(대면+통화)", c: COLORS[0] },
      { key: "conversation_obv", name: "대화", c: COLORS[1] },
      { key: "mobility_obv", name: "이동", c: COLORS[2] },
      { key: "connection_obv", name: "종합", c: "#111827" },
    ];
    var any = ws.some(function(w){ return axes.some(function(a){ return num(w[a.key]) !== null; }); });
    if (!any) return '<div class="muted" style="font-size:13px">아직 그릴 추세가 없습니다 — 두 번째 주가 지나야 첫 비교가 생깁니다.</div>';
    var maxWeek = 1, maxAbs = 10;
    ws.forEach(function(w){
      if (w.week_index > maxWeek) maxWeek = w.week_index;
      axes.forEach(function(a){ var v = num(w[a.key]); if (v !== null && Math.abs(v) > maxAbs) maxAbs = Math.abs(v); });
    });
    var W = 1000, H = 250, L = 50, R = 20, T = 16, B = 34;
    var x = function(wi){ return maxWeek === 1 ? (L + W - R) / 2 : L + (wi - 1) * (W - L - R) / (maxWeek - 1); };
    var y = function(v){ return T + (1 - (v + maxAbs) / (2 * maxAbs)) * (H - T - B); };
    var out = '<svg viewBox="0 0 ' + W + " " + H + '">';
    out += '<line x1="' + L + '" y1="' + y(0) + '" x2="' + (W - R) + '" y2="' + y(0) + '" stroke="#94a3a0" stroke-dasharray="4 4"/>';
    out += '<text x="6" y="' + (y(0) + 4) + '" font-size="11" fill="#5b7078">0 (기준)</text>';
    out += '<text x="6" y="' + (y(maxAbs) + 10) + '" font-size="11" fill="#5b7078">+' + Math.round(maxAbs) + "</text>";
    out += '<text x="6" y="' + (y(-maxAbs) - 2) + '" font-size="11" fill="#5b7078">-' + Math.round(maxAbs) + "</text>";
    axes.forEach(function(a){
      var pts = ws.filter(function(w){ return num(w[a.key]) !== null; });
      if (!pts.length) return;
      var dstr = pts.map(function(w, j){ return (j ? "L" : "M") + x(w.week_index) + " " + y(num(w[a.key])); }).join(" ");
      var wide = a.key === "connection_obv";
      if (pts.length > 1) out += '<path d="' + dstr + '" fill="none" stroke="' + a.c + '" stroke-width="' + (wide ? 3 : 2) + '"' +
        (wide ? "" : ' stroke-dasharray="5 3"') + "/>";
      pts.forEach(function(w){ out += '<circle cx="' + x(w.week_index) + '" cy="' + y(num(w[a.key])) + '" r="' + (wide ? 4.5 : 3.5) + '" fill="' + a.c + '"/>'; });
    });
    for (var wi = 1; wi <= maxWeek; wi++) {
      out += '<text x="' + x(wi) + '" y="' + (H - 10) + '" font-size="11.5" fill="#5b7078" text-anchor="middle">' + wi + "주차</text>";
    }
    out += "</svg>";
    out += '<div class="legend">' + axes.map(function(a){
      return '<span><i style="background:' + a.c + '"></i>' + esc(a.name) + "</span>";
    }).join("") + '<span class="muted">점선 = 축별 · 굵은 선 = 종합</span></div>';
    return out;
  }

  // 한 사람의 일별 막대
  function dailySvg(ds){
    if (!ds.length) return '<div class="muted" style="font-size:13px">이 기간에는 기록이 없습니다</div>';
    var maxV = 10;
    ds.forEach(function(r){
      var rel = (num(r.face_to_face_minutes) || 0) + (num(r.phone_call_minutes) || 0);
      var med = num(r.media_minutes) || 0;
      if (Math.max(rel, med) > maxV) maxV = Math.max(rel, med);
    });
    var W = 1000, H = 210, L = 46, R = 10, T = 12, B = 30;
    var bw = (W - L - R) / ds.length;
    var y = function(v){ return T + (1 - v / maxV) * (H - T - B); };
    var out = '<svg viewBox="0 0 ' + W + " " + H + '">';
    out += '<text x="4" y="' + (T + 10) + '" font-size="11" fill="#5b7078">' + Math.round(maxV) + "분</text>";
    ds.forEach(function(r, i){
      var rel = (num(r.face_to_face_minutes) || 0) + (num(r.phone_call_minutes) || 0);
      var med = num(r.media_minutes) || 0;
      var x0 = L + i * bw;
      out += '<rect x="' + (x0 + bw * 0.12) + '" y="' + y(med) + '" width="' + bw * 0.32 + '" height="' + (y(0) - y(med)) + '" fill="#c9e2de"/>';
      out += '<rect x="' + (x0 + bw * 0.52) + '" y="' + y(rel) + '" width="' + bw * 0.32 + '" height="' + (y(0) - y(rel)) + '" fill="#17857A"/>';
      out += '<text x="' + (x0 + bw / 2) + '" y="' + (H - 8) + '" font-size="10.5" fill="#5b7078" text-anchor="middle">' + esc(String(r.metric_date).slice(5)) + "</text>";
    });
    out += "</svg>";
    out += '<div class="legend"><span><i style="background:#17857A"></i>대면+통화</span>' +
           '<span><i style="background:#c9e2de"></i>미디어(TV 등) 노출</span></div>';
    return out;
  }

  // ── 관리자 관리 ──────────────────────────────────────────────────────
  function adminSection(){
    return "<section><h2>관리자 관리</h2>" +
      '<div class="desc">여기 등록된 이메일 계정만 이 콘솔을 열 수 있습니다. 아직 가입하지 않은 사람도 미리 등록해 둘 수 있어요' +
      "(나중에 같은 이메일로 로그인하면 바로 들어옵니다). 본인은 지울 수 없고, 마지막 한 명도 지울 수 없습니다.</div>" +
      '<div class="row" style="margin-bottom:12px">' +
      '<input id="newAdminEmail" type="email" placeholder="추가할 이메일" style="flex:1;min-width:220px">' +
      '<input id="newAdminNote" type="text" placeholder="메모 (예: 운영팀 김OO)" style="flex:1;min-width:180px">' +
      '<button class="primary" id="addAdminBtn">관리자 추가</button></div>' +
      '<div id="adminMsg" style="font-size:13px;margin-bottom:10px"></div>' +
      '<div class="tablewrap"><table id="adminTable"></table></div></section>';
  }
  function friendlyRpcError(r){
    var msg = (r.body && (r.body.message || r.body.hint)) || r.raw || "";
    if (msg.indexOf("INVALID_EMAIL") >= 0) return "이메일 형식이 올바르지 않습니다.";
    if (msg.indexOf("CANNOT_REMOVE_SELF") >= 0) return "본인은 지울 수 없습니다.";
    if (msg.indexOf("CANNOT_REMOVE_LAST_ADMIN") >= 0) return "마지막 관리자는 지울 수 없습니다.";
    if (msg.indexOf("NOT_CONSOLE_ADMIN") >= 0) return "권한이 없습니다.";
    return "처리하지 못했습니다. 잠시 후 다시 시도해 주세요.";
  }
  function adminMsg(text, ok){
    var e = el("adminMsg"); if (!e) return;
    e.textContent = text; e.style.color = ok ? "#0e7490" : "#b91c1c";
    setTimeout(function(){ if (e.textContent === text) e.textContent = ""; }, 6000);
  }
  function bindAdmin(){
    var add = el("addAdminBtn"); if (!add) return;
    add.addEventListener("click", function(){
      var email = el("newAdminEmail").value.trim();
      if (!email) { adminMsg("이메일을 입력해 주세요.", false); return; }
      rpc("console_add_admin", { p_email: email, p_note: el("newAdminNote").value.trim() }).then(function(r){
        if (r.ok) { el("newAdminEmail").value = ""; el("newAdminNote").value = ""; adminMsg("추가했습니다.", true); }
        else adminMsg(friendlyRpcError(r), false);
        loadAdmins();
      });
    });
    loadAdmins();
  }
  function loadAdmins(){
    var t = el("adminTable"); if (!t) return;
    rpc("console_list_admins").then(function(r){
      if (!r.ok || !Array.isArray(r.body)) { t.innerHTML = '<tr><td class="muted">관리자 목록을 불러오지 못했습니다</td></tr>'; return; }
      var me = (el("whoText").textContent || "").toLowerCase();
      t.innerHTML = "<tr><th>이메일</th><th>메모</th><th>등록일</th><th></th></tr>" + r.body.map(function(a){
        var isMe = String(a.email).toLowerCase() === me;
        var btn = isMe ? '<span class="muted">본인</span>'
                       : '<button class="danger" data-remove="' + esc(a.email) + '">삭제</button>';
        return "<tr><td>" + esc(a.email) + "</td><td>" + esc(a.note || "") + "</td><td>" +
               esc(String(a.created_at || "").slice(0, 10)) + "</td><td>" + btn + "</td></tr>";
      }).join("");
      Array.prototype.forEach.call(t.querySelectorAll("[data-remove]"), function(b){
        b.addEventListener("click", function(){
          var email = b.getAttribute("data-remove");
          if (!confirm(email + " 님의 관리자 권한을 지울까요?")) return;
          rpc("console_remove_admin", { p_email: email }).then(function(r2){
            adminMsg(r2.ok ? "삭제했습니다." : friendlyRpcError(r2), r2.ok);
            loadAdmins();
          });
        });
      });
    });
  }

  // ── 이벤트 ───────────────────────────────────────────────────────────
  el("loginBtn").addEventListener("click", loginWithPassword);
  el("pwInput").addEventListener("keydown", function(e){ if (e.key === "Enter") loginWithPassword(); });
  el("googleBtn").addEventListener("click", function(){ socialLogin("google"); });
  el("kakaoBtn").addEventListener("click", function(){ socialLogin("kakao"); });
  el("refreshBtn").addEventListener("click", load);
  el("homeBtn").addEventListener("click", function(){ go({ view: "overview" }); });
  el("logoutBtn").addEventListener("click", function(){ setSess(null); showLogin(null); });
  el("rangeSelect").value = String(rangeDays());
  el("rangeSelect").addEventListener("change", function(){
    setRangeDays(Number(el("rangeSelect").value));
    el("liveText").textContent = "기간 바꾸는 중…";
    load();   // 기간이 바뀌면 서버에서 다시 받아 그 자리에서 갱신한다
  });

  captureHashSession();
  if (sess()) load(); else showLogin(null);
})();
</script>
</body>
