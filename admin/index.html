<!-- ============================================================================
  텔로스 케어 · 관리자 콘솔 (정적 1장 · 외부 라이브러리 0 · SVG 자체 생성)
  정본: naoncare-edge/console/admin_console.html
  배치: telos-website/admin/index.html  →  https://www.telos.it.kr/admin
  수정: 2026-08-08 (S525 — ★의미층 개요 재구성: 추이 → 정렬 상태판 → 전후 비교 · docs/72 §4)
        2026-07-27 (S497 — ★정보구조 재설계: 개요 → 목록 → 상세 드릴다운, 대표 지적)

  ★★(S525) 개요의 순서가 곧 이 콘솔의 주장이다 — docs/72 §4:
      전체 추이 한 선(지금 효과가 나는가) → 어르신 상태판(누가 나빠지는가 · 아무 열이나
      눌러 정렬) → 전후 비교(얼마나 달라졌는가) → 기기·집계 → 내려받기.
    · 종전 "어르신 목록" 표는 ★삭제★ 했다(상태판이 대체 · 두 표가 나란히 있는 것이
      대표가 "중구난방"이라 한 상태다).
    · ★값은 화면이 계산하지 않는다★ — 전부 서버 뷰(032·033)에서 접어서 온다.
      같은 계산이 두 곳에 생기면 언젠가 두 숫자가 갈라지고 무엇이 참인지 아무도 모른다.
    · ★경보는 그리는 김에 서버에 남긴다★(console_record_alerts) — 표⑥의 왼쪽 끝.
      판정은 여전히 콘솔이 하고, 날짜는 서버가 KST 로 찍는다.

  ★이 콘솔이 답하려는 질문(한 줄): "우리 서비스가 어르신 한 분 한 분의 사회적 연결을
    늘리고 있는가?" — 그래서 화면은 ①회사 전체 ②어르신 목록 ③개인 상세 3층으로만 간다.

  ★재설계 이유(대표 지적, 전부 타당했다):
    · 회사 숫자와 개인 숫자가 한 화면에 섞여 "뭘 나타내는지 모르겠다"
    · 차트에 ★누구 것인지 표시가 없었다★(14일 접촉=전원 합계인데 아무 표시 없음)
    · 어디도 클릭해 들어갈 수 없어 개인 추적이 불가능했다
    · "연결 추세 평균 -50" = ★서로 다른 사람의 변화율을 섞은 무의미한 숫자★ → 제거하고
      분포(오름/유지/내림/측정중 인원수)로 대체. 평균 한 개는 아무에게도 답을 주지 않는다.

  ★두 가지 "주차"가 다르다(섞으면 안 되어 화면에 명시한다):
    · 어르신 주차 = 그 어르신 ★등록일 기준★ 1주차·2주차…(connection_weekly)
    · 회사 주차   = 달력 주(월요일 시작, effect_company_weekly)

  ★보안: 로그인(Supabase Auth) + console_admin 이메일 허용목록. 이 파일에 비밀 없음
    (박힌 것은 브라우저 노출 전제인 공개 anon 키뿐 — 그것만으로는 아무 데이터도 못 읽는다).

<style>
  :root{--teal:#17857A;--teal-soft:#e6f2f0;--ink:#1a2b32;--sub:#5b7078;--line:#dbe6e4;

  button.primary{background:var(--teal);border-color:var(--teal);color:#fff}

  button.danger{color:var(--red);border-color:#f0d5d5}
  button.link{border:none;background:none;color:var(--teal);padding:0;text-decoration:underline;font-size:13px}
  a.btn{border:1px solid var(--teal);background:var(--teal);color:#fff;border-radius:8px;padding:7px 14px;font-size:13px;text-decoration:none;font-weight:600}
  a.btn:hover{background:#136d64}
  main{max-width:1120px;margin:0 auto;padding:20px 20px 60px}
  .crumb{font-size:13px;color:var(--sub);margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  .whose{display:inline-block;background:var(--teal-soft);color:#14625b;border-radius:6px;

  th:first-child,td:first-child{text-align:left}
  th{color:var(--sub);font-weight:600;font-size:12px}
  tr.clickable{cursor:pointer}
  tr.clickable:hover td{background:#f2f8f7}
  .pos{color:var(--good);font-weight:600}.neg{color:var(--amber);font-weight:600}
  .muted{color:var(--sub)}
  .warn{color:var(--amber);font-weight:600}
  .tablewrap{overflow-x:auto}
  svg{display:block;width:100%}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:8px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
  input{padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  /* (S697) 기관 관리 — 계약 표 · 관리 창 */
  .ct-bar{display:inline-block;width:70px;height:6px;background:#e5eeec;border-radius:3px;vertical-align:middle;overflow:hidden}
  .ct-bar span{display:block;height:100%;background:var(--teal)}
  table.ct-list tr.on td{background:var(--teal-soft)}
  button.small{padding:4px 10px;font-size:12.5px}
  button:disabled{opacity:.4;cursor:default}
  a.ct-out{font-size:13px;color:var(--teal);margin-left:6px}
  .ct-new{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px;padding:12px 14px;border:1px dashed var(--line);border-radius:10px;font-size:13px}
  .ct-new input,.ct-new select{padding:6px 8px;font-size:13px}
  .ct-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 14px}
  .ct-steps div{background:var(--teal-soft);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.55}
  .ct-steps div b:first-child{display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--teal);color:#fff;text-align:center;line-height:20px;margin-right:4px;font-size:12px}
  .ctp-add.first{margin:0 0 12px;padding:12px 14px;border:1px solid var(--teal);border-radius:10px;background:var(--teal-soft)}

  .ctp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
  .ctp-name{font-size:18px;font-weight:700}
  .ctp-actions{display:flex;gap:8px;align-items:center}
  .ctp-tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  .ctp-tile{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .ctp-tile .k{font-size:12.5px;color:var(--sub)}
  .ctp-tile .v{font-size:22px;font-weight:700;margin:2px 0 6px}
  .ctp-tile .s{font-size:12px;color:var(--sub);margin-top:6px}
  .ctp-edit{display:flex;gap:6px;align-items:center;margin-top:8px}
  .ctp-edit input{padding:6px 8px;font-size:14px;width:90px}
  .ctp-edit input[type=date]{width:160px}
  .ctp-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:10px}
  .ctp-tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 14px;color:var(--sub)}
  .ctp-tabs button.on{color:var(--ink);border-bottom-color:var(--teal);font-weight:700}
  table.ctp-table th,table.ctp-table td{text-align:left}
  table.ctp-table tr.dim td{color:#9aaaa8}
  .ctp-add{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .ctp-add input,.ctp-add select{padding:6px 8px;font-size:13px}
  .note{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.6}
  .sechead{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;flex-wrap:wrap}

       border-radius:6px;padding:2px 8px;font-size:12px;margin-left:6px;vertical-align:middle}
  select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;
         font-family:inherit;background:var(--card);color:var(--ink);cursor:pointer}
  #login{max-width:420px;margin:10vh auto;background:var(--card);border:1px solid var(--line);
         border-radius:14px;padding:30px}
  #login h2{color:var(--teal);font-size:19px;margin-bottom:6px}
  #login p{font-size:13px;color:var(--sub);margin-bottom:18px}
  #login input{width:100%;margin-bottom:10px}
  #login button{width:100%;padding:12px;margin-bottom:8px}
  .social{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
  .social button{font-weight:600}
  .btn-google{background:#fff;border:1px solid #d5dbdb;color:#1f2937}
  .btn-kakao{background:#FEE500;border-color:#FEE500;color:#191600}
  .divider{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:12px;margin:14px 0}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
  #loginErr{color:var(--red);font-size:13px;margin-bottom:12px;display:none;line-height:1.5}
  #app{display:none}
</style>
</head>

(function(){
  "use strict";

  // 공개(anon) 키 — 브라우저 노출 전제. 이것만으로는 아무 데이터도 못 읽는다.

  var SESS_KEY = "telos_session";
  function sess(){
    try {
      var v = localStorage.getItem(SESS_KEY);

        var old = sessionStorage.getItem(SESS_KEY);

  // ── ★★(S622 · 대표 질문) 빈칸은 한 가지가 아니다 — 셋을 갈라 적는다★★ ─────
  //   대표 = "★왜 이동거리 빼고 다 빈칸이지?★" (2026-09-15)
  //   [실상] 대표가 보신 07-17~08-10 은 ★걷기 앱이 되기 전★ 이다. 그 칸들이 코드에
  //   아예 없던 시기라 ★채울 자료가 세상에 없다★. 그런데 표는 그것을
  //   ★"기능은 있는데 못 잰 날"과 똑같은 빈칸★ 으로 보여 줬다 —
  //   그래서 표를 열면 ★전부 고장 난 것처럼 보였다★.

  //   ★소급해 채울 수 없고 지우는 것도 거짓말이다★ → ★갈라 적는 것이 답이다.★
  //     · 해당 없음  = 그 날에는 잴 길이 자체가 없었다(그 칸이 아직 없던 시절)
  //     · 측정 실패  = 잴 수 있었는데 못 쟀다  ← ★고쳐야 할 것은 이것뿐이다★
  //     · 측정 중    = 오늘 — 아직 하루가 안 끝났다(고장이 아니다)

  function fieldSince(field){
    var m = (DATA && DATA.field_since) ? DATA.field_since : null;
    return (m && m[field]) ? String(m[field]) : null;
  }
  /** 그 날 그 칸을 잴 수 있었나. ★모르면 "그렇다"로 접는다★(덜 말하는 쪽). */
  function fieldExisted(field, metricDate){
    var since = fieldSince(field);
    if (!since || !metricDate) return true;
    return String(metricDate) >= since;
  }
  // ── ★★(S622-b · 대표 지적) 빈칸을 ★넷★ 으로 가른다 — 셋으로는 모자랐다★★ ──────
  //   대표 = "★왜 이렇게 측정실패가 많지? 이유가 대체 뭐야?★" (2026-09-15)
  //
  //   [실측] 내려받으신 CSV 472행에서 「측정실패」가 ★5,900칸★ 이었는데,
  //   ★그중 2,577칸(43%)은 고장이 아니었다★ —
  //   ★그 기기가 그 칸을 180일 내내 한 번도 보낸 적이 없다★(앱이 옛 판이라 칸이 없다).
  //
  //   [★내가 반쪽만 만들었다★] 아침에 넣은 `field_since` 는 ★누구에게든 처음 온 날★ 이라,
  //   ★한 기기가 08-27 에 보행리듬을 보내기 시작하면 그 뒤로는 옛 판을 쓰는 다른 모든
  //   분의 모든 날이 「측정실패」로 찍혔다★. 논리는 맞지만 ★사람이 읽기엔 전부 고장★ 이고
  //   ★정작 고칠 수 있는 것이 묻힌다★.

  //       ★앱 옛 판★  = 이 기기는 이 칸을 보낼 줄 모른다       → ★배포가 답이다★
  //       측정 실패   = 보낸 적 있는데 그 날만 없다            → ★이것만 진짜 고칠 거리★
  //       측정 중     = 오늘(하루가 안 끝났다)                → 고장이 아니다
  //   ★넷을 하나로 뭉개지 말 것★ — 뭉개는 순간 다시 "전부 고장"으로 보인다.
  function fieldSinceFor(elderlyId, field){
    var m = (DATA && DATA.field_since_by_elderly) ? DATA.field_since_by_elderly : null;
    var mine = (m && elderlyId) ? m[elderlyId] : null;
    return (mine && mine[field]) ? String(mine[field]) : null;
  }

  /**
   * 빈칸 하나의 ★이름★. 화면(HTML)과 CSV 가 ★같은 판정★ 을 쓴다.
   *
   * @param elderlyId 그 어르신. ★안 주면 전역 기준으로만 가른다★(종전 거동).
   */
  function blankKind(field, metricDate, elderlyId){
    if (!fieldExisted(field, metricDate)) return "none";       // 해당 없음
    if (String(metricDate) === today()) return "pending";      // 오늘
    if (elderlyId) {
      var mineSince = fieldSinceFor(elderlyId, field);
      // ★이 기기가 이 칸을 한 번도 안 보냈다★ → 배포 문제이지 측정 실패가 아니다.
      if (!mineSince) return "oldapp";
      // ★보내기 시작하기 전의 날★ 도 같은 뜻이다(그때 이 기기엔 그 칸이 없었다).
      if (String(metricDate) < mineSince) return "oldapp";
    }
    return "failed";                                           // ★진짜 측정 실패★
  }
  function blankCell(field, metricDate, elderlyId){
    var k = blankKind(field, metricDate, elderlyId);
    if (k === "none") return '<span class="muted" title="그 날에는 이 기능이 없었습니다 — 고장이 아닙니다">해당 없음</span>';
    if (k === "pending") return '<span class="muted">측정 중</span>';
    if (k === "oldapp") return '<span class="muted" title="이 기기의 앱이 이 항목을 보낼 줄 모릅니다 — 새 판이 깔리면 저절로 찹니다. 고장이 아닙니다">앱 옛 판</span>';
    return '<span class="warn" title="이 기기는 이 항목을 보낸 적이 있는데 이 날은 못 쟀습니다 — 여기가 진짜 고칠 거리입니다">측정 실패</span>';
  }
  /** 값이 있으면 값, 없으면 갈라 적은 빈칸. ★일별 표 전용★(주간 요약은 fmt). */
  function dayCell(v, unit, field, metricDate, elderlyId){
    return num(v) === null ? blankCell(field, metricDate, elderlyId)

  }
  // ── ★★(S622 · 대표 지시) 가명 대신 구글 ID★★ ───────────────────────────

  //

  function accountOf(id){
    var m = (DATA && DATA.elderly_account) ? DATA.elderly_account : null;
    return (m && m[id]) ? String(m[id]) : null;
  }
  /**
   * ★★(S622-b · 대표 지시) 로그인 안 하신 분께도 이름표★★
   *

  function deviceShortOf(id){

  /**

  function accountTag(id){

    }
    var a = accountOf(id);
    if (a) {
      return ' <span class="muted" style="font-weight:400" title="구글로 이어 두신 계정입니다. 이 값은 화면에만 보이고 내려받는 파일에는 들어가지 않습니다">· ' + esc(a) + "</span>";

  /** CSV 한 칸. ★엑셀에서 눈으로 갈리게 글자로 적는다★(대표 처방). */
  function dayCsv(v, field, metricDate, elderlyId){
    if (v !== null && v !== undefined && v !== "") return v;
    var k = blankKind(field, metricDate, elderlyId);
    if (k === "none") return "\u2014";      // — (해당 없음)
    if (k === "pending") return "";          // 오늘은 비워 둔다(고장이 아니다)

  // ── 로그인 ───────────────────────────────────────────────────────────
  function showLogin(msg){
    el("login").style.display = "block"; el("app").style.display = "none";
    var e = el("loginErr");
    if (msg) { e.innerHTML = msg; e.style.display = "block"; } else { e.style.display = "none"; }
    if (timer) { clearInterval(timer); timer = null; }
  }
  function showApp(){
    el("login").style.display = "none"; el("app").style.display = "block";
    if (!timer) timer = setInterval(load, POLL_MS);
  }
  function authFetch(path, body){
    return fetch(SUPA + "/auth/v1/" + path, {
      method: "POST", headers: { "apikey": ANON, "Content-Type": "application/json" },
      body: JSON.stringify(body),
    }).then(function(r){ return r.json().then(function(j){ return { ok: r.ok, body: j }; }); });
  }
  function socialLogin(provider){
    var back = location.origin + location.pathname;
    location.href = SUPA + "/auth/v1/authorize?provider=" + provider + "&redirect_to=" + encodeURIComponent(back);
  }
  function captureHashSession(){
    if (!location.hash || location.hash.indexOf("access_token") < 0) return false;
    var p = new URLSearchParams(location.hash.slice(1));
    var at = p.get("access_token");
    if (!at) return false;
    setSess({ access_token: at, refresh_token: p.get("refresh_token") });
    history.replaceState(null, "", location.pathname);
    return true;
  }
  function refreshSession(){
    var s = sess();
    if (!s || !s.refresh_token) return Promise.resolve(false);
    return authFetch("token?grant_type=refresh_token", { refresh_token: s.refresh_token })
      .then(function(r){
        if (!r.ok || !r.body.access_token) return false;
        setSess({ access_token: r.body.access_token, refresh_token: r.body.refresh_token });
        return true;
      }).catch(function(){ return false; });
  }
  function apiFetch(url, opts, retried){
    var s = sess();
    if (!s) return Promise.reject(new Error("no_session"));
    var o = {}; for (var k in (opts || {})) o[k] = opts[k];
    o.headers = { "apikey": ANON, "Authorization": "Bearer " + s.access_token };
    for (var h in ((opts || {}).headers || {})) o.headers[h] = opts.headers[h];
    return fetch(url, o).then(function(r){
      if (r.status === 401 && !retried) {
        return refreshSession().then(function(ok){
          if (!ok) throw new Error("session_expired");
          return apiFetch(url, opts, true);
        });
      }
      return r;
    });
  }
  function rpc(name, args){
    return apiFetch(SUPA + "/rest/v1/rpc/" + name, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(args || {}),
    }).then(function(r){
      return r.text().then(function(t){
        var j = null; try { j = t ? JSON.parse(t) : null; } catch(e) {}
        return { ok: r.ok, body: j, raw: t };
      });
    });
  }

  // ★기간은 취향(비밀 아님)이라 localStorage 에 남긴다 — 탭을 닫아도 다음에 그대로 열린다.

  //   날들이 표의 절반을 차지한다(그것이 "왜 다 빈칸이지?"의 뿌리였다).

  function rangeDays(){

  }
  function setRangeDays(v){ localStorage.setItem("telos_range_days", String(v)); }

  function load(){
    apiFetch(DASH, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ days: rangeDays() }),
    })
      .then(function(r){
        if (r.status === 403) {
          return r.json().then(function(j){
            // ★(S534) 403 이 두 가지 뜻을 갖게 됐다 — 가르지 않으면 2단계가 필요한 사람에게
            //   "당신은 관리자가 아닙니다"라고 거짓말을 하고 ★세션까지 날려 버린다★.

              setSess(null);

                        "지나지 않아 닫아 두었습니다.</span>");
              throw new Error("not_admin");
            }
            setSess(null);
            showLogin("이 계정(" + esc(j.email || "") + ")은 관리자로 등록되어 있지 않습니다.<br>" +
                      "<span style='color:#5b7078'>관리자에게 등록을 요청하세요.</span>");
            throw new Error("not_admin");
          });
        }

      })
      .then(function(d){
        DATA = d; showApp();
        el("whoText").textContent = d.viewer || "";
        // ★서버가 실제 적용한 기간으로 선택기를 맞춘다(요청과 다르면 화면이 거짓말하지 않게).

      //   어르신 여섯 분의 증상이 정확히 이것이다.

  /**
   * ★걸음은 오는데 자취 기반 값이 한 날도 없는가★ — 위치 권한을 의심하는 자리.
   *
   * ★"한 날도"를 본다★ — 하루 이틀 비는 것은 실내에 계셨다는 뜻일 수 있다.
   * ★걸음이 온 날이 셋 미만이면 판정하지 않는다★ — 표본이 모자라면 말하지 않는다.
   */
  function looksLikeLocationBlocked(id){
    var ds = dailyOf(id);
    var walked = 0, reached = 0;
    ds.forEach(function(r){
      if (num(r.step_count) !== null && num(r.step_count) > 0) walked += 1;
      if (num(r.life_space_km2) !== null) reached += 1;
    });
    return walked >= 3 && reached === 0;
  }

  /**
   * ★★(S624 · 대표 지시) 기기는 살아 있는데 ★아무도 안 쓰는★ 기기를 짚는다★★

   * ★그런데 콘솔은 그 기기를 "이상 없음"이라고 적고 있었다★ — 그것이 거짓이다.

  var NEVER_USED_DAYS = 7;
  function looksNeverUsed(id){
    var ds = dailyOf(id).filter(function(r){ return num(r.step_count) !== null; });
    if (ds.length < NEVER_USED_DAYS) return false;
    var recent = ds.slice(-NEVER_USED_DAYS);
    for (var i = 0; i < recent.length; i++) {
      if (num(recent[i].step_count) > 0) return false;
      // ★화면을 한 번이라도 켜셨으면 "안 쓰는 기기"라고 하지 않는다★ —
      //   앉아만 계셔도 쓰고 계신 것이다(그건 걸음의 문제이지 기기의 문제가 아니다).
      if (num(recent[i].night_screen_on_count) > 0) return false;
      if (num(recent[i].travel_distance_m) > 0) return false;
    }
    return true;
  }

  function daysBetween(dateStr){
    if (!dateStr) return null;
    var d = new Date(dateStr + "T00:00:00");
    var t = new Date(); t.setHours(0, 0, 0, 0);
    return Math.round((t - d) / 86400000);
  }
  // ══════════════════════════════════════════════════════════════════════
  // ★★(S604) 걷기 지표 — 이 콘솔이 걷기 앱을 보는 눈★★
  // ══════════════════════════════════════════════════════════════════════

  function avgOf(arr){
    var v = arr.filter(function(x){ return x !== null && x !== undefined && !isNaN(x); });
    if (!v.length) return null;
    var t = 0; v.forEach(function(x){ t += x; });
    return t / v.length;

  /**
   * 하루치 행에서 보행 속도(m/s). 낼 수 없으면 null(0 이 아니다).

   */
  function daySpeed(r){
    if (!r) return null;
    var m = r.stroll_distance_m, min = r.stroll_minutes;
    if (!m || !min || min <= 0) return null;

    if (v < WALK.speedMin || v > WALK.speedMax) return null;   // 탈것·잡음은 버린다

  /**
   * 그 어르신의 걷기 요약. ★상태판·경보·CSV 가 모두 이 함수 하나를 쓴다.★

  function walkStats(id){
    var ds = dailyOf(id);
    if (!ds.length) return null;
    var recent = ds.slice(-WALK.days);
    var stepDays = ds.filter(function(r){ return r.step_count !== null && r.step_count !== undefined; });

    // ★안 걸으신 날수★ — 마지막으로 "한 걸음이라도" 있었던 날로부터 며칠인가.

    var lastWalked = null;

    }
    var idleDays = lastWalked ? daysBetween(lastWalked) : null;

    var base = ds.slice(-(WALK.days * 3), -WALK.days);
    var stepNow = avgOf(recent.map(function(r){ return r.step_count; }));
    var stepBase = avgOf(base.map(function(r){ return r.step_count; }));
    var stepDrop = (stepNow !== null && stepBase !== null && stepBase > 0)
      ? Math.round((stepNow - stepBase) / stepBase * 100) : null;

    return {
      days: recent.length,
      // ★★(S606) 잰 날 수 — ★"행이 온 날"과 "걸음을 잰 날"은 다르다★★

      //   2026-09-09 실측: 등록 21곳 중 7일 안에 걸음을 한 번이라도 잰 곳은 8곳뿐인데
      //   나머지 13곳도 행은 매일 오고 있었다. ★그 둘을 가르지 않으면 "설치는 됐는데
      //   앱이 안 돕니다"가 "걷기가 줄었습니다"로 읽힌다★(대표 지적 2026-09-08).
      measuredDays: recent.filter(function(r){ return r.step_count !== null && r.step_count !== undefined; }).length,
      lastWalked: lastWalked,
      idleDays: idleDays,
      steps: stepNow === null ? null : Math.round(stepNow),
      stepDrop: stepDrop,
      // ★★(S670) "산책" 열은 ★산책 원장★ 을 본다 — 이름과 자를 맞췄다★★
      //   종전에는 열 이름이 "산책"인데 값은 `walk_distance_m`(이동 레인 홉 자)였다.
      //   [실측 2026-09-20] 같은 날 같은 어르신이 ★912m(홉) 대 1,092m(원장)★.
      //   ★대표가 콘솔로 효과를 보시는데 앱과 숫자가 다르면 어느 쪽을 믿을지 모르게 된다.★
      walkM: avgOf(recent.map(function(r){ return r.stroll_distance_m; })),
      strollM: avgOf(recent.map(function(r){ return r.stroll_distance_m; })),
      // ★옛 자는 이름을 밝혀 남긴다★ — CSV 가 원자료로 함께 내보낸다(둘을 견줄 수 있게).
      hopM: avgOf(recent.map(function(r){ return r.walk_distance_m; })),
      strollMin: avgOf(recent.map(function(r){ return r.stroll_minutes; })),
      vehicleM: avgOf(recent.map(function(r){ return r.vehicle_distance_m; })),
      speed: avgOf(recent.map(daySpeed)),
      cv: avgOf(recent.map(function(r){ return r.gait_cv_percent; })),
      cadence: avgOf(recent.map(function(r){ return r.peak_cadence_steps_per_min; })),
      boutCount: avgOf(recent.map(function(r){ return r.walking_bout_count; })),
      boutMin: avgOf(recent.map(function(r){ return r.walking_bout_minutes; })),
      awayMin: avgOf(recent.map(function(r){ return r.away_from_home_minutes; })),
      outing: avgOf(recent.map(function(r){ return r.outing_count; })),
      firstHour: avgOf(recent.map(function(r){ return r.first_active_hour; })),
      lastHour: avgOf(recent.map(function(r){ return r.last_active_hour; })),
      nightSteps: avgOf(recent.map(function(r){ return r.night_steps; })),
      quietHours: avgOf(recent.map(function(r){ return r.night_longest_quiet_hours; })),
      activeHours: avgOf(recent.map(function(r){ return r.active_hour_count; }))

  //   ★null 은 ★빈 칸★ 으로 쓴다(0 으로 쓰면 받는 사람이 "측정했는데 0"으로 읽는다 —
  //     화면의 "측정 중"과 같은 원칙을 파일에서도 지킨다).
  //   ★맨 앞에 BOM 을 붙인다 — 없으면 엑셀이 한글을 깨뜨린다(실사용에서 가장 흔한 사고).
  //   ★값에 쉼표·따옴표·줄바꿈이 있어도 깨지지 않게 RFC4180 방식으로 감싼다.
  // ★CSV 상수★ — BOM 이 없으면 엑셀에서 한글이 깨져 제출 자료가 못 쓰게 된다.
  var BOM = String.fromCharCode(0xFEFF);
  var CRLF = String.fromCharCode(13) + String.fromCharCode(10);

  function csvCell(v){
    if (v === null || v === undefined) return "";
    var s = String(v);
    // ★수식 주입 방어: 별명·메모는 자유 입력이라 "=HYPERLINK(...)" 같은 값이 오면 엑셀이
    //   ★수식으로 실행★한다. 숫자가 아닌데 =,+,-,@,탭으로 시작하면 아포스트로피로 강등.
    //   ★순수 숫자는 제외 — OBV(-100)·z 는 음수가 정상값이라 문자로 만들면 분석이 깨진다.
    if (/^[=+\-@\t\r]/.test(s) && !/^-?\d+(\.\d+)?$/.test(s)) s = "'" + s;
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function downloadCsv(filename, headers, rows){
    var lines = [headers.map(csvCell).join(",")];
    rows.forEach(function(r){ lines.push(r.map(csvCell).join(",")); });
    var blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

    if (kind === "study_survey") {
      var instBy = {};
      instrumentsOf().forEach(function(x){ instBy[x.code] = x; });
      downloadCsv("텔로스_연구설문_" + today() + ".csv",
        ["가명", "척도코드", "척도", "시점주", "시행일", "점수", "최소", "최대", "방향", "기록자", "기록시각"],
        surveysOf().map(function(r){
          var x = instBy[r.instrument] || {};
          return [r.pseudonym, r.instrument, x.label, r.timepoint_week, r.measured_on,
                  fmtScore(r.total_score), fmtScore(x.min_score), fmtScore(x.max_score),
                  x.higher_is_better === undefined ? ""
                    : (x.higher_is_better ? "높을수록 좋음" : "낮을수록 좋음"),
                  r.recorded_by, String(r.recorded_at || "").slice(0, 19).replace("T", " ")];
        }));
      return;
    }
    // ★★(S606) 내려받기를 걷기 셋으로 줄였다 — 대표 지시 2026-09-09★★
    //   ★걷어낸 갈래★ = 일간 OBV · 경보 이력 · 특이사항(어르신 말씀에서 뽑은 것) ·
    //     회사 주간 집계 · 주차 어르신별 · 어르신 주차별. ★전부 소리·연결이 재료다.★
    //   ★남긴 셋★ = 상태판 · 어르신 일별 · 전체 원지표. ★열도 걷기만 남겼다.★
    //   ★화면과 파일이 같은 숫자를 말해야 한다★ — 정렬 순서까지 화면과 같게 맞춘다.
    if (kind === "elders") {
      downloadCsv("텔로스_어르신상태판_" + today() + ".csv",
        ["가명", "동네", "걸음 잰 날(7일 중)", "안 걸으신 날수", "마지막 걸음",
         "걸음(최근7일 평균)", "걸음 변화(앞 2주 대비 %)", "산책(m/일)", "보행속도(m/s)",
         "보행변동CV(%)", "집밖(분/일)", "첫 활동(시)", "마지막 활동(시)",
         "도착일수(7일 중)", "마지막 도착", "메모"],
        sortStatus(statusRows()).map(function(r){
          return [r.alias, r.region, r.w_meas, r.w_idle, (walkStats(r.id) || {}).lastWalked,
                  r.w_steps, r.w_drop, r.w_walkm, r.w_speed,
                  r.w_cv, r.w_away, r.w_first, r.w_last,
                  r.days_arrived_7d, r.last_arrival, r.note];
        }));
    } else if (kind === "elderDaily" || kind === "all") {
      // ★한 벌의 열 정의를 둘이 나눠 쓴다★ — 갈라 두면 한쪽만 고쳐져 두 파일이 어긋난다.
      var one = (kind === "elderDaily");
      var m2 = one ? rs[arg] : null;
      var head = (one ? ["가명"] : ["가명", "동네"]).concat(
        // ★(S670) "산책(분)"이 늘었다 — ★보행속도의 분모★ 다(산책(m) 의 짝).
        //   ★"걷기(m)"는 옛 자(이동 레인 홉)이고 남겨 둔다★ — 원자료로 견줄 수 있게.
        ["날짜", "걸음(보)", "걷기(m)", "탈것(m)", "산책(m)", "산책(분)", "이동거리(m)",
         "보행구간(회)", "보행구간(분)", "최고걸음빠르기(보/분)",
         // ★보행 속도 — 빈 칸은 "못 쟀다"이지 0 이 아니다(탈것이 섞였거나 보행 시간이 없는 날).
         "보행속도(m/s)", "걸음간격중앙값(ms)", "걸음고름CV(%)", "걸음고름표본수",
         // ★밤 움직임 3칸 — ★"수면"이 아니다★. 셋을 함께 내려받는다.
         "밤 걸음(보)", "밤 움직인 시간대(개)", "밤 조용한 최장(시간)",
         // ★활동 시간대 — ★분포 원본(24칸)까지 함께★. 요약은 되돌릴 수 없다.
         "활동 시간대 수(개)", "첫 활동(시)", "마지막 활동(시)", "시간대별 걸음 24칸",
         // ★(S605) 걸어서 닿은 범위 — 차로 다녀오신 곳은 안 센다(집과 걸어서 이어진 점만).
         "걸어서 닿은 범위(km2)",
         // ★(S604) 새벽 화면 — 0 = 지켜본 조용한 밤 / 빈 칸 = 그 밤을 못 쟀다.
         "새벽 화면(회)", "집밖 체류(분)", "외출(회)"]);
      var rowsSrc = one ? dailyOf(arg) : (DATA.daily || []);
      downloadCsv(one ? ("텔로스_" + (m2 ? m2.alias : "어르신") + "_일별걷기_" + today() + ".csv")
                      : ("텔로스_전체걷기원지표_최근" + (DATA.range_days || 14) + "일_" + today() + ".csv"),
        head,
        rowsSrc.map(function(r){
          // ★★(S622-b · 대표 지적) 파일에 36자 UUID 가 찍히던 자리★★
          //   [무엇이 있었나] `rs` 는 [roster] 이고 ★보름 넘게 조용한 곳은 거기서 빠진다★.
          //   그런데 일별 자료에는 그분들의 옛 행이 그대로 있어서 ★이름표를 못 찾고
          //   UUID 가 그대로 파일에 찍혔다★(대표가 받으신 CSV 에 실제로 세 분이 그랬다).
          //   ★그것은 가명보다 못한 이름표다★ — 누구인지도 모르면서 길기만 하다.
          //   [고침] ★감춰지지 않은 전체 명부에서 한 번 더 찾는다.★
          var mm = one ? m2 : (rs[r.elderly_id] || aliasOf(r.elderly_id));
          var head2 = one ? [mm ? mm.alias : arg]
                          : [mm ? mm.alias : r.elderly_id, mm ? mm.region : null];
          // ★★(S622) 빈칸을 갈라 적는다 — 「—」(해당 없음) / 「측정실패」★★
          //   대표 질문("왜 다 빈칸이지?")의 답이 이 한 줄에 있다:
          //   앞쪽 절반은 ★고장이 아니라 그 기능이 없던 시절★ 이다.
          //   ★판정은 화면과 같은 함수를 쓴다★(dayCsv → blankKind) — 갈라 두면
          //   화면과 파일이 다른 말을 하게 된다.
          var d = r.metric_date;
          // ★(S622-b) 그 어르신을 함께 넘긴다★ — 「앱 옛 판」과 「측정실패」를 가르는 축이다.
          var eid = one ? arg : r.elderly_id;
          var C = function(v, f){ return dayCsv(v, f, d, eid); };
          return head2.concat(
            [d, C(r.step_count, "step_count"), C(r.walk_distance_m, "walk_distance_m"),
             C(r.vehicle_distance_m, "vehicle_distance_m"),
             C(r.stroll_distance_m, "stroll_distance_m"),
             C(r.stroll_minutes, "stroll_minutes"),
             C(r.travel_distance_m, "travel_distance_m"),
             C(r.walking_bout_count, "walking_bout_count"),
             C(r.walking_bout_minutes, "walking_bout_minutes"),
             C(r.peak_cadence_steps_per_min, "peak_cadence_steps_per_min"),
             // ★보행 속도는 우리가 계산한 값이다★ — 재료가 있었는지로 가른다.
             //   ★(S670) 그 재료가 `stroll_distance_m`+`stroll_minutes` 로 바뀌었다★ —
             //   빈칸의 까닭을 옛 칸으로 설명하면 운영자가 엉뚱한 곳을 보게 된다.
             C(daySpeed(r), "stroll_minutes"),
             C(r.gait_step_interval_median_ms, "gait_step_interval_median_ms"),
             C(r.gait_cv_percent, "gait_cv_percent"),
             C(r.gait_interval_samples, "gait_interval_samples"),
             C(r.night_steps, "night_steps"), C(r.night_active_hours, "night_active_hours"),
             C(r.night_longest_quiet_hours, "night_longest_quiet_hours"),
             C(r.active_hour_count, "active_hour_count"),
             C(r.first_active_hour, "first_active_hour"),
             C(r.last_active_hour, "last_active_hour"),
             C(r.hourly_step_profile, "hourly_step_profile"),
             C(r.life_space_km2, "life_space_km2"),
             C(r.night_screen_on_count, "night_screen_on_count"),
             C(r.away_from_home_minutes, "away_from_home_minutes"),
             C(r.outing_count, "outing_count")]);
        }));
    }
  }

  // ── 라우팅 ───────────────────────────────────────────────────────────
  // ★★(S517) 뒤로 가기 — 대표 지적("뒤로 가기 누르면 바로 전페이지가 아니라 그냥 튕겨져서").
  //   종전엔 화면을 바꿔도 ★브라우저 이력을 남기지 않았다★ → 뒤로 가기가 콘솔 안의 이전
  //   화면이 아니라 ★콘솔 밖★ 으로 나갔다(그 앞이 로그인 시점이라 로그인 화면으로 보였다).
  //   이제 화면을 옮길 때마다 이력을 하나 쌓고, 뒤로 가기는 그 이력을 되짚는다.
  //   ★replace=true 는 이력을 쌓지 않는다★ — 첫 그림과 데이터 재적재처럼 "옮긴 것이
  //   아닌" 경우에 쓴다. 안 그러면 새로고침마다 이력이 늘어 뒤로 가기가 제자리걸음한다.
  // ★★(S534) 대표 지적 — "60초마다 갑자기 맨 위로 올라가서 중간을 못 읽는다".
  //   [원인] 한 함수가 ★두 가지 뜻★ 을 겸하고 있었다: "화면을 옮겼다"와 "같은 화면을
  //     다시 그렸다". 맨 위로 가는 것은 ★옮겼을 때만★ 옳은데, 60초 자동 갱신도 같은
  //     문을 지나느라 읽던 자리를 매번 빼앗았다.
  //   [처방] 뜻을 가른다 — ★replace=true 는 "다시 그린 것"이므로 스크롤을 건드리지
  //     않는다★. 이 값의 의미는 위 주석이 이미 "옮긴 것이 아닌 경우"라고 적어 두었고,
  //     스크롤만 그 뜻을 안 따르고 있었다.
  //   ★replace=true 호출부는 60초 갱신 하나뿐이고 첫 그림도 그 경로를 지난다★ —
  //     첫 그림은 이미 맨 위라 보존해도 보이는 것이 같다.
  function go(r, replace){
    route = r;
    try {
      if (replace) history.replaceState(r, "", location.pathname);
      else history.pushState(r, "", location.pathname);
    } catch(e){}
    // ★★(S534) 적는 중이면 아예 다시 그리지 않는다.
    //   다시 그리기는 화면을 통째로 갈아 끼우므로, 가명을 적던 중이면 ★적던 글자가
    //   사라진다★. 창구에서 여러 명을 등록할 때 60초마다 이것을 겪으면 못 쓴다.
    //   ★다음 주기에 그리면 된다★ — 데이터는 이미 받아 두었으므로 잃는 것이 없다.
    if (replace && typingInView()) return;
    // ★★(S534) 보안 화면은 자동 갱신이 다시 그리지 않는다.
    //   이 화면은 처음부터 끝까지 사람이 손으로 다루는 자리다(QR·비밀 열쇠·6자리 코드).
    //   60초마다 갈아 끼우면 ★등록하던 것이 통째로 사라진다★ — 대표가 실제로 겪었다
    //   ("준비하는 중"이 한참 있다가 그냥 원래 화면으로 돌아간다).
    if (replace && route && (route.view === "security" || route.view === "seats")) return;
    // ★다시 그리면 스크롤이 스스로 튄다(내용이 통째로 바뀌므로) → 그리기 전에 적어 두고
    //   그린 뒤에 되돌린다. 옮긴 것일 때는 종전대로 맨 위로.
    var keep = replace ? (window.pageYOffset || document.documentElement.scrollTop || 0) : 0;
    renderRoute();
    window.scrollTo(0, keep);
  }
  /** 지금 사람이 화면 안의 입력칸에 손을 대고 있는가(자동 갱신이 빼앗으면 안 되는 상태). */
  function typingInView(){
    var a = document.activeElement;
    if (!a) return false;
    var t = (a.tagName || "").toUpperCase();
    if (t !== "INPUT" && t !== "TEXTAREA" && t !== "SELECT") return false;
    var v = el("view");
    return !!(v && v.contains(a));
  }
  window.addEventListener("popstate", function(e){
    route = (e.state && e.state.view) ? e.state : { view: "overview" };
    renderRoute();
    window.scrollTo(0, 0);
  });
  // ★뒤로 가기로 되돌아왔을 때 화면이 ★로그인 상태로 얼어 있는 것★ 을 푼다.
  //   브라우저가 페이지를 통째로 캐시(bfcache)했다가 되살리면 자바스크립트가 다시 돌지
  //   않아, 세션은 멀쩡한데 그때 보이던 로그인 화면이 그대로 복원된다.
  //   ★그것이 "튕겨서 다시 로그인하라고 나온다"의 정체다★ — 세션을 다시 보고 판단한다.
  window.addEventListener("pageshow", function(e){
    if (!e.persisted) return;
    if (sess()) load(); else showLogin(null);
  });
  // ══════════════════════════════════════════════════════════════════════
  // ★★(S534) 보안 화면 — 로그인 방식 + 열람 기록 (대표 지시)
  // ══════════════════════════════════════════════════════════════════════
  //   ★두 가지를 한 화면에 둔다★: "못 들어오게 하는 것"과 "들어온 것을 남기는 것"은
  //   짝이다 — 앞은 막고, 뒤는 뚫린 뒤에 답한다.
  //
  //   ★막으려던 것★ = 콘솔이 소셜(구글)과 이메일+비밀번호 ★두 길★ 을 다 열어 두었고,
  //   ★비밀번호 길은 구글의 2단계를 지나지 않는다★. 약한 길 하나면 그리로 들어온다.
  //
  //   ★처방이 바뀐 이력(같은 세션 안에서)★ — 처음엔 콘솔에 TOTP(인증 앱 6자리)를
  //   붙였다. 맞는 길이지만 ★사람이 등록이라는 일을 해야 했고 그 흐름이 실제로 막혔다★
  //   (대표 실측). ★약한 길을 아예 닫으면 대표가 이미 쓰시는 구글 2단계가 그대로
  //   콘솔을 지킨다★ — 등록도, 인증 앱도, 6자리도 필요 없다.
  //   ★더 적은 부품으로 같은 것을 막는다.★
  //   판정은 서버(get-effect-dashboard)가 하고 이 화면은 ★그 사실을 보여 줄 뿐★ 이다
  //   — 화면이 스스로 판정하면 두 곳의 규칙이 갈라진다.

  function renderSecurity(){
    var prov = (DATA && DATA.login_provider) || "";
    var html = crumb([{ t: "개요", go: { view: "overview" } }, { t: "보안" }]);

    html += '<section><div class="sechead"><div><h2>로그인' +
      '<span class="tag">구글 전용</span></h2>' +
      '<div class="desc">이 콘솔은 <b>구글 로그인</b>으로만 열립니다. ' +
      '카카오·비밀번호로 들어오던 길은 닫았습니다 — 길이 여럿이면 <b>가장 약한 길의 안전</b>이 곧 이 콘솔의 안전이 됩니다.<br>' +
      '따라서 <b>구글 계정의 2단계 인증이 곧 이 콘솔의 자물쇠</b>입니다 — ' +
      '콘솔에 따로 등록하실 것은 없습니다.</div></div></div>' +
      '<div class="desc">지금 로그인: <b>' + esc(DATA && DATA.viewer || "") + '</b>' +
      (prov ? ' <span class="muted">· ' + esc(prov) + '</span>' : "") + "</div>" +
      '<div class="desc" style="margin-top:10px">★ 이 방어는 <b>구글 계정이 2단계로 지켜지고 있다</b>에 ' +
      '기댑니다. 그 계정이 뚫리면 이 콘솔도 함께 뚫립니다.</div></section>';

    html += '<section><div class="sechead"><div><h2>열람 기록' +
      '<span class="whose">최근 200줄</span></h2>' +
      '<div class="desc">누가 언제 몇 명분을 열었는지 남깁니다. ' +
      '<b>어르신 자료는 한 글자도 적지 않습니다</b>(가명조차) — 이 기록이 또 하나의 유출 대상이 되면 안 되기 때문입니다.<br>' +
      '사고가 났을 때 "무엇이 새었는가"를 답할 수 있는 유일한 자료입니다.</div></div></div>' +
      '<div id="auditBox" class="desc">불러오는 중…</div></section>';

    // ★★(S596 · 대표 지시 2026-09-05) 위치정보 취급대장★★
    //   위치정보법 제16조 제2항 = "위치정보 수집·이용·제공사실 확인자료를 위치정보

  // ★내려받기★ — 감독기관이 요구하면 그 자리에서 내밀 수 있어야 한다.
  function downloadLocationCsv(){
    if (!LOC_ROWS.length) { alert("내려받을 기록이 없습니다."); return; }
    var head = ["날짜", "어르신(가명)", "수집", "이용", "제공", "제공받은곳", "목적"];
    var lines = [head.join(",")];
    LOC_ROWS.forEach(function(a){
      lines.push([
        csvCell(a.log_date), csvCell(a.alias), csvCell(a.collect_count),
        csvCell(a.use_count), csvCell(a.provide_count),
        csvCell(a.provide_to || ""), csvCell(a.purpose || "")
      ].join(","));
    });
    // ★BOM 을 붙인다★ — 없으면 엑셀에서 한글이 깨진다(그러면 제출 자료가 못 쓰게 된다).
    var blob = new Blob([BOM + lines.join(CRLF)], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url;
    link.download = "위치정보_취급대장_" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

  //   자동 갱신이 이 화면을 다시 그리지 않는 것은 보안 화면과 같은 이유다(적는 화면).

  var END_SOON_DAYS = 30;

  function ymd(iso){ return iso ? String(iso).slice(0, 10) : ""; }
  /** 오늘부터 그날까지 남은 날(모르면 null · 지났으면 음수). */
  function daysLeft(iso){
    if (!iso) return null;
    var t = Date.parse(String(iso));
    if (isNaN(t)) return null;
    return Math.ceil((t - Date.now()) / 86400000);
  }
  function leftText(iso){
    var d = daysLeft(iso);
    if (d == null) return "기간 없음";
    return d < 0 ? "끝남" : "남은 " + d + "일";
  }
  function seatBar(used, total){
    var pct = total > 0 ? Math.min(100, Math.round(used / total * 100)) : 0;

  }

        b.addEventListener("click", function(){
          var id = b.getAttribute("data-detail");
          if (openDetailId === id) { closeContractDetail(); return; }   // 같은 단추를 다시 누르면 닫는다
          openContractDetail(id);
          loadContracts();
        });
      });
      // 관리 창이 열려 있었으면 새 숫자로 다시 그린다
      if (openDetailId) openContractDetail(openDetailId);
    });
  }

  // ══════════════════════════════════════════════════════════════════════
  // ★★(S697 · 대표 지시) 기관 관리 창 — 기관 콘솔에서 일어나는 일을 회사 콘솔에서 보고 고친다★★
  //   대표 원문 = "담당자 칸 추가 … 기관콘솔로 연결링크 … 회원수 증감기능, 여러가지 확인기능 회사콘솔에서"
  //   → (다시 손봄) "관리 열어서 보는 화면이 조금 보기 난잡해보여. 직관적으로 … 쉽게 편집이 가능하도록"
  //   짜임 = 머리(이름·열기·닫기) → 큰 칸 둘(인원 · 기간 — 그 자리에서 고친다) → 탭 셋(어르신 · 담당자 · 기록)
  //   ★셈과 문지기는 서버(sql 172·174 · 관리자만)★ — 화면은 받은 것을 그린다.
  //   ★번호 자체는 오지 않는다★ — 관리번호와 "번호 있음/없음"만.
  // ══════════════════════════════════════════════════════════════════════
  var GOV_URL = "https://www.telos.it.kr/gov/";
  var openDetailId = null;
  var detailTab = "elders";
  var ADD_RESULT_LABEL = {
    ok: "넣음", already: "이미 소속", bad_code: "번호 틀림·만료", other_contract: "다른 기관 소속",
    no_seat: "인원 다 참", contract_ended: "기간 끝남", alias_too_long: "가명 너무 김",
  };
  var GOV_ACTION_LABEL = {
    "gov:overview": "목록을 봄", "gov:cohort": "측정 요약을 봄", "gov:report": "보고서를 봄",
    "gov:followup": "연락·확인 기록을 남김", "gov:mgmt_no": "관리번호를 적음",
    "gov:remove_elder": "어르신을 기관에서 뺌",
  };
  function shortTime(iso){
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return esc(iso);
    function p(n){ return (n < 10 ? "0" : "") + n; }
    return (d.getMonth() + 1) + "/" + d.getDate() + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  function closeContractDetail(){
    openDetailId = null;
    var box = el("contractDetail"); if (box) box.innerHTML = "";
    loadContracts();
  }

  function openContractDetail(id){
    if (openDetailId !== id) detailTab = "elders";
    openDetailId = id;
    var box = el("contractDetail"); if (!box) return;
    if (!box.innerHTML) box.innerHTML = '<div class="ctp"><div class="muted">기관을 불러오는 중…</div></div>';
    rpc("console_contract_detail", { p_contract_id: id }).then(function(r){
      if (openDetailId !== id) return;   // 그사이 다른 기관을 열었다
      if (!r.ok || !r.body || !r.body.contract) { box.innerHTML = '<div class="ctp">불러오지 못했습니다: ' + esc(r.raw || "") + "</div>"; return; }
      renderContractDetail(r.body);
    });
  }

  function renderContractDetail(d){
    var c = d.contract;
    var box = el("contractDetail");
    var active = d.elders.filter(function(e){ return !e.archived; });
    var archived = d.elders.length - active.length;
    var used = Number(c.seats_used) || 0, total = Number(c.seat_total) || 0;
    var dl = daysLeft(c.ends_at);

    var h = '<div class="ctp">';
    // ── 머리 ──
    h += '<div class="ctp-head"><div>' +
      '<div class="ctp-name">' + esc(c.name) + ' <button class="link" id="cdRename">이름 바꾸기</button></div>' +
      '<div class="muted">' + esc(KIND_LABEL[c.kind] || c.kind) + " · 기관 담당자 " + d.staff.length + "명 · 소속 어르신 " + active.length + "분" +
        (archived > 0 ? " · 보관 " + archived + "분(기관 화면에 안 보임)" : "") + "</div></div>" +
      '<div class="ctp-actions"><a class="btn" href="' + GOV_URL + "?contract=" + encodeURIComponent(c.id) + "&name=" + encodeURIComponent(c.name) + '" target="_blank" rel="noopener">기관이 보는 화면 열기 ↗</a>' +
      '<button id="cdClose">닫기</button></div></div>';

    // ── 큰 칸 둘: 인원 · 기간 ──
    h += '<div class="ctp-tiles">' +
      '<div class="ctp-tile"><div class="k">인원</div>' +
        '<div class="v">' + used + ' <span class="muted">/ ' + total + "명</span></div>" + seatBar(used, total) +
        '<div class="ctp-edit"><button id="cdMinus">−</button><input id="cdTotal" type="number" min="1" value="' + total + '">' +
        '<button id="cdPlus">+</button><button class="primary" id="cdSaveTotal" disabled>저장</button></div>' +
        '<div class="s" id="cdTotalMsg">쓰는 인원(' + used + "명)보다 적게는 줄일 수 없습니다.</div></div>" +
      '<div class="ctp-tile"><div class="k">기간</div>' +
        '<div class="v' + (dl != null && dl <= END_SOON_DAYS ? " warn" : "") + '">' + (c.ends_at ? esc(ymd(c.ends_at)) + "까지" : "기간 없음") + "</div>" +
        '<div class="s">시작 ' + esc(ymd(c.starts_at)) + " · " + leftText(c.ends_at) + "</div>" +
        '<div class="ctp-edit"><input id="cdEnd" type="date" value="' + esc(ymd(c.ends_at)) + '">' +
        '<button class="primary" id="cdSaveEnd" disabled>저장</button><button id="cdPlusYear">1년 늘리기</button></div>' +
        '<div class="s" id="cdEndMsg">만료일이 지나면 기관 콘솔에서 어르신을 더 넣을 수 없습니다.</div></div>' +
      "</div>";

    // ── 탭 셋 ──
    var logCount = d.attempts.length + d.activity.length;
    h += '<div class="ctp-tabs">' +
      '<button data-tab="elders"' + (detailTab === "elders" ? ' class="on"' : "") + ">소속 어르신 " + active.length + "</button>" +
      '<button data-tab="staff"' + (detailTab === "staff" ? ' class="on"' : "") + ">기관 담당자 " + d.staff.length + (d.staff.length ? "" : ' <span class="warn">!</span>') + "</button>" +
      '<button data-tab="log"' + (detailTab === "log" ? ' class="on"' : "") + ">활동 기록 " + logCount + "</button></div>";

    h += '<div class="ctp-body">';
    if (detailTab === "elders") {
      h += '<div class="s muted" style="margin-bottom:8px">어르신은 기관 담당자가 기관 콘솔 「어르신 추가」에서 연동 번호로 넣습니다.' +
        (archived ? " 보관함에 계신 " + archived + "분은 기관 콘솔에 안 보입니다(회색)." : "") + "</div>";
      h += '<table class="ctp-table"><tr><th>가명</th><th>들어온 날</th><th>마지막 걸음</th><th>관리번호</th><th>연락처</th><th>자녀</th><th></th></tr>';
      if (!d.elders.length) h += '<tr><td colspan="7" class="muted">아직 없습니다.</td></tr>';
      d.elders.forEach(function(e){
        var contact = [];
        if (e.elder_phone) contact.push("어르신"); else if (e.elder_declined) contact.push('<span class="muted">어르신 거절</span>');
        if (e.guardian_phones) contact.push("보호자 " + e.guardian_phones);
        h += "<tr" + (e.archived ? ' class="dim"' : "") + "><td><b>" + esc(e.alias) + "</b>" + (e.archived ? " (보관)" : "") + "</td>" +
          "<td>" + esc(ymd(e.activated_at) || "—") + "</td>" +
          "<td>" + esc(e.last_day || "아직 없음") + "</td>" +
          "<td>" + esc(e.mgmt_no || "—") + "</td>" +
          "<td>" + (contact.length ? contact.join(" · ") : '<span class="muted">없음</span>') + "</td>" +
          "<td>" + (e.guardians ? e.guardians + "명" : '<span class="muted">없음</span>') + "</td>" +
          '<td><button class="danger small" data-elder-rm="' + esc(e.id) + '" data-alias="' + esc(e.alias) + '">기관에서 빼기</button></td></tr>';
      });
      h += "</table>";
    } else if (detailTab === "staff") {
      h += '<div class="ctp-add first"><b>기관 담당자 넣기</b><input id="cdStaffEmail" placeholder="담당자의 구글 이메일 (예: kim@gmail.com)" style="width:280px">' +
        '<select id="cdStaffRole"><option value="staff">담당자</option><option value="manager">책임자</option></select>' +
        '<input id="cdStaffNote" placeholder="메모(선택 · 예: 방문간호팀 김○○)" style="width:220px">' +
        '<button class="primary" id="cdStaffAdd">넣기</button><span id="cdStaffMsg" class="muted"></span>' +
        '<div class="muted" style="width:100%">넣은 사람은 <b>www.telos.it.kr/gov</b> 에 이 구글 이메일로 로그인하면 <b>' + esc(c.name) + '</b> 어르신만 봅니다. ' +
        '회사 콘솔에는 들어올 수 없습니다. (책임자·담당자는 지금 하는 일이 같고, 누가 책임자인지 표시만 합니다.)</div></div>';
      h += '<table class="ctp-table"><tr><th>구글 이메일</th><th>역할</th><th>메모</th><th>넣은 날</th><th></th></tr>';
      if (!d.staff.length) h += '<tr><td colspan="5" class="warn">아직 없습니다 — 위에서 넣어야 이 기관이 기관 콘솔을 쓸 수 있습니다.</td></tr>';
      d.staff.forEach(function(s){
        h += "<tr><td><b>" + esc(s.email) + "</b></td>" +
          '<td><select data-staff-role="' + esc(s.email) + '" data-note="' + esc(s.note || "") + '">' +
            '<option value="staff"' + (s.role === "staff" ? " selected" : "") + ">담당자</option>" +
            '<option value="manager"' + (s.role === "manager" ? " selected" : "") + ">책임자</option></select></td>" +
          "<td>" + esc(s.note || "") + "</td><td>" + esc(ymd(s.created_at)) + "</td>" +
          '<td><button class="danger small" data-staff-rm="' + esc(s.email) + '">빼기</button></td></tr>';
      });
      h += "</table>";
    } else {
      // 두 기록을 시간순으로 한 줄에 — 어르신 추가 시도 + 기관 콘솔 활동
      var rows = d.attempts.map(function(a){
        return { at: a.at, who: a.email, what: "어르신 추가 — " + (ADD_RESULT_LABEL[a.result] || a.result), bad: !a.ok };
      }).concat(d.activity.filter(function(a){ return a.action !== "gov:add_elder"; }).map(function(a){
        return { at: a.at, who: a.email, what: (GOV_ACTION_LABEL[a.action] || a.action) + (a.n ? " (" + a.n + "분)" : ""), bad: false };
      })).sort(function(x, y){ return String(y.at).localeCompare(String(x.at)); });
      h += '<div class="s muted" style="margin-bottom:8px">기관 콘솔에서 누가 언제 무엇을 했는지입니다(최근 80건 · 어르신 자료는 적히지 않습니다). 담당자 연락·확인 기록 누적 ' + esc(d.followups) + "건.</div>";
      h += '<table class="ctp-table"><tr><th>때</th><th>누가</th><th>한 일</th></tr>';
      if (!rows.length) h += '<tr><td colspan="3" class="muted">아직 없습니다.</td></tr>';
      rows.forEach(function(x){
        h += "<tr><td>" + shortTime(x.at) + "</td><td>" + esc(x.who) + "</td><td" + (x.bad ? ' class="warn"' : "") + ">" + esc(x.what) + "</td></tr>";
      });
      h += "</table>";
    }
    h += "</div></div>";

    box.innerHTML = h;
    bindContractDetail(c);
  }

  function bindContractDetail(c){
    function refresh(){ loadContracts(); loadSeats(); }   // loadContracts 가 열린 관리 창을 다시 그린다
    el("cdClose").onclick = closeContractDetail;
    Array.prototype.forEach.call(document.querySelectorAll(".ctp-tabs [data-tab]"), function(b){
      b.onclick = function(){ detailTab = b.getAttribute("data-tab"); openContractDetail(c.id); };
    });
    el("cdRename").onclick = function(){
      var v = prompt("기관 이름(40자까지 · 기관 콘솔과 보고서에 그대로 나옵니다)", c.name);
      if (v === null || !v.trim() || v.trim() === c.name) return;
      rpc("console_rename_contract", { p_contract_id: c.id, p_name: v.trim() }).then(function(r){
        if (r.ok && r.body === "ok") refresh(); else alert("바꾸지 못했습니다: " + (r.body || r.raw || ""));
      });
    };

    // 인원 — 바뀌었을 때만 「저장」이 켜진다
    var totalIn = el("cdTotal"), saveTotal = el("cdSaveTotal");
    function totalChanged(){ saveTotal.disabled = Number(totalIn.value) === Number(c.seat_total) || !(Number(totalIn.value) >= 1); }
    totalIn.oninput = totalChanged;
    el("cdMinus").onclick = function(){ totalIn.value = Math.max(1, (Number(totalIn.value) || 0) - 1); totalChanged(); };
    el("cdPlus").onclick = function(){ totalIn.value = (Number(totalIn.value) || 0) + 1; totalChanged(); };
    saveTotal.onclick = function(){
      var n = Number(totalIn.value), msg = el("cdTotalMsg");
      if (n < Number(c.seats_used)) { msg.innerHTML = '<span class="warn">쓰는 인원(' + c.seats_used + "명)보다 적게는 줄일 수 없습니다.</span>"; return; }
      saveTotal.disabled = true; msg.textContent = "저장하는 중…";
      rpc("console_update_contract", { p_contract_id: c.id, p_seat_total: n }).then(function(r){
        if (r.ok) refresh();
        else msg.innerHTML = '<span class="warn">' + (/SEAT_TOTAL_BELOW_USED/.test(r.raw || "") ? "쓰는 인원보다 적게는 줄일 수 없습니다." : "저장하지 못했습니다: " + esc(r.raw || "")) + "</span>";
      });
    };

    // 기간 — 날짜를 고르면 「저장」이 켜진다 · 「1년 늘리기」는 곧바로 저장
    var endIn = el("cdEnd"), saveEnd = el("cdSaveEnd");
    endIn.oninput = function(){ saveEnd.disabled = !endIn.value || endIn.value === ymd(c.ends_at); };
    function saveEndDate(v){
      var msg = el("cdEndMsg");
      msg.textContent = "저장하는 중…";
      rpc("console_set_contract_end", { p_contract_id: c.id, p_ends: v }).then(function(r){
        if (r.ok && r.body === "ok") refresh();
        else msg.innerHTML = '<span class="warn">' + (r.body === "past_date" ? "오늘 이후 날짜를 골라 주세요." : "저장하지 못했습니다: " + esc(r.body || r.raw || "")) + "</span>";
      });
    }
    saveEnd.onclick = function(){ saveEndDate(endIn.value); };
    el("cdPlusYear").onclick = function(){
      var base = c.ends_at && daysLeft(c.ends_at) > 0 ? new Date(c.ends_at) : new Date();
      base.setFullYear(base.getFullYear() + 1);
      var v = base.getFullYear() + "-" + ("0" + (base.getMonth() + 1)).slice(-2) + "-" + ("0" + base.getDate()).slice(-2);
      if (!confirm("만료일을 " + v + " 로 늘립니다.")) return;
      saveEndDate(v);
    };

    // 담당자
    var addBtn = el("cdStaffAdd");
    if (addBtn) addBtn.onclick = function(){
      var email = el("cdStaffEmail").value.trim(), msg = el("cdStaffMsg");
      if (!email) { msg.textContent = "이메일을 적어 주세요."; return; }
      msg.textContent = "넣는 중…";
      rpc("console_set_contract_staff", { p_contract_id: c.id, p_email: email, p_role: el("cdStaffRole").value, p_remove: false, p_note: el("cdStaffNote").value.trim() || null })
        .then(function(r){
          if (r.ok && r.body === "ok") refresh();
          else msg.innerHTML = '<span class="warn">' + (r.body === "bad_email" ? "이메일 모양이 아닙니다." : "넣지 못했습니다: " + esc(r.body || r.raw || "")) + "</span>";
        });
    };
    Array.prototype.forEach.call(document.querySelectorAll("[data-staff-role]"), function(s){
      s.onchange = function(){
        rpc("console_set_contract_staff", { p_contract_id: c.id, p_email: s.getAttribute("data-staff-role"), p_role: s.value, p_remove: false, p_note: null })
          .then(function(r){ if (r.ok && r.body === "ok") refresh(); else alert("바꾸지 못했습니다: " + (r.body || r.raw || "")); });
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-staff-rm]"), function(b){
      b.onclick = function(){
        var email = b.getAttribute("data-staff-rm");
        if (!confirm(email + " 를 이 기관 담당자에서 뺍니다. 그 계정은 이 기관을 더 이상 못 봅니다.")) return;
        rpc("console_set_contract_staff", { p_contract_id: c.id, p_email: email, p_role: null, p_remove: true, p_note: null }).then(function(r){
          if (r.ok) refresh(); else alert("빼지 못했습니다: " + (r.raw || ""));
        });
      };
    });

    // 어르신
    Array.prototype.forEach.call(document.querySelectorAll("[data-elder-rm]"), function(b){
      b.onclick = function(){ removeFromContract(b.getAttribute("data-elder-rm"), b.getAttribute("data-alias"), c.name, c.id); };
    });
  }

  /** 기관에서 빼기 — 관리 창과 「어르신별 소속」이 같은 확인 문구·같은 길을 쓴다. */
  function removeFromContract(elderlyId, alias, contractName, contractId){
    if (!confirm(alias + " 님을 " + contractName + " 에서 뺍니다.\n" +
                 "· 이 기관의 관리번호와 연락처(어르신·보호자 번호)는 곧바로 지워집니다.\n" +
                 "· 걸음 기록과 자녀 연결은 그대로 남습니다.\n" +
                 "· 다시 넣으려면 어르신 폰의 연동 번호가 필요합니다.")) return;
    var done = function(r){
      if (r.ok && (r.body === "ok" || r.body === null)) { loadContracts(); loadSeats(); }
      else alert("빼지 못했습니다: " + (r.body || r.raw || ""));
    };
    if (contractId) rpc("console_remove_elder_from_contract", { p_elderly_id: elderlyId, p_contract_id: contractId }).then(done);
    else rpc("console_set_seat", { p_elderly_id: elderlyId, p_active: false }).then(done);   // (173) 끄기 = 기관에서 빼기
  }

  function createContract(){
    var name = el("scName").value.trim();
    var kind = el("scKind").value;
    var total = Number(el("scTotal").value);
    var months = Number(el("scMonths").value) || 12;   // (173) 기본 1년
    var msg = el("scMsg");
    if (!name) { msg.textContent = "이름을 적어 주세요."; return; }
    if (!(total > 0)) { msg.textContent = "인원을 적어 주세요."; return; }
    msg.textContent = "만드는 중…";
    rpc("console_create_contract", { p_name: name, p_kind: kind, p_seat_total: total, p_months: months })
      .then(function(r){
        if (!r.ok || !Array.isArray(r.body) || !r.body.length) { msg.textContent = "실패: " + (r.raw || ""); return; }
        var row = r.body[0];
        msg.textContent = "만들었습니다 — 이어서 담당자를 넣어 주세요.";
        el("scName").value = "";
        detailTab = "staff";
        openDetailId = row.id;
        el("contractDetail").innerHTML = "";
        loadContracts();
      });
  }

  // ── 이용권 코드(자녀 앱 Pro) — sql 176 ─────────────────────────────────
  var PASS_KIND = { gift: "선물", benefit: "기관 혜택" };
  function bindPassCodes(){
    var kind = el("pcKind");
    function sync(){
      var isB = kind.value === "benefit";
      el("pcContractWrap").style.display = isB ? "" : "none";
      el("pcNoteWrap").style.display = isB ? "none" : "";
      el("pcDays").value = isB ? 180 : 365;
      el("pcCount").max = isB ? 10000 : 200;
    }
    kind.onchange = sync;
    el("pcIssue").onclick = issuePassCodes;
    el("pcFilter").onchange = loadPassCodes;
    el("pcCopy").onclick = function(){
      var t = el("pcOut"); t.select();
      try { navigator.clipboard.writeText(t.value); el("pcMsg").textContent = "복사했습니다."; } catch(e) { document.execCommand("copy"); }
    };
    loadPassCodes();

  function issuePassCodes(){
    var isB = el("pcKind").value === "benefit";
    var cnt = Number(el("pcCount").value), days = Number(el("pcDays").value), msg = el("pcMsg");
    var max = isB ? 10000 : 200;
    if (!(cnt >= 1 && cnt <= max)) { msg.textContent = "개수는 1~" + max + "장입니다."; return; }
    if (!(days >= 1 && days <= 366)) { msg.textContent = "Pro 기간은 1~366일입니다."; return; }
    if (isB && !el("bcContract").value) { msg.textContent = "기관을 먼저 만들어 주세요."; return; }
    msg.textContent = "만드는 중…";
    var call = isB
      ? rpc("console_issue_benefit_codes", { p_contract_id: el("bcContract").value, p_count: cnt, p_duration_days: days })
      : rpc("console_issue_pro_gift_codes", { p_count: cnt, p_duration_days: days, p_note: el("pcNote").value.trim() || null });
    call.then(function(r){
      if (!r.ok || !Array.isArray(r.body)) { msg.textContent = "만들지 못했습니다: " + (r.raw || ""); return; }
      var codes = r.body.map(function(x){ return typeof x === "string" ? x : (x.code || x.console_issue_pro_gift_codes || ""); });
      el("pcOut").value = codes.join(String.fromCharCode(10));
      el("pcOutWrap").style.display = "";
      msg.textContent = codes.length + "장 만들었습니다.";
      loadPassCodes();
    });
  }

  function loadPassCodes(){
    rpc("console_list_pass_codes", { p_limit: 2000 }).then(function(r){
      var box = el("pcBox"); if (!box) return;
      if (!r.ok || !Array.isArray(r.body)) { box.textContent = "불러오지 못했습니다: " + (r.raw || ""); return; }
      var f = (el("pcFilter") || {}).value || "all";
      var rows = r.body.filter(function(c){
        if (f === "unused") return !c.redeemed_at;
        if (f === "used") return !!c.redeemed_at;
        if (f === "gift" || f === "benefit") return c.kind === f;
        return true;
      });
      if (!rows.length) { box.textContent = "없습니다."; return; }
      var h = '<div class="tablewrap"><table class="ctp-table"><tr><th>코드</th><th>종류</th><th>기관</th><th>Pro 기간</th><th>만든 날</th><th>쓴 날</th><th>쓴 자녀 계정</th><th>Pro 끝</th><th>메모</th></tr>';
      rows.forEach(function(c){
        h += "<tr><td style='font-family:monospace'>" + esc(c.code) + "</td><td>" + esc(PASS_KIND[c.kind] || c.kind) + "</td>" +
          "<td>" + esc(c.contract_name || "—") + "</td><td>" + esc(c.duration_days) + "일</td>" +
          "<td>" + esc(ymd(c.created_at)) + "</td>" +
          "<td>" + (c.redeemed_at ? esc(ymd(c.redeemed_at)) : '<span class="muted">안 씀</span>') + "</td>" +
          "<td>" + esc(c.redeemed_email || "—") + "</td><td>" + (c.pro_until ? esc(ymd(c.pro_until)) : "—") + "</td>" +
          "<td>" + esc(c.note || "") + "</td></tr>";
      });
      box.innerHTML = h + "</table></div>";
    });
  }

  // ── 어르신별 소속 — sql 176 console_list_memberships · 정렬·소속 고르기는 화면이 한다 ──
  var MS = { rows: [], sort: "contract", dir: 1 };
  var MS_COLS = [
    { k: "alias", t: "가명" }, { k: "region", t: "동네" }, { k: "contract", t: "소속" },
    { k: "activated", t: "들어온 날" }, { k: "until", t: "만료" }, { k: "last", t: "마지막 걸음" },
    { k: "guardians", t: "자녀 연결" }, { k: "mgmt", t: "관리번호" },
  ];
  function msVal(e, k){
    switch (k) {
      case "alias": return (e.alias || "").toLowerCase();
      case "region": return (e.region || "").toLowerCase();
      case "contract": return e.contract_name ? "0" + e.contract_name : "1";   // 소속 있는 분이 먼저
      case "activated": return e.seat_activated_at || "";
      case "until": return e.seat_valid_until || "";
      case "last": return e.last_day || "";
      case "guardians": return Number(e.guardians) || 0;
      case "mgmt": return e.mgmt_no || "";
    }
    return "";
  }
  function loadSeats(){
    rpc("console_list_memberships", {}).then(function(r){
      var box = el("seatBox"); if (!box) return;
      if (!r.ok || !Array.isArray(r.body)) { box.textContent = "불러오지 못했습니다: " + (r.raw || ""); return; }
      MS.rows = r.body;
      // 소속 고르기 — 지금 있는 기관 이름으로 채운다(고른 값은 지킨다)
      var sel = el("msFilter"), keep = sel.value, names = {};
      r.body.forEach(function(e){ if (e.contract_id) names[e.contract_id] = e.contract_name; });
      sel.innerHTML = '<option value="all">전체</option>' +
        Object.keys(names).sort(function(a, b){ return String(names[a]).localeCompare(String(names[b])); })
          .map(function(id){
            var n = r.body.filter(function(e){ return e.contract_id === id && !e.archived; }).length;
            return '<option value="' + esc(id) + '">' + esc(names[id]) + " (" + n + "분)</option>";
          }).join("") +
        '<option value="none">기관 없음</option>';
      if ([].some.call(sel.options, function(o){ return o.value === keep; })) sel.value = keep;
      sel.onchange = drawSeats;
      el("msArchived").onchange = drawSeats;
      drawSeats();
    });
  }
  function drawSeats(){
    var box = el("seatBox"); if (!box) return;
    var f = el("msFilter").value, withArch = el("msArchived").checked;
    var rows = MS.rows.filter(function(e){
      if (!withArch && e.archived) return false;
      if (f === "none") return !e.contract_id;
      if (f !== "all") return e.contract_id === f;
      return true;
    }).sort(function(a, b){
      var x = msVal(a, MS.sort), y = msVal(b, MS.sort);
      if (x < y) return -MS.dir; if (x > y) return MS.dir;
      return String(a.alias || "").localeCompare(String(b.alias || ""));
    });
    el("msCount").textContent = rows.length + "분";
    var h = '<div class="tablewrap"><table class="ctp-table ms-table"><tr>' + MS_COLS.map(function(c){
      var on = MS.sort === c.k;
      return '<th data-sort="' + c.k + '" style="cursor:pointer;user-select:none" title="눌러서 정렬">' + c.t + (on ? (MS.dir > 0 ? " ▲" : " ▼") : ' <span class="muted">↕</span>') + "</th>";
    }).join("") + "<th></th></tr>";
    if (!rows.length) h += '<tr><td colspan="9" class="muted">없습니다.</td></tr>';
    rows.forEach(function(e){
      h += "<tr" + (e.archived ? ' class="dim"' : "") + "><td><b>" + esc(e.alias || "") + "</b>" + (e.is_internal ? ' <span class="muted">(내부)</span>' : "") + (e.archived ? " (보관)" : "") + "</td>" +
        "<td>" + esc(e.region || "—") + "</td>" +
        "<td>" + (e.contract_name ? esc(e.contract_name) : (e.seat_active ? '<span class="muted">좌석만(' + esc(e.seat_funded_by || "manual") + ")</span>" : '<span class="muted">없음</span>')) + "</td>" +
        "<td>" + (e.contract_id ? esc(ymd(e.seat_activated_at)) : "—") + "</td>" +
        "<td>" + (e.seat_active && e.seat_valid_until ? esc(ymd(e.seat_valid_until)) : "—") + "</td>" +
        "<td>" + esc(e.last_day || "아직 없음") + "</td>" +
        "<td>" + (e.guardians ? e.guardians + "명" : '<span class="muted">없음</span>') + "</td>" +
        "<td>" + esc(e.mgmt_no || "—") + "</td>" +
        "<td>" + (e.seat_active
          ? '<button class="danger small" data-leave="' + esc(e.elderly_id) + '" data-alias="' + esc(e.alias || "") + '" data-cname="' + esc(e.contract_name || "좌석") + '" data-cid="' + esc(e.contract_id || "") + '">' + (e.contract_id ? "기관에서 빼기" : "좌석 끄기") + "</button>"
          : "") + "</td></tr>";
    });
    box.innerHTML = h + "</table></div>";
    Array.prototype.forEach.call(box.querySelectorAll("th[data-sort]"), function(th){
      th.onclick = function(){
        var k = th.getAttribute("data-sort");
        if (MS.sort === k) MS.dir = -MS.dir; else { MS.sort = k; MS.dir = (k === "last" || k === "activated" || k === "guardians") ? -1 : 1; }
        drawSeats();
      };
    });
    Array.prototype.forEach.call(box.querySelectorAll("[data-leave]"), function(b){
      // ★(S697) 좌석 끄기 = 기관에서 빼기(sql 173) · 기관이 있으면 기관 함수로(sql 172)★
      b.onclick = function(){ removeFromContract(b.getAttribute("data-leave"), b.getAttribute("data-alias"), b.getAttribute("data-cname"), b.getAttribute("data-cid") || null); };
    });
  }

  // ── 회사 성장판 (S615 · 대표 지시 "회사 성장판 콘솔 작업은 진행해") ────────
  //  ★★무엇을 묻는 화면인가★★
  //    실증 지표판이 "어르신이 나아지고 있는가"를 묻는다면, 이 화면은
  //    ★"회사가 크고 있는가"★ 를 묻는다. 그래서 따로 선다.
  //
  //  ★★셈은 여기서 하지 않는다★★
  //    숫자는 전부 서버(sql 130 growth_board)가 낸 것을 ★그대로★ 그린다.
  //    화면이 다시 세면 ★두 곳이 다른 숫자를 말한다★.
  //
  //  ★★안 센 것을 함께 말한다★★
  //    내부 시험 기기는 안 센다 — 그런데 그 사실을 안 적으면 대표가
  //    "설치가 왜 이것뿐인가"를 결함으로 오해하신다. 그래서 제외 수를 같이 적는다.
  //
  //  ★★예상 매출은 아직 못 셈한다★★
  //    좌석 단가가 ★대표 결정 사항이고 아직 안 정해졌다★.
  //    ★모르는 것을 0 으로 적지 않는다★ — 정해지면 SEAT_PRICE 한 줄만 바꾼다.
  //  ★★좌석 단가 = 2,900원 (대표 확인 2026-09-12)★★
  //    ★좌석당 B2G 과금은 S595 에서 폐기됐다★("구독료 없고 … 좌석당 뭐 돈 없고").
  //    지금 매출선은 ★자녀 앱 Pro 구독 하나★ 이고 그 값이 ★자동갱신 월 2,900원★ 이다
  //    (연 30,000원 = 매달 2,500원꼴 · 2026-09-12 개정).
  //    ★그래서 좌석 하나 = 어르신 한 분 = 자녀 한 분의 구독으로 본다.★
  var SEAT_PRICE = 2900;   // 원/좌석·월 (자녀 Pro 자동갱신 월)

  function growthFetch(){
    el("liveText").textContent = "성장판 불러오는 중…";

  function pct(x){
    // ★모르면 "—"★ — 0% 와 "잴 수 없었다"는 다른 사실이다.
    if (x === null || x === undefined) return "—";
    return (Number(x) * 100).toFixed(1) + "%";
  }

  function renderGrowth(){
    var html = crumb([{ t: "홈", go: { view: "overview" } }, { t: "성장판" }]);

    var n = GROWTH_DATA.now || {};

    html += '<section><div class="sechead"><div><h2>지금</h2>' +

    // ★기존 카드 관례를 그대로 쓴다★ — 화면마다 다른 모양을 만들지 않는다.
    // ★★(S677 · 대표 지시) 오늘 브리핑 — ★부르기 전에는 아무 말도 안 한다★★★
    //   ★자동으로 안 부른다★ — 콘솔은 자주 열리고 이 호출에는 ★돈이 든다★.
    //   담당자가 누르실 때만 부른다(하루 한두 번이면 충분하다).
    //   ★숫자는 전부 화면에 이미 있다★ — 모델은 ★문장만★ 만든다(제0원칙).
    html += briefSection();

    html += '<div class="cards">' +

      "</div>";

    // ★★가장 중요한 숫자를 말로 한 번 더★★ — 표만 보면 지나친다.

              "자녀 앱이 안 깔리면 응원·용돈·걷기 보고가 전부 닿지 않습니다.</p>";
    }

    // ★★매출은 두 줄로 적는다 — 섞으면 거짓말이 된다★★

      " <span>· 연 구독은 매달 2,500원꼴</span></p></section>";

    // ── 달마다 ────────────────────────────────────────────────────────
    html += '<section><div class="sechead"><div><h2>달마다</h2>' +

  // ── 실증 지표판 (S609 · 대표 지시) ───────────────────────────────────
  //  ★★왜 만들었나★★
  //    대표 지시(2026-09-10) = "실증 지표판 … 해결해줘".
  //    IR 07장이 ★여덟 개 목표 지표★ 를 걸어 두었는데 ★세는 화면이 없었다★ —
  //    100명을 모아도 손으로 세면 ★4주가 끝난 뒤에야★ 답이 나온다.
  //    ★원자료는 이미 다 여기 와 있다★(DATA.daily) — 그래서 서버를 안 고치고 센다.
  //
  //  ★★넷은 셀 수 있고 넷은 못 센다 — 감추지 않는다 (2026-09-10 서버 실측)★★
  //    센다 = 4주 유지율 · 일 측정 성공률 · 주 3회 실천율 · 1인 평균 걸음
  //    ★못 센다★ = ①AI 권유 응답률 — ★서버에 자료가 0건★ 이다(단말 Room 의
  //      nudge_conversion 에만 있고 올라오는 길이 없다 · 서버에 표 자체가 없다)
  //      ②만족도 ③유료 전환 의향 ④재도입 의향 — ★설문이라 자동으로 못 센다★.
  //    ★못 세는 것을 빈칸으로 두지 않고 "왜 못 세는지"를 적는다★ — 빈칸은 고장으로
  //    읽히고, 고장으로 읽히면 아무도 이 화면을 안 본다(이 콘솔의 관통 원칙).
  //
  //  ★분모를 반드시 함께 적는다★ — "85%"만 적으면 두 사람 중 한 명인지 백 명 중
  //  여든다섯인지 알 수 없다. 이 콘솔은 ★평균 금지 · 대상 명시 · 근거 두께★ 다.
  var KPI = {
    /** 유지율의 기준 — IR 07장이 말하는 "4주". */
    retentionDays: 28,
    /** 최근 구간 — 주 단위 지표의 창. */
    recentDays: 7,
    /** "주 3회 이상 실천"의 기준 회수. */
    practiceDaysPerWeek: 3,
    /** IR 07장 목표치(표시용 · 판정에는 안 쓴다). */
    target: {
      retention: 80, measure: 85, practice: 55, steps: 1500,
    },
  };

  /** 그 어르신의 첫 기록일로부터 며칠 지났나. 기록이 없으면 null. */
  function firstSeenDaysAgo(id){
    var ds = dailyOf(id);
    if (!ds.length) return null;
    return daysBetween(ds[0].metric_date);
  }

  /** 최근 [n]일 안의 행들. */
  function recentRows(id, n){
    return dailyOf(id).filter(function(r){ return daysBetween(r.metric_date) < n; });
  }

  /**
   * 실증 지표 넷을 센다. ★못 세면 null★ — 0 이 아니다.
   *
   * ★"잰 날"의 정의는 상태판과 같다★ = step_count 칸이 있는 날(0 도 잰 날이다).
   * ★"걸으신 날"은 실외 걷기가 난 날★(stroll_distance_m > 0) — 실내 제자리걸음을
   * 실천으로 세면 IR 이 파는 그 숫자가 아니게 된다(대표 결정과 일관).
   */
  function studyKpi(){
    var ids = Object.keys(roster());
    var range = (DATA && DATA.range_days) ? DATA.range_days : 14;

    // ① 4주 유지율 — 대상은 ★28일보다 앞서 시작한 분★ 뿐이다(어제 오신 분을 셀 수 없다).
    var eligible = ids.filter(function(id){
      var d = firstSeenDaysAgo(id);
      return d !== null && d >= KPI.retentionDays;
    });
    var retained = eligible.filter(function(id){ return recentRows(id, KPI.recentDays).length > 0; });
    // ★창이 짧으면 아예 못 센다★ — 28일 앞을 볼 수 없으면 "0명"이 아니라 "모른다".
    var canRetention = range >= (KPI.retentionDays + KPI.recentDays);

    // ② 일 측정 성공률 — 최근 7일, ★사람×날★ 이 분모다.
    var slots = 0, measured = 0;
    // ③ 주 3회 이상 실천율 · ④ 1인 평균 일 걸음
    var practiced = 0, active = 0, stepSum = 0, stepDays = 0;
    ids.forEach(function(id){
      var rows = recentRows(id, KPI.recentDays);
      if (!rows.length) return;
      active++;
      slots += KPI.recentDays;
      var walkDays = 0;
      rows.forEach(function(r){
        if (r.step_count !== null && r.step_count !== undefined) {
          measured++;
          stepSum += num(r.step_count); stepDays++;
        }
        if (num(r.stroll_distance_m) > 0) walkDays++;
      });
      if (walkDays >= KPI.practiceDaysPerWeek) practiced++;
    });

    return {
      rangeDays: range,
      canRetention: canRetention,
      retentionEligible: eligible.length,
      retentionKept: retained.length,
      measureSlots: slots,
      measureDone: measured,
      activeElders: active,
      practiced: practiced,
      stepAvg: stepDays > 0 ? Math.round(stepSum / stepDays) : null,
      stepDays: stepDays,
    };
  }

  /** 백분율 한 칸. ★분모가 0 이면 "—"★ (0% 라고 적으면 실패로 읽힌다). */
  function pct(a, b){ return b > 0 ? Math.round(a / b * 100) + "%" : "—"; }

  // ── ★★(S625 · 2026-09-16) 앱 판올림 확산 — "옛 판이 사라졌는가"를 센다★★ ─────
  //   [왜 만들었나] 서버를 조이는 일이 전부 이 숫자 하나에 걸려 있다.
  //     · 기기 증표를 요구하는 통로를 늘리는 일
  //     · 익명 권한으로 열려 있는 DB 함수를 닫는 일
  //     ★둘 다 "옛 판을 쓰는 기기가 사라진 뒤에" 해야 한다★ — 먼저 닫으면
  //     그 기기들이 전부 끊기고, ★끊긴 어르신께는 아무 표시도 안 뜬다★.
  //   ★그런데 콘솔은 그 "퍼진 뒤"를 세지 않았다★ — 2026-09-16 에 기기 16대에
  //     앱이 ★10종★ 섞여 있고 최신판은 2대뿐인 것을 SQL 로 직접 세어서야 알았다.
  //     ★계획에 판정 기준이 없으면 그것은 계획이 아니라 바람이다.★
  //   ★여기서 "최신"을 코드에 박지 않는다★ — ★들어온 판번호 중 가장 큰 것★ 을
  //     최신으로 본다. 박아 두면 판을 올릴 때마다 이 화면이 stale 이 된다.
  function versionSpread(){
    var ids = Object.keys(roster());
    var byCode = {};
    var unknown = 0;
    ids.forEach(function(id){
      var h = latestHealth(id);
      var c = h ? num(h.app_version_code) : null;
      if (c === null) { unknown += 1; return; }
      if (!byCode[c]) byCode[c] = { code: c, name: (h.app_version_name || ""), n: 0 };
      byCode[c].n += 1;
    });
    var list = Object.keys(byCode).map(function(k){ return byCode[k]; })
      .sort(function(a, b){ return b.code - a.code; });
    return {
      list: list,
      unknown: unknown,
      total: ids.length,
      // ★가장 큰 판번호 = 지금 퍼지고 있는 판★. 하나도 없으면 null.
      latest: list.length > 0 ? list[0] : null,
    };
  }

  /** 판올림 확산 한 덩어리. */

    var v = versionSpread();
    var html = '<section><div class="sechead"><div><h2>앱 판올림 확산' +
      '<span class="whose">보안을 조이기 전에 이 줄을 봅니다</span></h2>' +
      '<div class="desc">서버 통로를 잠그는 일은 <b>옛 판을 쓰는 기기가 사라진 뒤에</b> 해야 합니다 — ' +
      '먼저 잠그면 그 기기들이 전부 끊기고, <b>끊긴 어르신께는 아무 표시도 뜨지 않습니다.</b><br>' +
      '“가장 새 판”은 지금 들어온 판번호 중 가장 큰 것입니다(화면이 스스로 고릅니다).</div>' +

    if (!v.latest) {

  // ── ★★(S625 · 2026-09-16) 지역별 묶음 — 지자체와 이야기할 때 쓰는 줄★★ ────────
  //   [왜 만들었나 · 멘토 지적 2026-09-15] "관리자에서 닉네임으로 해 놓으니
  //     누군지 전혀 모르겠다. ★무슨 동 사는 사람이 몇 명인지★."
  //   ★재료는 이미 있었다★ — `elderly.region` 칸도, 그것을 이름 옆에 한 조각으로
  //     붙이는 코드도 있었다. ★없던 것은 묶어 세는 자리였다.★
  //   ★여기서 새로 판정하지 않는다★ — 걸음·측정은 이미 나온 값을 접을 뿐이다.
  //   ★지역을 추측하지 않는다★ — 비어 있으면 "지역 미기입"으로 따로 세고,
  //     ★그 수가 곧 이 화면이 아직 못 쓰는 정도다★(숨기면 다 채워진 줄 안다).
  function regionRollup(){
    var m = roster();
    var byRegion = {};
    Object.keys(m).forEach(function(id){
      var key = (m[id].region || "").trim() || "(지역 미기입)";
      if (!byRegion[key]) byRegion[key] = { region: key, n: 0, measured: 0, stepSum: 0, stepDays: 0 };
      var g = byRegion[key];
      g.n += 1;
      var ds = dailyOf(id).slice(-7);
      var walked = false;
      ds.forEach(function(r){
        var s = num(r.step_count);
        if (s !== null && s > 0) { walked = true; g.stepSum += s; g.stepDays += 1; }
      });
      if (walked) g.measured += 1;
    });
    return Object.keys(byRegion).map(function(k){ return byRegion[k]; })
      .sort(function(a, b){
        // ★미기입은 언제나 맨 아래★ — 그것은 지역이 아니라 빈칸이다.
        if (a.region === "(지역 미기입)") return 1;
        if (b.region === "(지역 미기입)") return -1;
        return b.n - a.n;
      });
  }

  // ── 화면 1: 개요 ─────────────────────────────────────────────────────
  function renderOverview(){
    var rs = roster(), ids = Object.keys(rs);
    var quietHidden = quietHiddenCount();
    var reporting = ids.filter(function(id){ return dailyOf(id).length > 0; }).length;
    // ★(S508) 기기 상태 — 보고 중인 기기 수와 그중 이상이 있는 기기 수.
    //   ★두 숫자를 함께 보여 준다★: "이상 0명"만 적으면 아무도 보고를 안 해서 0인 것과
    //   정말로 다 멀쩡한 것이 같아 보인다(근거의 두께를 함께 적는다는 이 콘솔의 원칙).
    var devReporting = ids.filter(function(id){ return latestHealth(id) !== null; }).length;
    // ★★(S540) 보고가 끊긴 기기는 "기기 이상"으로 세지 않는다 — 경보 목록과 같은 규칙★★
    //   [무엇이 어긋나 있었나] 경보 목록(buildAlerts ④)은 ★이미★ staleDays 를 보고
    //   "보고가 끊긴 기기는 옛 값으로 판정하지 않는다"를 지키는데, ★이 요약 숫자만★
    //   날짜를 안 보고 마지막 값으로 판정했다. → ★같은 판정이 두 곳에서 다르게 났다★.
    //   2026-08-13 실측: 어제까지 보고하고 멈춘 기기 2대의 옛 값(마이크 15번 죽음 ·
    //   들은 적 없음)이 오늘 카드에 그대로 세어져 ★"기기 이상 6명" = 전원★ 이 됐다.
    //   ★전원에 뜨는 경보는 경보가 아니라 소음이고, 그 사이에서 진짜 고장이 묻힌다★(S508).
    //
    //   ★"끊김"을 0 으로 접지 않는다★ — 세지 않는 대신 ★따로 센다★(devStale).
    //   보고가 끊긴 것은 "이상 없음"이 아니라 ★다른 종류의 이상★ 이다. 그 사실은
    //   카드 부제에 그대로 적는다(근거의 두께를 함께 적는다는 이 콘솔의 원칙).
    //
    //   ★대표 질문("앱 삭제 때 신호를 보내면 되나")의 실제 답이 이 자리다★ —
    //   안드로이드는 자기 앱이 지워지는 것을 알 수 없어 삭제 신호를 만들 수 없다.
    //   그래서 ★서버가 침묵으로 판정한다★: 보고가 N일 없으면 떠난 것으로 본다.
    function healthGapOf(id){
      var h = latestHealth(id);
      if (!h) return null;
      return daysBetween(h.metric_date);
    }
    function isStaleDevice(id){
      var g = healthGapOf(id);
      return g !== null && g > DEVICE.staleDays;
    }
    var devStale = ids.filter(isStaleDevice).length;
    var devBad = ids.filter(function(id){
      if (isStaleDevice(id)) return false;
      // ★(S622-b) 개요 카드도 같은 자를 쓴다★ — 표에는 뜨는데 카드에는 안 세어지면
      //   "몇 명이 문제인가"가 표와 어긋난다.

    //   카드 = 자산 숫자(어르신 · 오늘 도착 · 누적) · 정보성 문구는 전량 걷어냈다(대표 지시).
    var todayStr = today();

    var totalDailyRows = (DATA.daily || []).length;

    //   걸음을 한 번이라도 잰 곳은 ★8곳뿐★ 이고 나머지 13곳도 ★행은 매일 오고 있었다★.

    //   마이크를 닫은 것(2026-09-03)이라 ★정상 상태가 매일 위험으로 뜨고 있었다★.

    //   이력에만 쌓으면 두 곳이 갈라진다(옛 recordAlerts 가 지키던 규율 그대로).

    html += '<div class="cards">' +
      // ★(S540) 숨긴 행이 몇 개인지 함께 적는다 — ★조용히 줄이면 그것이 고장으로 읽힌다★
      //   (어제까지 6명이던 숫자가 오늘 3명이 된 이유가 화면에 없으면 사람은 서버를 의심한다).
      //   ★숨기는 기준은 "우리 기기인가"가 아니라 "죽은 중복이거나 임시인가"다★(sql 061) —
      //   대표 폰·태블릿은 매일 실제로 도는 기기라 ★보여야 한다★(그 상태를 봐야 운영이 된다).
      //   숨긴 것은 재설치로 생긴 옛 device_id 와 시연용 앱이고, ★자료는 한 줄도 안 지웠다★.
      cardHtml("등록 어르신", ids.length + "명",

               (quietHidden > 0 ? " · 보름 넘게 조용한 " + quietHidden + "곳 숨김" : "")) +

      cardHtml("걸음을 재고 있는 곳", measuring + " / " + ids.length + "명",

    //   ①종합 추이 한 선 → ②정렬되는 상태판 → ③전후 비교. 그다음에야 기기·집계가 온다.

    ids.forEach(function(id){

  /**

   * ★여기서 숫자를 새로 만들지 않는다★ — 아래 [briefFacts] 가 ★화면이 이미 아는 것★

   * (★없는 말을 지어내느니 아무 말도 안 한다★).
   */
  function briefSection(){
    return '<section class="card" style="margin-bottom:14px"><div class="hd"><div>' +
      '<h2>오늘 브리핑 <span class="whose">화면에 있는 숫자만으로 적습니다 · 진단하지 않습니다</span></h2>' +
      '</div></div>' +
      '<div style="padding:4px 2px 2px">' +
      '<div id="briefText" class="muted" style="font-size:14px;line-height:1.65">' +
      '아래 단추를 누르시면 오늘 살펴볼 곳을 세 문장 안으로 적어 드립니다.</div>' +
      '<div style="margin-top:10px"><button class="btn" id="briefRun">오늘 브리핑 받기</button></div>' +
      '</div></section>';
  }

  /**
   * ★모델에게 줄 사실 목록★ — ★화면이 이미 아는 것만★ 옮긴다.
   * ★가명·기기 앞자리만 쓴다★(이름표는 사람이 적은 값이라 그대로 쓴다 —
   * 이 화면을 보는 사람은 이미 그것을 보고 있다). ★좌표·이메일은 안 보낸다.★
   */
  function briefFacts(){
    var rs = roster();
    var all = Object.keys(rs);
    var out = [];
    out.push("등록 어르신 " + all.length + "명");
    var quiet = 0, noStep = 0, lines = [];
    all.forEach(function(id){
      var r = rs[id];
      var name = labelOf(id) || (r && r.alias) || "이름표 없음";
      var ds = dailyOf(id) || [];
      var recent = ds.slice(-7);
      var stepDays = recent.filter(function(d){ return num(d.step_count) > 0; }).length;
      var steps = recent.reduce(function(a, d){ return a + num(d.step_count); }, 0);
      if (recent.length === 0) { quiet++; return; }
      if (stepDays === 0) { noStep++; lines.push(name + ": 최근 7일 걸음이 한 번도 안 잡힘"); return; }
      lines.push(name + ": 최근 7일 걸음 " + steps + "보(잰 날 " + stepDays + "일)");
    });
    if (quiet > 0) out.push("최근 자료가 아예 없는 곳 " + quiet + "곳");
    if (noStep > 0) out.push("걸음이 한 번도 안 잡힌 곳 " + noStep + "곳");
    return out.concat(lines.slice(0, 20));
  }

  function bindBrief(){
    var btn = el("briefRun");
    if (!btn) return;
    btn.addEventListener("click", function(){
      var box = el("briefText");
      btn.disabled = true;
      if (box) { box.textContent = "적는 중…"; }
      var facts = briefFacts();
      apiFetch(BRIEF, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mode: "brief", facts: facts }),
      }).then(function(r){ return r.text(); }).then(function(t){
        btn.disabled = false;
        var j = null; try { j = t ? JSON.parse(t) : null; } catch(e) {}
        // ★못 받으면 못 받았다고 적는다★ — 빈 칸으로 두면 "오늘은 볼 것이 없다"로 읽힌다.
        if (box) {
          box.textContent = (j && j.summary)
            ? j.summary
            : "지금은 브리핑을 받지 못했습니다 — 위의 표를 그대로 보시면 됩니다.";
        }
      }).catch(function(){
        btn.disabled = false;
        if (box) { box.textContent = "지금은 브리핑을 받지 못했습니다 — 위의 표를 그대로 보시면 됩니다."; }
      });
    });
  }

  /**

   *   (새벽 점검이 한 번 빠지면 이 절이 없는 순간 그 줄은 어느 화면에도 없다).

   * ★고독사를 잡자고 만든 규칙인데 정작 신호가 끊긴 분이 보름 동안 어느 화면에도 없었다.★
   *
   * ★그래서 문턱은 둘 다 살리고 볼 곳만 만든다★ — 15일에 메인에서 내려가되 여기 보이고,
   * 30일에 보관함으로 내려간다. ★감춘 것과 없는 것은 다르다.★
   */
  function quietRosterSection(){
    var rows = (DATA.roster || []).filter(function(r){
      return !r.archived_at && isLongQuiet(r.id);
    });
    if (!rows.length) return "";
    rows.sort(function(a, b){
      return (daysBetween(lastSignalDay(b.id)) || 0) - (daysBetween(lastSignalDay(a.id)) || 0);
    });
    var h = '<section class="card" style="margin-top:14px"><div class="hd"><div><h2>보름 넘게 조용한 줄 ' +
            rows.length + '명 <span class="whose">메인에서는 내렸습니다 · 다음 새벽 점검(03:40)에서 보관함으로 갑니다</span></h2></div></div>' +

            '<tr><th>가명</th><th>이름표</th><th>마지막 신호</th><th>며칠째</th><th>보호자</th></tr>';
    rows.forEach(function(r){

           "<td>" + (g === 0

             : g + "명") + "</td></tr>";
    });
    return h + "</table></div>" +
      '<div class="muted" style="font-size:12.5px;padding:8px 12px">' +
      '신호가 다시 오면 <b>그 다음 새로고침에 메인으로 돌아옵니다</b>. 자료는 지워지지 않았습니다.' +
      '</div></section>';
  }

  function bindUnarchive(){
    Array.prototype.forEach.call(document.querySelectorAll("[data-unarchive]"), function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-unarchive");
        btn.disabled = true;
        btn.textContent = "되돌리는 중…";
        rpc("console_set_elderly_archive", { p_elderly_id: id, p_archived: false }).then(function(r){
          if (r.ok) { btn.textContent = "되돌렸습니다 — 새로고침하세요"; }
          else { btn.disabled = false; btn.textContent = "실패 — " + rpcReason(r); }
        });
      });
    });
  }

  function bindUnhide(){
    Array.prototype.forEach.call(document.querySelectorAll("[data-unhide]"), function(btn){
      btn.addEventListener("click", function(){
